<h2>悚 <small>sǒng</small></h2>
<h3>释义</h3>
<p>【第372部「束部」】束＝捆縛；悚通聳，懼而毛骨聳然；悚从束得聲，歸束部。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：心收而悚。</p>
