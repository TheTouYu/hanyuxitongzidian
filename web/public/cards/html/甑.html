<h2>甑 <small>zèng</small></h2>
<h3>字根本义</h3>
<p>【470 瓦部】瓦＝象兩片瓦一覆一仰相扣之形，本指屋瓦，轉指陶器已燒之總名；音源取蓋瓦相擊之聲，形半圓故義音同「圭」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从瓦曾声：蒸飯瓦器，甑算其底。</p>
<h3>横向对照</h3>
<p>同取本部「覆扣成器／面具不可辨」两面：瓦旁定陶器，鬼旁定魂魄可畏。</p>
<h3>声母义</h3>
<p>z取凿：蒸氣穿孔。</p>
