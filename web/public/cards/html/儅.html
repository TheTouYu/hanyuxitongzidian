<h2>儅 <small>dāng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·當系（二级字根）】當＝从田尚聲，田與田相值（《說文》「田相值也」）；轉義對等相值→承受擔任→正當、應當，又表曾經。字族三面：相值對當／承受擔任／器物之中（底、當）。</p>
<h3>声母拟态</h3>
<p>d取囤动：人當而囤。</p>
