<h2>章 <small>zhāng</small></h2>
<h3>释义</h3>
<p>【第520部部首字·一級字根】甲骨文由〇和辛組成。〇指玉壁；“辛”，指刀。象意刀形的玉璧。“璋（zhāng）”的初文，《說文》：“剡上為圭，半圭為璋。从玉章聲。《禮》六幣：圭以馬，璋以皮，璧以帛，琮以錦，琥以繡，璜以黼。諸良切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
