<h2>䄼 <small>tiǎn</small></h2>
<h3>释义</h3>
<p>㐁部（第374部）部头：甲骨文象一块有斜纹的编织品，指席子，《廣雅》「席也」；或专指竹席，故引申为竹皮（《玉篇》「一曰竹上皮」）；席粗而暗，故又训「无光」；辯證：战国以后㐁、因相混，㐁不再单用，唯作尋、宿、迎等字构件时仍存席形，《說文》依小篆释为「舌皃」不确；音源：借音字，义音同「簟」。</p>
<h3>声母拟态</h3>
<p>席以承物，义从㐁之席；形符田则示所承者。</p>
