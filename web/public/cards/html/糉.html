<h2>糉 <small>zòng</small></h2>
<h3>释义</h3>
<p>象小兒腦門還未完全合攏的樣子。xìn，《說文》：“頭會，匘蓋也。象形。凡囟之屬皆从囟。，古文囟字。，或从肉、宰。息進切。”</p>
<h3>声母拟态</h3>
<p>精母z，「鑿總」取「總」：米總聚而裹。</p>
