<h2>栺 <small>yì</small></h2>
<h3>释义</h3>
<p>栺yì《廣韻》：“枍栺，殿名。”zhī，《廣韻》：“栺栭，木名。亦栺栭柱。”zhǐ，《集韻》：“木名。”</p>
<h3>声母拟态</h3>
<p>y 为零声母，绪论七组未列，不系（照实）。</p>
