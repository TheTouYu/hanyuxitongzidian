<h2>㝗 <small>lǎng</small></h2>
<h3>释义</h3>
<p>【第521部「良部」】良＝甲骨文象口之上下各有兩獠牙，為「狼」之初文；轉義狼崇拜→善美；辯證牙形小篆訛作「亡」，《說文》「从亯省亡聲」析形不確；音源為狼嚎聲。字族分「遊蕩／嚎叫／獠牙銳長／眼露凶光／狼尾狀」五面。</p>
<h3>声母拟态</h3>
<p>l「拢离」取「拢」：屋空而攏。</p>
