<h2>弄 <small>nòng</small></h2>
<h3>字根本义</h3>
<p>【502 <img class="cim" src="/glyphs/chars/20b1e.png">部】<img class="cim" src="/glyphs/chars/20b1e.png">（廾）＝象兩手竦舉之形，本義拱手、共舉；部內諸字皆从兩手取「捧持、共舉、執持」之義。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从廾从玉：兩手玩玉曰弄，引申戲弄。</p>
<h3>横向对照</h3>
<p>夅部取「下降相承」一面，<img class="cim" src="/glyphs/chars/20b1e.png">部取「兩手捧持共舉」一面；形符各定落點。</p>
<h3>声母义</h3>
<p>n「纳弄」取「弄」：手持而弄。</p>
