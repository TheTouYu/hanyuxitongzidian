<h2>鬄 <small>dí</small></h2>
<h3>釋義</h3>
<p>假发；以他发易己发</p>
<h3>字理分析</h3>
<p>聲旁「易」：其字形、本義、轉義、辯證、音源、字族衍義見字根卡「易」。</p>
<h3>聲母擬態</h3>
<p>今讀 dí，按聲母取緒論擬態義一面（推）。</p>
