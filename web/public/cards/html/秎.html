<h2>秎 <small>fèn</small></h2>
<h3>字根本义</h3>
<p>【437 八部·分部】分＝从刀八声，剖开；诸字取「分散、香气、水石、数量」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《广韵》「穧秎，获也」——收割，禾束。</p>
<h3>横向对照</h3>
<p>同取本部「分散／分剖」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>f取分：禾分而束。</p>
