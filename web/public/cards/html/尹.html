<h2>尹 <small>yǐn</small></h2>
<h3>释义</h3>
<p>【第174部部首字·一級字根】从又（手）持ㄧ。“ㄧ”具體是指什麼？有說是指權杖；有說是指筆；其實也可以說是牧牛羊用的鞭子之類；或者是指符節、圭玉之類憑信……總之，是代表權力的信物或行使權力的工具。象意管理政務的官員。yǐn，《說文》：“治也。从又、丿，握事者也。，古文尹。餘凖切。”《廣雅》：“官也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yǐn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
