<h2>素 <small>sù</small></h2>
<h3>释义</h3>
<p>【第373部部首字·一級字根】根據“素”的衍生字“傃、<img class="cim" src="/glyphs/chars/2616b.png">（紷）”的甲骨文來看，其初文當為，从（糸）从， 亦聲。“糸”象絲線絞合形，指績成的紗；“”表示集束之意。象意用紗線織成的生帛。sù，《玉篇》：“白緻繒也。”《廣韻》：“帛也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 s（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
