<h2>䆘 <small>yā</small></h2>
<h3>释义</h3>
<p>【第567部「七部」】七＝从一加指示符（切刻之初文）；甲支＝从甲（硬殼、逼窄），本批皆甲支余字。</p>
<h3>声母拟态</h3>
<p>y取远渊：刺穴而远。</p>
