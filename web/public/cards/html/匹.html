<h2>匹 <small>pǐ</small></h2>
<h3>释义</h3>
<p>【第129部部首字·一級字根】西周金文本从石从乙，乙亦聲。“乙”指拖曳，象意能爬行的石塊，即蚌蜃。與“辰”比較，肉沒有伸出蚌殼之外，表示閉合的蚌蜃。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 p（擬態「拼辟」），取「辟」一面；本部未列 02z 表，按緒論推。</p>
