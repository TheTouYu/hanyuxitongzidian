<h2>疢 <small>chèn</small></h2>
<h3>释义</h3>
<p>【第550部「火部」】火＝象火焰上騰之形（《說文》「燬也，南方之行，炎而上，象形」）；轉義燃燒、火氣、怒、急速；字族 耿（光）、煩（熱頭痛）、赤（火色）、焦（火所傷）、麃（火燒）。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：病熱而持。</p>
