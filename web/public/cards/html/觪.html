<h2>觪 <small>xīng</small></h2>
<h3>释义</h3>
<p>【第556部「辛部」】辛（䇂）＝象小刻刀，刻字紋身；部内四系 言／<img class="cim" src="/glyphs/chars/234c0.png">親／新／豙。辛辣之味亦由辛來，故从辛之字多兼「刺、痛、細」義。</p>
