<h2>松 <small>sōng</small></h2>
<h3>本义</h3>
<p>松，sōng：从木公聲，松樹，取公之聲（原稿字卡條）。</p>
<h3>转义</h3>
<p>引申为松散、放松（后起义）。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：松针聚而收（推）。</p>
<h3>借字说明</h3>
<p>松与「鬆」为同音借用关系（今「松」兼作鬆之简化），非本字。</p>
