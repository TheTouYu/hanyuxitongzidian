<h2>乂 <small>yì</small></h2>
<h3>释义</h3>
<p>【第561部部首字·一級字根】象交叉的傷痕形。或添“刀”為“刈”，yì，《玉篇》：“取也，殺也。”《韻會》：“絕也。”《說文》：“芟艸也。从丿从乀相交。，乂或从刀。魚廢切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yì）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
