<h2>伉 <small>kàng</small></h2>
<h3>释义</h3>
<p>【第598部「亢部」】亢＝象人頸（喉管）之形，《說文》「人頸也」；頸直而高，引申高亢、抗禦、亢旱。</p>
<h3>声母拟态</h3>
<p>k取口控：人匹而控。</p>
