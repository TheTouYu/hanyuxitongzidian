<h2>力 <small>lì</small></h2>
<h3>释义</h3>
<p>【第571部部首字·一級字根】“力、耒”本是同源字，象耒形。最初實際上就是一個有弧度的樹杈。lì，《說文》：“耒，手耕曲木也。”彎畫指曲木，橫畫為固定在上面的橫木，便于用腳踩。後來，逐步改進，演變成為犁。由人力進而利用畜力。因此，也可以說是“犁”的初文。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
