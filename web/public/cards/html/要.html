<h2>要 <small>yāo</small></h2>
<h3>释义</h3>
<p>【第589部部首字·一級字根】甲骨文从<img class="cim" src="/glyphs/chars/26951.png">从妟。“妟”本女子安樂皃；从“<img class="cim" src="/glyphs/chars/26951.png">”，象意雙手叉腰；或指抱住女子腰部形。yāo，《玉篇》：“腰，骻也。本作要。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yāo）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
