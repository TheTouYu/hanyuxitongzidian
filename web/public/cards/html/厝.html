<h2>厝 <small>cuò</small></h2>
<h3>字根本义</h3>
<p>【416 昔部（从日<img class="cim" src="/glyphs/chars/21fe7.png">声）】昔＝从日<img class="cim" src="/glyphs/chars/21fe7.png">声：太阳入水为夜，或水面映日；引申指过去、以往（《玉篇》「往也、久也、昨也」），又引申指涂饰（与「错」通）。字族衍义：①涂饰／错磨交错 ②往昔→安置、吝惜、时间久。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「厉石也」——磨刀石；又「置也」安置、归葬。</p>
<h3>横向对照</h3>
<p>同取本部「往昔之久／水淹而黑」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>c「刺持」取「刺」：石刺而砺。</p>
