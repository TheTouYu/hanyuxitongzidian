<h2>亯 <small></small></h2>
<h3>释义</h3>
<p>【第289部部首字·一級字根】从高下塞口，應指其下面不是空的，而是一個高臺。所从“”可視為象其形，金文或為“○”，應為祭壇的象形。其形制大抵遵循天圓地方的認識，底座為方形，上面為圓形。考古發現鄭州小雙橋商代祭祀遺址中，就有一高臺型夯土基址：位於遺址東北部，當地人稱之為“周勃墓”，經勘探發現，台基由黃砂土摻褐色粘土逐層夯打而成，東西長50米，南北寬40米，周長200余米，面積約2000平方米，台頂高達12米，台基頂部有厚達80釐米的紅燒土堆積。</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 無；未列 02z，按緒論取一面未判（02z 未收）。</p>
