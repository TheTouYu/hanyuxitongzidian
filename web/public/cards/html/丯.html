<h2>丯 <small>jiè</small></h2>
<h3>释义</h3>
<p>【第570部部首字·一級字根】為“七”的上下各刻一橫之形，表示鍥刻很多紋路之意。jiè，《六書故》：“丯卽㓞字。从刀，刀所以刻也；丯象所刻之齒。以丯為聲。”《释名·释书契》中说：“契，刻也，刻识其数也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
