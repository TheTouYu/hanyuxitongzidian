<h2>去 <small>qù</small></h2>
<h3>释义</h3>
<p>【第49部部首字·一級字根】从大从口。“大”指騎跨；也可比喻為騎跨狀。“口”，本指嘴；也可指口狀物，比如器皿。因此，可象意多種：</p>
<h3>声母拟态</h3>
<p>聲母義（去部）：声母义（q·强） 辨證：由于小篆將“口”演變成“凵”，故《說文》：“人相違也。从大<img class="cim" src="/glyphs/chars/20674.png">聲。凡去之屬皆从去。丘據切。”“凵”雖然也有“口”的意思，但不能準確表現“去”的諸多含義，故析形不確。</p>
