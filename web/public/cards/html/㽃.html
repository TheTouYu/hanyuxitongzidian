<h2>㽃 <small>pān</small></h2>
<h3>字根本义</h3>
<p>【434 釆部·番支】番＝簸箕簸扬筛杂（播之初文）；字族取翻动、繁殖、兽足诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「㽃瓳，大㼾甎也」——大砖；开封城火器迸发时「㽃瓳飞鸣」。</p>
<h3>横向对照</h3>
<p>同取番部「翻动／繁殖／兽足」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p取辟：块分为砖。</p>
