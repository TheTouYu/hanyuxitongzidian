<h2><img class="cim" src="/glyphs/chars/23922.png"> <small>xì</small></h2>
<h3>字根本义</h3>
<p>【450 叀部】毄支取「纺车转动相击、缠结、坚硬」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「且唾聲，一曰小笑」——唾声、轻笑；疑「嗀」之异体。</p>
<h3>横向对照</h3>
<p>同取叀部「轮转相击、缠结坚硬」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>x「续消」取「消」：气出而消。</p>
