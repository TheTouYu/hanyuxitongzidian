<h2>蹤 <small>zōng</small></h2>
<h3>字根本义</h3>
<p>【505 从部】从＝从二人相隨，本義跟隨（《說文》「相聽也」）；轉義順從、參與、自。部內从从諸字取「相隨、聚」兩面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从足從聲：足跡（「蹤跡」），取從之隨行。</p>
<h3>横向对照</h3>
<p>曾部取「重疊增加」，亙部取「迴環延續」，从部取「相隨而聚」；形符各定落點。</p>
<h3>声母义</h3>
<p>z取凿：足鑿留跡。</p>
