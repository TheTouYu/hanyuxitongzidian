<h2>災 <small>zāi</small></h2>
<h3>字根本义</h3>
<p>【416 <img class="cim" src="/glyphs/chars/21fe7.png">部（災）】<img class="cim" src="/glyphs/chars/21fe7.png">＝象三水横流之形，表示洪水泛滥；后加「才」作声符，与「卂」同源，表示「载」——被洪水覆盖。转义：由洪水泛滥成灾，引申指其他自然灾害与祸害（《类篇》「害也」）。辯證：表声的「才」在小篆中演化成「一」，故《说文》「从一雝川」析形不确。字族衍义：多以衍生字「昔、甾」为声。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>象三水横流，洪水泛滥；加「才」为声，与卂同源表覆盖。</p>
<h3>横向对照</h3>
<p>同取本部「洪水覆盖／错磨涂饰」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>z「凿总」取「凿」：水凿而灾。</p>
