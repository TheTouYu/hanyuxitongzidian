<h2>交 <small>jiāo</small></h2>
<h3>释义</h3>
<p>【第105部部首字·一級字根】初期甲骨文本从它从乂，象意兩蛇相交，指交配。jiāo，《廣雅》：“合也。”或象意蛇的纏物，“絞（jiǎo）”的初文，《說文》：“縊也。”《廣韻》：“縛也。”</p>
<h3>声母拟态</h3>
<p>聲母義（交部）：声母义（j·强） 辨證：由于“它”的下部寫攏以後，形同“大”字，故《說文》：“交脛也。从大，象交形。凡交之屬皆从交。古爻切。”析形不確。</p>
