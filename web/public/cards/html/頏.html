<h2>頏 <small>háng</small></h2>
<h3>释义</h3>
<p>【第598部「亢部」】亢＝象人頸之形，頸直而高；字族多取「高、直、空、乾」一面。</p>
<h3>声母拟态</h3>
<p>h取豁活：鳥上下而豁。</p>
