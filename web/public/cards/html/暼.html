<h2>暼 <small>piē</small></h2>
<h3>字根本义</h3>
<p>【439 㡀部】㡀（bì）＝从巾从八，一幅布狭小而破败，为「敝」之初文；引申小、破旧、屏障、昏暗。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「暼暼，日落势也」——日落之状。</p>
<h3>横向对照</h3>
<p>同取㡀部「破布／狭小」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p取辟：光散而分。</p>
