<h2>贃 <small>wàn</small></h2>
<h3>字根本义</h3>
<p>【445 串部】串＝象串珠形（《正字通》「物相連貫也」），引申穿、亲近、积习；字族多表连续、成串、环绕。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韻》「鋌也」——金属坯；《正字通》「餘財」——余财。</p>
<h3>横向对照</h3>
<p>同取串部「连贯／穿过／环绕」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>w「勿问」取「问」：财蓄而问。</p>
