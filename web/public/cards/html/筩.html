<h2>筩 <small>tǒng</small></h2>
<h3>释义</h3>
<p>【第597部「用部」】用＝象蟲蛹形，「蛹」之初文（《說文》「繭蟲也」）；蛹是幼蟲化成蟲的過渡形態、工具性存在，用畢即棄，故引申施行、使用、處理、能力、資財、器物、花費、憑藉、租借；部內「甬」指中空之蛹→中空通道。</p>
<h3>声母拟态</h3>
<p>t取涂突：竹中空而突。</p>
