<h2>碿 <small>sù</small></h2>
<h3>釋義</h3>
<p>碿sù、xiè《正字通》：“磨也。一曰碎石也。當讀如屑。”</p>
<h3>字理分析</h3>
<p>聲旁為「屑」，其古文字字形、本義、轉義、辯證、音源、字族衍義見字根卡「屑」（本頁會自動鏈接呈現）。</p>
