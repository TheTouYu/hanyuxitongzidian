<h2>兌 <small>duì</small></h2>
<h3>释义</h3>
<p>【第247部部首字·一級字根】从八从兄。“兄”指成人；“八”分開、裂開。象意一些動物成長過程中，表皮裂開而再生的現象。即“蛻（tuì）”的初文，《說文》：“蛇蟬所解皮也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 d（擬態「囤动」），取「动」一面；本部未列 02z 表，按緒論推。</p>
