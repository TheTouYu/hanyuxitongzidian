<h2><img class="cim" src="/glyphs/chars/2a5f8.png"> <small>míng</small></h2>
<h3>释义</h3>
<p>部頭名：从口从夕，夜晚昏暗互不相見而自報姓名（《說文》「自命也…冥不相見，故以口自名」）。轉義名稱、旌表、辨明、大而成人。音源：義音同「冥」。字族衍義：①夜晚朦朧 ②名字→銘刻辨明。</p>
<h3>声母拟态</h3>
<p>明母m，「蒙末」取「蒙」。</p>
