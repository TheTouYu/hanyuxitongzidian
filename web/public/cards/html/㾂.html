<h2>㾂 <small>hāi</small></h2>
<h3>释义</h3>
<p>㾂，hāi：《唐韻》「病也」，久病不愈——如懷胎十月之久，故从疒（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>h「豁活」取「活」：《唐韻》「病也」——久病之人，求活而已。</p>
