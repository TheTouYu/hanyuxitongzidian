<h2>悔 <small>huǐ</small></h2>
<h3>释义</h3>
<p>【第262部「母部」】母（<img class="cim" src="/glyphs/chars/23aed.png">）＝生育之母；悔取如梅子之酸、孕期反應（《說文》从心<img class="cim" src="/glyphs/chars/23aed.png">聲）；悔从母得聲，歸母部。</p>
<h3>声母拟态</h3>
<p>h取豁活：心豁而悔。</p>
