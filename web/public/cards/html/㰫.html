<h2>㰫 <small>chān</small></h2>
<h3>释义</h3>
<p>【第558部「先部」】先＝从「止」在「人」頭頂，象人走在前面；部内余字多為「先」聲而各取一義面（魚、豕、散、欣、癬、粉、盛、老弱、覗、守門、金澤）。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：欣而持。</p>
