<h2>蚣 <small>gōng</small></h2>
<h3>字根本义</h3>
<p>【496 公部】公＝从八从厶：八者分也，厶者私也，分之私則為公；本義公平、公共（《說文》「平分也」），轉義公侯、祖父、雄性。部內从公諸字取「平分、分張」兩面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从虫公聲：「蜈蚣」，百足之蟲。</p>
<h3>横向对照</h3>
<p>同取公部「分私為公、分張」一面：羽取其毛，衣取其紋，言取其爭。</p>
<h3>声母义</h3>
<p>g取隔：足多而隔。</p>
