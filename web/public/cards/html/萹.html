<h2>萹 <small>biān</small></h2>
<h3>字根本义</h3>
<p>【439 扁部】扁＝门牌，本义「署」；诸字取门牌之扁、薄、普遍、分别四面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「萹茿也，从艸扁聲」；《爾雅》「竹萹蓄」——萹竹，布地而生。</p>
<h3>横向对照</h3>
<p>同取扁部「扁平／普遍/分别」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b取剥：枝叶铺分。</p>
