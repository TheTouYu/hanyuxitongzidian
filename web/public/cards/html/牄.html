<h2>牄 <small>qiāng</small></h2>
<h3>释义</h3>
<p>【第534部「爿部」】爿（片丬）＝象豎起的床形（長豎為床板、旁為床足），「牀」之初文（《說文》「安身之坐者」）；轉義床面由剖木鋪成→木片（分化作「片」，《廣韻》「析木也」）、剖開（《玉篇》「半也、判也」）。辯證：小篆形似「木」之半，故《說文》釋「片，判木也。从半木」不確。音源借音：古爿、相可通（《詩》「我倉既盈」一本作「箱」）。字族：①床或如床狀 ②剖木片狀。</p>
<h3>声母拟态</h3>
<p>q取亲缺：聲親而缺。</p>
