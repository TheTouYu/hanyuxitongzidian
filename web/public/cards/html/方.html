<h2>方 <small>fāng</small></h2>
<h3>释义</h3>
<p>【第109部部首字·一級字根】象拮皋之形。指拮皋。上部跟“录”相同，象拮皋的橫樑與支架；下所从，象勺，指汲水之器。</p>
<h3>声母拟态</h3>
<p>聲母義（方部）：声母义（f·强） 辨證：《說文》：“並船也。象兩舟省、總頭形。凡方之屬皆从方。，方或从水。府良切。”形義皆不確。</p>
