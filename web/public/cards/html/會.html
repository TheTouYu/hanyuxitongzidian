<h2>會 <small>huì</small></h2>
<h3>释义</h3>
<p>【第285部部首字·一級字根】甲骨文本从合从囦，囦亦聲。“囦”即“<img class="cim" src="/glyphs/chars/23d92.png">”，指深溝；从“合”，象意“溝氹”，也叫“灰坑”，一般在廚房外邊，深挖一坑，用于傾倒污水和生活垃圾，跟現在的垃圾坑差不多。但古代的垃圾沒有如今的塑膠之類，都是可以降解的，能夠漚作肥料；因此，還特意放進去草皮、樹葉等。其意跟“澮（huá）”接近，《集韻》：“雨水合也。”收集雨水的溝氹。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 h（擬態「豁活」），取「豁」一面；本部未列 02z 表，按緒論推。</p>
