<h2>爪 <small>zhǎo</small></h2>
<h3>释义</h3>
<p>【第586部部首字·一級字根】甲骨文象動物的趾（指）爪形；西周金文在趾（指）尖部位又加上指示符號，表示趾（指）甲。zhǎo，《說文》：“爪，丮也。覆手曰爪。象形。凡爪之屬皆从爪。側狡切。”或反寫作“<img class="cim" src="/glyphs/chars/244ef.png">（zhǎng），”《說文》：“<img class="cim" src="/glyphs/chars/244ef.png">，亦丮也。从反爪。闕。諸兩切。”《釋名》：“紹也，筋極為爪，紹續指端也。”《六書故》：“鳥爪也，獸亦有爪。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
