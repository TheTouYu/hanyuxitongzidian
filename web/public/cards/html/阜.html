<h2>阜 <small>fù</small></h2>
<h3>释义</h3>
<p>【第145部部首字·一級字根】甲骨文象陡峭的階梯形。既可是在山石上鑿成的，也可是用木頭架成的。《康典》引《<img class="cim" src="/glyphs/chars/28ef0.png">第·詩古音考》：“阜字，可上可去。”說的雖然是讀音，但不能說跟意義就沒有關係。因為漢字的讀音變化往往體現了字義的變化。其字多被“降、陟、阩”等作為形符，表示从梯級上下之意。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
