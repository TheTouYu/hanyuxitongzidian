<h2>櫪 <small>lì</small></h2>
<h3>字根本义</h3>
<p>【425 秝部】秝＝从二禾，象禾苗排列稀疏或秸秆堆积；歷支取「禾之春种秋收→逐一经过」一面：历法、经历、过滤、夹持，皆由一行行经过而来。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「櫪㯕，椑指也」——夹手指的刑具；又马槽、马房、蚕箔。</p>
<h3>横向对照</h3>
<p>同取歷「逐一经过／离析」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>l取离：木条并列相夹。</p>
