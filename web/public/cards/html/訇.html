<h2>訇 <small>hōng</small></h2>
<h3>字根本义</h3>
<p>【451 回部】旬支余字取「周遍、信实、山玉」诸面；訇支取「大声轰响、周遍震动」之面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「騃言聲」；《广韵》「匉訇，大聲」——大声轰响，周遍震动。</p>
<h3>横向对照</h3>
<p>同取旬／訇支「周遍、轰响」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>h「豁活」取「活」：声响而活。</p>
