<h2><img class="cim" src="/glyphs/chars/20b2a.png"> <small>biào</small></h2>
<h3>释义</h3>
<p>【第144部部首字·一級字根】商代金文或象兩人伸手上下相對形；或象兩手相對。既可以象意兩人之間交付東西。biào，《說文》：“物落，上下相付也。从爪从又。凡<img class="cim" src="/glyphs/chars/20b2a.png">之屬皆从<img class="cim" src="/glyphs/chars/20b2a.png">。讀若《詩》‘摽有梅’。平小切。”也可象意同一人在用兩手反方向地从事某個行為。此義分化作“寽”。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
