<h2>表 <small>biǎo</small></h2>
<h3>释义</h3>
<p>【第143部部首字·一級字根】根據《古籀彙編》所錄古匋文來看，“表”本从生从衣。“生”本指植物發芽，引申指動植物的新生；“衣”，本指衣服，引申指鳥雀蟲蟻類卵生動物的卵殼、植物種子的表皮、人畜類胎生動物的胞衣等。因此，其義當同“胞”。母系血親稱“表”，跟父系血親稱“胞”，其實都是指具有共同的血緣關係。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
