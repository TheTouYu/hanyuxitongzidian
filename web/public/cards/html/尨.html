<h2>尨 <small>máng</small></h2>
<h3>释义</h3>
<p>【第275部部首字·一級字根】从犬从彡，象意犬屬而毛長的動物。máng，《說文》：“犬之多毛者。从犬，从彡。《詩》曰‘無使尨也吠。’莫江切。”《說文系傳》：“徐曰：彡，毛長也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
