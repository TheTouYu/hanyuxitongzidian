<h2>廣 <small>guǎng</small></h2>
<h3>释义</h3>
<p>【第515部「黃部」·廣支】廣＝甲骨文从宀从黃，象四周無壁的大殿（《說文》「殿之大屋也」）；轉義廣大、寬遠；由開闊比喻心胸開闊。</p>
<h3>声母拟态</h3>
<p>g「隔估」取「隔」：隔牆而敞。</p>
