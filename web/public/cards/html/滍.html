<h2>滍 <small>zhì</small></h2>
<h3>字根本义</h3>
<p>《说文》「水，出南陽魯陽堯山，東北入汝」——沙河，汝水支流。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>蛇行族①之水：以「水」定其地，蜿蜒如蛇行。</p>
<h3>横向对照</h3>
<p>同取蚩部「蛇行迟缓／蛇貌可笑」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>zh「凿总」取「总」：众流总汇。</p>
