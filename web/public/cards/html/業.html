<h2>業 <small>yè</small></h2>
<h3>释义</h3>
<p>【第52部部首字·一級字根】西周金文从二業去聲。“業”从兄从丵，“兄”後來演變成“大”，含義實跟“僕”同，指童僕；“去”指跨。象意兩個童僕相對抬舉，表示懸掛鐘鼓的架子。最初可能直接用僕人抬舉。後來才用人形的雕像代替。yè，《說文》：“大版也。所以飾懸鐘鼓。捷業如鋸齒，以白畫之。象其鉏鋙相承也。从丵，从巾，巾象版。《詩》曰：‘巨業維樅。’，古文業。魚怯切。”後省去表聲的“去”，只餘下一個“業”字，今簡化作“业”。因此，本應歸入《去部》。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第52部），無擬態聲母義可系，義靠義類與字形。</p>
