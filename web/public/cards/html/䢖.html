<h2>䢖 <small>yù</small></h2>
<h3>字根本义</h3>
<p>【427 聿部】聿＝从又持半竹，象手持竹作工具（书写是其一种，兼可作刷、作箫、作篙、作箸）；分化出者、晝、畫、肅、肁、盡诸字。转义：竹器轻便→轻捷；书写→讲述、依循。辨证：<img class="cim" src="/glyphs/chars/26612.png">、聿本一字，《说文》「从<img class="cim" src="/glyphs/chars/26612.png">一聲」析形不确。音源：源自竹笔书写声。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「分布也，又行貌」——分布、行走之状。</p>
<h3>横向对照</h3>
<p>同取聿「手持竹笔」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>y取锐：行而分布。</p>
