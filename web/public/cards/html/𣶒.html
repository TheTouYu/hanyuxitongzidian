<h2><img class="cim" src="/glyphs/chars/23d92.png"> <small>yuān</small></h2>
<h3>释义</h3>
<p>【第283部部首字·一級字根】甲骨文从水从囗，囗亦聲。“囗”指封閉的區域；从“水”，象意深水池。yuān，《玉篇》：“水停。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yuān）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
