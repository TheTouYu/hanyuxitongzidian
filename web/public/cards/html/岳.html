<h2>岳 <small>yuè</small></h2>
<h3>释义</h3>
<p>【第215部部首字·一級字根】象山嶽層巒疊嶂之形。指高大的山。yuè，《六書精蘊》：“ 象峻極形，峯上複起高峯。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yuè）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
