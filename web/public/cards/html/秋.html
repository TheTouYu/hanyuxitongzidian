<h2>秋 <small>qiū</small></h2>
<h3>释义</h3>
<p>【第540部部首字·一級字根】甲骨文本象蟋蟀形。天氣入秋時，蟋蟀入戶，鳴聲響亮，恍惚如催促人們趕緊紡織以準備過冬的衣服，所以俗稱“促織”“紡織娘”。古代分春秋兩季，故以其代表秋。為了區別其本義的指蟋蟀，便在下面加上“火”作“<img class="cim" src="/glyphs/chars/2a6b0.png">”。从“火”，表示秋天的乾燥，以及萬物的焦枯。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 q（擬態「亲缺」），取「缺」一面；本部未列 02z 表，按緒論推。</p>
