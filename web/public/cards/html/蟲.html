<h2>蟲 <small>chóng</small></h2>
<h3>释义</h3>
<p>【第194部部首字·一級字根】从虫的二疊或三疊。“虫”，本象蛇形，指蛇，跟“它”同源；疊體，表示數量多，或性狀的極致。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
