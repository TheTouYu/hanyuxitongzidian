<h2>蜾 <small>guǒ / luǒ</small></h2>
<h3>释义</h3>
<p>果為第348部部頭（《卷六十  <img class="cim" src="/glyphs/chars/267c0.png">.docx》p241）：「木實也，从木，象果形在木之上」——樹上果實。部內諸字从果得聲，取「包於皮內、中空含實、去殼見實、圓轉」諸面。</p>
<h3>声母拟态</h3>
<p>見母g，「隔估」取「隔」：泥巢隔風雨而護其子。</p>
