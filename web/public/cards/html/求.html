<h2>求 <small>qiú</small></h2>
<h3>释义</h3>
<p>【第541部部首字·一級字根】“求”跟“杀”本是同源字（參見55《杀部》）。甲骨文从尾（倒“毛”）上加一橫作指示符號，既可象事指割取動物尾巴，表示“杀”的意思；也可象意動物尾巴所發生的行為，表示“求”的意思。西周金文分化成兩字。而將“求”寫成从（尾）从（九），“九”亦聲。“九”即肘，表示象肘一樣屈曲。象意動物的屈曲或搖動尾巴，表示友好、乞求之意。qiú，《玉篇》：“用也、索也。”《正字通》：“覓也。乞也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 q（擬態「亲缺」），取「缺」一面；本部未列 02z 表，按緒論推。</p>
