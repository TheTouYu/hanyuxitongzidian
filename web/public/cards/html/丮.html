<h2>丮 <small>jǐ</small></h2>
<h3>释义</h3>
<p>【第375部部首字·一級字根】象兩手同時拾掇之形。與“<img class="cim" src="/glyphs/chars/20b1e.png">、共”等相比，應不只是多了個人形那麼簡單：“收、共”的含義局限于雙手捧、提等簡單的動作；而“丮”則指雙手進行複雜的勞作，並且雙手是不可分開的活動。jǐ，《說文》：“持也。象手有所丮據之形。凡丮之屬皆从丮。讀若<img class="cim" src="/glyphs/chars/229e2.png">。幾劇切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
