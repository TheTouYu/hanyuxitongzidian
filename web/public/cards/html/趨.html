<h2>趨 <small>qū</small></h2>
<h3>释义</h3>
<p>芻部部头作「又」（手）持斷艸斷木之形，本義拔草、採枝葉；《說文》析作「象包束艸之形」不確（小篆訛「又」為「包」），楷化又或訛「又」為「丑」。</p>
<h3>声母拟态</h3>
<p>边走边吃，取「趋走」一面。</p>
