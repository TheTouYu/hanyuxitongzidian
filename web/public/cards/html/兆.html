<h2>兆 <small>zhào</small></h2>
<h3>释义</h3>
<p>【第222部部首字·一級字根】甲骨文从北从水，象兩人隔水相背之形，指以水為分界線。《周禮·夏官·掌固》：“凡國都之竟，有溝樹之固。郊以如之。若有山川，則因之。”可見古代的邊境，要麼是依據自然山川；若是沒有，則開溝渠為界。zhào，《爾雅》：“域也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
