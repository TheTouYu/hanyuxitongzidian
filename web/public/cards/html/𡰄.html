<h2><img class="cim" src="/glyphs/chars/21c04.png"> <small>xí</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/21c04.png">（<img class="cim" src="/glyphs/chars/21c16.png">）xí《玉篇》：“不能行，爲人所引。”《集韻》：“<img class="cim" src="/glyphs/chars/21c16.png">，<img class="cim" src="/glyphs/chars/21c16.png"><img class="cim" src="/glyphs/chars/21c22.png">，行跛。或从奚。”《正字通》：“<img class="cim" src="/glyphs/chars/21c16.png">字之譌。”應是音義相同，非訛字。</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：不能行，為人所引，續牽而行。</p>
