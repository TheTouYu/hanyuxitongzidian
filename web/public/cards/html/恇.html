<h2>恇 <small>kuāng</small></h2>
<h3>释义</h3>
<p>【第514部「匚部」】匚＝甲骨文象槽形器，指箭杆矯正器：火烤彎處、嵌槽抽拉使直，為「匡」之初文（《廣韻》「輔助也。正也」）；轉義放逐、方器、筐；辯證《說文》「匸」與「匚」同字，與「曲」形近而混；音源為抽拉箭杆之聲。</p>
<h3>声母拟态</h3>
<p>k取口控：心控而怯。</p>
