<h2>臧 <small>zāng</small></h2>
<h3>释义</h3>
<p>【第534部「爿部」·臧系】臧＝从臣从戕（戈），以戈守臣（家奴），《說文》「善也」；引申藏匿（臧／藏通用）。</p>
<h3>声母拟态</h3>
<p>z「凿总」取「凿」：守而实。</p>
