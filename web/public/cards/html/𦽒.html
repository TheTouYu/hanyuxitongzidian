<h2><img class="cim" src="/glyphs/chars/26f52.png"> <small>zéi</small></h2>
<h3>字根本义</h3>
<p>【401 则部·贼】「贼（贼戝<img class="cim" src="/glyphs/chars/27d6a.png"><img class="cim" src="/glyphs/chars/27db1.png">）」从戈则声：「戈」指武器，「则」指偏斜，象意不正当使用武力，表示违法、犯罪（《玉篇》「盗也、伤害人也」，《说文》「败也」昨则切）。字族衍义：①指伤害、残害 ②形近「贱」之讹。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿则部有「▲制作鼎的模型」「▲方鼎铸范与装配示意图」。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「木<img class="cim" src="/glyphs/chars/26f52.png">草」；《本草纲目》「此草有节而糙涩，治木骨者用之磋擦则光净，犹云木之贼也，故名木贼草」。</p>
<h3>横向对照</h3>
<p>贼族①之草：以「艸」定其类，磋木之草名为「木之贼」。</p>
<h3>声母义</h3>
<p>z「凿总」取「凿」：糙叶凿木。</p>
