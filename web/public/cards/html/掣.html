<h2>掣 <small>chè</small></h2>
<h3>释义</h3>
<p>【第577部「制部」】制＝甲骨文从木从刀，象給樹木整枝／砍樹／加工木頭，引申禁止、約束、法度、決斷；春秋金文改从「未」；音源为借音（義音同丯，古制、丯通用）。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：牽引而持。</p>
