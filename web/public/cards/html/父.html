<h2>父 <small>fù</small></h2>
<h3>释义</h3>
<p>【第161部部首字·一級字根】甲骨文本从十从又。“又”指手；“十”指十倍，象意表示布指（手指張開，拇指尖到中指尖的距離）的十倍，即十尺。與“丈”同源。zhàng，《說文》：“十尺也。从又持十。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
