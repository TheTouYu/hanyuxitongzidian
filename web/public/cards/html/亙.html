<h2>亙 <small>gèn</small></h2>
<h3>本义</h3>
<p>亙，gèn：甲骨文从二（上下）中有一点，与「亟」同源，表上下之间横贯不断；後立为第504部「亙部」字根（原稿第412段「亙（<img class="cim" src="/glyphs/chars/2012d.png"><img class="cim" src="/glyphs/chars/20128.png"><img class="cim" src="/glyphs/chars/20123.png">）：504《亙部》」）。</p>
<h3>转义</h3>
<p>引申为延续不断、横贯（亘古、绵亘）。</p>
<h3>声母拟态</h3>
<p>g「隔估」取「隔」：上下相隔而贯（推）。</p>
<h3>部属说明</h3>
<p>本部字根在 504 亙部独立立部，此处仅作乞部二级字根存目。</p>
<h3>字族衍义</h3>
<p><b>①回環往復</b></p>
