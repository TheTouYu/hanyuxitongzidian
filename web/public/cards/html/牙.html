<h2>牙 <small>yá</small></h2>
<h3>释义</h3>
<p>【第225部部首字·一級字根】象交錯的犬齒形。yá，《說文》：“牡（《段注》以為‘壯’，應為“牡”，指犬齒。相對與臼齒的有槽而言，可謂‘牡’）齒也。象上下相錯之形。凡牙之屬皆从牙。，古文牙。五加切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yá）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
