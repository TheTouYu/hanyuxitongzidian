<h2>割 <small>gē</small></h2>
<h3>释义</h3>
<p>【第570部「丯部」】害＝甲骨文从入从丯（入象三角形刮刀，丯象用刀割），「割」之初文；引申殺害、傷害、災禍、妨礙；《說文》「从宀从口」析形不確。</p>
<h3>声母拟态</h3>
<p>g「隔估」取「隔」：刀斷而隔。</p>
