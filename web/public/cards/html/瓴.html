<h2>瓴 <small>líng</small></h2>
<h3>字根本义</h3>
<p>【470 瓦部】瓦＝象兩片瓦一覆一仰相扣之形，本指蓋屋之瓦；轉指凡陶器已燒之總名。音源字，取蓋瓦相擊之聲；其形半圓，故義音同「圭」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从瓦令声：盛水瓶，屋上仰瓦承溜亦曰瓴。</p>
<h3>横向对照</h3>
<p>同取瓦部「覆仰相扣、中空受物」两面：缶瓦旁定陶器，令公次并各定其用。</p>
<h3>声母义</h3>
<p>l「拢离」取「拢」：聚水而拢。</p>
