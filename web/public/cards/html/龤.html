<h2>龤 <small>xié</small></h2>
<h3>字根本义</h3>
<p>【426 皆部】皆＝从口从虤（二虎抬前肢直立相抗），实即「䖜」；二虎相抗而齐，故表同时、普遍、都。转义：虎威→强壮、硬实。辨证：小篆讹「曰」为「白」，《说文》「从比从白」析形不确。音源：二虎相争的吼声，义音同「亥」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「乐和龤也」——《虞书》「八音克龤」，乐声和谐。</p>
<h3>横向对照</h3>
<p>同取皆「二虎相抗而齐」的一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>j取聚：八音相聚而和。</p>
