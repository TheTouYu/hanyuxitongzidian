<h2>隺 <small>hū</small></h2>
<h3>释义</h3>
<p>【第39部部首字·一級字根】甲骨文本从巾、小在隻的頭部。“隻”本指鶴；象意丹頂鶴。丹頂鶴頭上有紅頂，如戴著一塊小頭巾一般。隸變作“隺”，省去了“小”和“隻”；後繁化作“鶴”。唐玄應《經音義》：“古文鶴，今作隺，同。”hè，《說文》：“鶴，鳴九皋，聲聞于天。从鳥隺聲。下各切。”《集韻》：“水鳥名。似鵠，長頸高腳，丹頂白身，頸翅有黑，常以夜半鳴，聲聞八九里。”</p>
<h3>声母拟态</h3>
<p>聲母義（隺部）：声母义（h·强） 辨證：《說文》：“高至也。从隹上欲出冂。《易》曰：‘夫幹隺然。’胡沃切。”以“隺”从“冂”，析形不確。</p>
