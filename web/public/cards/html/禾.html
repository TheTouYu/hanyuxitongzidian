<h2>禾 <small></small></h2>
<h3>释义</h3>
<p>【第42部部首字·一級字根】象一株有穗的成熟的粟形。指粟，即今小米；後泛指糧食類莊稼，包括粟米、稞子、稻穀等。hé，《廣韻》：“粟苗。”</p>
<h3>声母拟态</h3>
<p>聲母義（禾部）：声母义（h·强） 辨證：“禾”本粟的全株象形。由于下面的莖葉部分跟“木”相同，故《說文》：“禾，嘉穀也。二月始生，八月而孰（熟），得時之中，故謂之禾。禾，木也。木王而生，金王而死。从木，从<img class="cim" src="/glyphs/chars/200b9.png">省。<img class="cim" src="/glyphs/chars/200b9.png">象其穗。凡禾之屬皆从禾。戶戈切。”析形不確。</p>
