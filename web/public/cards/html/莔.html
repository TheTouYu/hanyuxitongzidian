<h2>莔 <small>méng</small></h2>
<h3>释义</h3>
<p>【第512部「囧部」】囧＝甲骨文象心臟截面形（內曲線為心室瓣膜），金文象剖開的兩塊心臟，本義剖開的心臟；音源為心跳聲，與「心」同源異體；轉義坦白、表明（《玉篇》「大明也、彰也」）。</p>
<h3>声母拟态</h3>
<p>m「蒙末」取「蒙」：蒙覆而生。</p>
