<h2>情 <small>qíng</small></h2>
<h3>字根本义</h3>
<p>【511 心部】心＝象心臟形，本義心臟；轉義心思、感情。部內从心諸字以心為義符，聲符給情狀：或怒或懼、或悔或慰，各取一面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从心青聲：人之陰氣有欲者（《說文》「人之陰氣有欲者」），引申情感、情形。</p>
<h3>横向对照</h3>
<p>同以心為義符：青取色感、瞿取鷹視、艮取止塞、去取退避。</p>
<h3>声母义</h3>
<p>q「亲缺」取「亲」：色親而情。</p>
