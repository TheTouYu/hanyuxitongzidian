<h2>誕 <small>dàn</small></h2>
<h3>释义</h3>
<p>【第516部「行部」·延支】延（㢟）＝从止彳聲（沿路前行）與<img class="cim" src="/glyphs/chars/224ca.png">（从彳止聲，踩出路來，徙之初文）同源兩寫；戰國古文加丿作延；轉義長、遠、伸長、拖延。</p>
<h3>声母拟态</h3>
<p>d「囤动」取「囤」：言漫而囤。</p>
