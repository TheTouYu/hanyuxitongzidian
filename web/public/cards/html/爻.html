<h2>爻 <small>yáo</small></h2>
<h3>释义</h3>
<p>【第103部部首字·一級字根】从“乂”的二疊或三疊。“乂”，象交叉的算籌形；二疊或三疊，表示極致。象意反復交叉。yáo，《說文》：“交也。象《易》六爻頭交形。凡爻之屬皆从爻。胡茅切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第103部），無擬態聲母義可系，義靠義類與字形。</p>
