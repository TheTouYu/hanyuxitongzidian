<h2>掃 <small>sǎo</small></h2>
<h3>字根本义</h3>
<p>【482 帚部】帚＝甲骨文从屮上有彐（草穗），或加表示束縛捆紮之形，象用草穗紮成的掃帚；音源字，取掃帚掃地之聲（掃如爬搔，義音同「蚤」）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从手帚聲（或作埽）：持帚除穢，引申掃蕩、掃興。</p>
<h3>横向对照</h3>
<p>同取彗帚一系「草穗可束、可掃、可抽打」三面：雨取其絮，手提之，女執之。</p>
<h3>声母义</h3>
<p>s「失收」取「收」：收穢而掃。</p>
