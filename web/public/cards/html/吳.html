<h2>吳 <small>wú</small></h2>
<h3>释义</h3>
<p>【第316部部首字·一級字根】从夨从口。象意且歌且舞的樣子。wú，《說文》：“姓也。亦群也。一曰吳，大言也。从夨口。，古文如此。五乎切。（注）徐鍇曰：大言，故夨口以出聲。《詩》曰：‘不吳不揚。’今寫《詩》者改吳作㕦。又音乎化切。其謬甚矣。”“娛”的初文。《玉篇》：“樂也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wú）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
