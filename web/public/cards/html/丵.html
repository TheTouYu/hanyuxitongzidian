<h2>丵 <small>zhuó</small></h2>
<h3>释义</h3>
<p>【第237部部首字·一級字根】“丵”本“鑿”的初文，甲骨文作，象鑿子形。其形制為上寬下銳，上寬是為了便于捶擊時的受力，故或特意在上面標以“上”字；下或加上小點，表示穿鑿時造成的碎屑。záo、zuò，《玉篇》：“鑿，穿也、鏨也。”《天工開物》：“凡鑿，熟鐵鍛成，嵌鋼于口，其本空圓，以受木柄。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
