<h2>佾 <small>yì</small></h2>
<h3>釋義</h3>
<p>佾yì《新附》：“舞行列也。从人䏌聲。夷當切。又老質切。”古時樂舞的行列。《康典》：“舞行列也。行數，人數，縱橫皆同，故曰佾。《左傳·隱五年》：于是初獻六羽，始用六佾。古但用䏌，加人轉注。䏌音翕。古今異讀。”</p>
<h3>字理分析</h3>
<p>聲旁為「䏌」，其古文字字形、本義、轉義、辯證、音源、字族衍義見字根卡「䏌」（本頁會自動鏈接呈現）。</p>
<h3>聲母擬態</h3>
<p>今讀 yì：按聲母取緒論擬態義一面（細辨見字根卡「䏌」）。</p>
