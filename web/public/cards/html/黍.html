<h2>黍 <small>shǔ</small></h2>
<h3>释义</h3>
<p>【第569部部首字·一級字根】甲骨文从禾四周有小點，表示黍的穗長而穀粒鬆散。黍又叫糜子或黃黍，為禾本科黍屬作物。shǔ，《字彙》：“粟屬。苗似蘆，高丈餘，穗黑色，實圓重，土宜高燥。”《六書·精薀》：“黍下从氽，象細粒散垂之形。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
