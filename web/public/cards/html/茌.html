<h2>茌 <small>chí</small></h2>
<h3>释义</h3>
<p>茌，chí：草名、地名；士聲記音（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「刺」：茌，chí：草名、地名；士聲記音（原稿字族表——借聲之字，聲母亦摹其音（推）。</p>
