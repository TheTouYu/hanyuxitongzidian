<h2>音 <small>yīn</small></h2>
<h3>释义</h3>
<p>【第182部部首字·一級字根】甲骨文的“音”與“言”字相比，的確只多那麼三個小點。小點在甲骨文中一般表示許多小物什，或者雨滴之類，跟“沙”的含義近似。因此，“”當从“䇂”从“口”从“小”，義即瑣細的不清楚的言語。春秋金文从“甘”，指口中含物之意。口中含物，其聲自然也是不清晰的。“喑（yīn）”的初文，《廣韻》：“聲也。”《六書故》：“失聲不能言也。今人謂之啞。”《廣韻》：“啼泣無聲。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yīn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
