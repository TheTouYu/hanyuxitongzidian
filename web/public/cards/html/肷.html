<h2>肷 <small>qiǎn</small></h2>
<h3>释义</h3>
<p>从肉欠聲：《玉篇》「牛肉也」牛胡／腰後虛肉處，《正字通》「膁窩」。</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「缺」：牛馬脊後肉少而缺。</p>
