<h2>鹵 <small>lǔ</small></h2>
<h3>释义</h3>
<p>【第56部部首字·一級字根】从（甶fú）中有形。“甶”本指面具，指裡面的結晶顆粒。象意鹽鹵。因為面具裡面的結晶物本是汗漬，主要成分為鹽鹵，味鹹。或以為象鹽粒在器皿中的樣子，也通。</p>
<h3>声母拟态</h3>
<p>聲母義（鹵部）：声母义（l·强） 辨證：因“（甶）、（西）、（田）”形近，故《說文》：“西方鹹地也。从西省，象鹽形。安定有鹵縣。東方謂之㡿，西方謂之鹵。凡鹵之屬皆从鹵。郎古切。”析形不確。</p>
