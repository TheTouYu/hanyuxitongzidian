<h2>卡 <small>qiǎ</small></h2>
<h3>释义</h3>
<p>【第82部部首字·一級字根】从上从下。象意夾在上下之間的中間地帶，即關隘。qiǎ，《字彙補》：“从納切，音雜，楚屬關隘地方設兵立塘，謂之守卡。”</p>
<h3>声母拟态</h3>
<p>聲母義（卡部）：声母义（q·中） 辨證：“卡”的結構其實跟“乞”同。“乞”之硬義，實即卡之義。可視“卡”為“乞”後來的分化字。</p>
