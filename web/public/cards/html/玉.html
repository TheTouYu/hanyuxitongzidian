<h2>玉 <small>yù</small></h2>
<h3>释义</h3>
<p>【第543部部首字·一級字根】象玉串形；或即玉貝的紋樣。yù，《說文》：“石之美。有五德：潤澤以溫，仁之方也；䚡理自外，可以知中，義之方也；其聲舒揚，專以遠聞，不橈而折，勇之方也；銳廉而不技，絜之方也。象三玉之連，ㄧ其貫也。凡玉之屬皆从玉。，古文玉。魚欲切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yù）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
