<h2>壽 <small>shòu</small></h2>
<h3>释义</h3>
<p>【第602部「<img class="cim" src="/glyphs/chars/200ec.png">部」】<img class="cim" src="/glyphs/chars/200ec.png">＝从水流過上下兩口，象將水或水狀物灌注進口或口狀物裏：田疇（疇之初文）、敬酒（醻之初文）、鑄範注液（鑄之初文）三義；由倒酒敬神引申求告、叩擊，由鑄件經久引申長久。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：久收而存。</p>
