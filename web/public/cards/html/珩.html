<h2>珩 <small>héng</small></h2>
<h3>释义</h3>
<p>【第516部「行部」·行支】行＝甲骨文象交叉的十字路，本指四達的大道（《爾雅》「道也」）；轉義行走、行列、行業、行跡；辯證《說文》析為彳、亍二部不確；音源為道上行走聲，由縱橫狀而義音同「黃」。</p>
<h3>声母拟态</h3>
<p>h「豁活」取「豁」：橫玉豁然。</p>
