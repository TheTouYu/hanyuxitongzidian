<h2>妾 <small>qiè</small></h2>
<h3>释义</h3>
<p>【第84部部首字·一級字根】从女从辛。“辛”，指紋身；从“女”，象意給女子紋身，表示女性的成熟，可以婚配。西周時期，則改為簪髮。故《儀禮·士婚禮》記述：“女子許嫁，笄而醴之，稱字。”因此，也可以視“辛”為髮簪。</p>
<h3>声母拟态</h3>
<p>聲母義（妾部）：声母义（q·中） 辨證：《說文》以“辛（䇂）”為罪，故：“有罪女子，給事之得接于君者。从䇂，从女。《春秋》云：‘女為人妾。’妾，不娉也。七接切。”所解不確，應不是其字源義。商代甲骨卜辭有“妾妣甲”“河妾”之語。“甲”，指商王；“河”，指河神。可以作為商王與河神的配</p>
