<h2>平 <small>píng</small></h2>
<h3>释义</h3>
<p>【第133部部首字·一級字根】甲骨文為几的二疊。“几”，指几案；二疊，表示極致。象意象寬闊的几案一般平整。píng，《字彙》：“坦也。”《爾雅》：“大野曰平。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 p（擬態「拼辟」），取「辟」一面；本部未列 02z 表，按緒論推。</p>
