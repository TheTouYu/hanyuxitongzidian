<h2>堇 <small>qín</small></h2>
<h3>释义</h3>
<p>【第116部部首字·一級字根】从（皮）从（天）。“皮”，指剝下的野獸皮；“天”即“申”，伸展之意。象意將皮展開風乾和加工。可謂“攤”的初文。或加“土”，實為“墐”。</p>
<h3>声母拟态</h3>
<p>聲母義（堇部）：声母义（j·强） 辨證：由于戰國古文訛从黃从土，小篆从之。故《說文》：“黏土也。从土，从黃省。凡堇之屬皆从堇。（<img class="cim" src="/glyphs/chars/21433.png">）、（䒺）皆古文堇。巨斤切。” “堇”與“黃”，本不相干。故析形不確。</p>
