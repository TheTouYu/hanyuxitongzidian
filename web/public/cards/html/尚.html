<h2>尚 <small>shàng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·尚系（二级字根）】尚＝从八向聲：「八」分開、分別，「向」打開窗戶，為「敞」之初文（《集韻》「開也、露也」）。轉義：開窗使明→推崇、薦舉、尊奉、佐助、增加；所明有限→庶幾、差不多；開窗出於人為控制→主宰、掌控。字族三面：敞開敞亮／推舉罩覆／來回反復。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：窗開而收。</p>
