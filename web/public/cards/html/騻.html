<h2>騻 <small>shuǎng</small></h2>
<h3>释义</h3>
<p>【第530部「爽部」】爽（<img class="cim" src="/glyphs/chars/2004a.png"><img class="cim" src="/glyphs/chars/20660.png">）＝甲骨文象人兩手各提大的器物之形：一表孔武有力、豪爽（《廣韻》「烈也、猛也」），二表所提為空疏之器（與「希」所从同）；轉義器物空疏→明亮（《說文》「明也」）；器物過大提時與兩足刮擦→傷、損（《廣雅》「傷也、敗也」）。音源借音：兩側有物相夾，義音同「相」。字族：①空明 ②刮擦。</p>
<h3>声母拟态</h3>
<p>sh取失收：馬駿而收。</p>
