<h2><img class="cim" src="/glyphs/chars/29bf0.png"> <small>jié</small></h2>
<h3>字根本义</h3>
<p>【才部·<img class="cim" src="/glyphs/chars/2298f.png">声】「<img class="cim" src="/glyphs/chars/2298f.png">（<img class="cim" src="/glyphs/chars/22992.png">）」从戈才声：「才」指花果之梗，从戈表用戈割取，本义采摘花果；转义伤害（《说文》「伤也」）。字族衍义：①指梗，表示承载 ②指采摘，表示受伤害之后的剩余。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿才部有「▲花的结构图」「▲《种竹斋》局部」「▲桃花汛期的壶口瀑布」可参。</p>
<h3>形旁声旁</h3>
<p>从髟截声，《说文》「束发少也」子结切——应指剪发；jì《集韵》「露髻曰<img class="cim" src="/glyphs/chars/29bf0.png">」。</p>
<h3>横向对照</h3>
<p><img class="cim" src="/glyphs/chars/2298f.png">族②之发：以「髟」定其处，截而短。</p>
<h3>声母义</h3>
<p>j「聚决」取「决」：决断而截。</p>
