<h2>某 <small>mǒu</small></h2>
<h3>释义</h3>
<p>【第267部部首字·一級字根】从木从甘。“甘”，象口含物形，表示味道酸甜；从“木”，象意果實酸甜的樹木。“梅（méi）”的初文，《說文》：“酸果也。从木，从甘。闕。，古文某从口。莫厚切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
