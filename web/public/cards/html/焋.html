<h2>焋 <small>zhuàng</small></h2>
<h3>释义</h3>
<p>【第534部「爿部」·壯系】壯＝从士爿聲，《說文》「大也」；爿（床）为声，取「床板长大平整」之义；转义壮盛、壮年。</p>
<h3>声母拟态</h3>
<p>z取凿总：蒸實而总。</p>
