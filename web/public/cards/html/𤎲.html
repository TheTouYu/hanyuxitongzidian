<h3>释义</h3>
<p>【第525部「昜部」·量系】此字楷化有誤，省去「鬲」與聲符「勹」；原从尞从東从勹在鬲中。</p>
<h3>声母拟态</h3>
<p>h「豁活」取「活」：火煨而活。</p>
