<h2><img class="cim" src="/glyphs/chars/21c16.png"> <small>dī</small></h2>
<h3>字根本义</h3>
<p>《说文》「<img class="cim" src="/glyphs/chars/24fd1.png">不能行，為人所引，曰<img class="cim" src="/glyphs/chars/21c16.png"><img class="cim" src="/glyphs/chars/21c21.png">」——脚跛被牵引而行。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>日行族②之尣：以「尣」（跛）定其困，日行而人不能行。</p>
<h3>横向对照</h3>
<p>同取「日行」一面（移动、刮削、阻滞、安稳），形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>d「囤动」取「囤」：困而不前。</p>
