<h2>胈 <small>bá</small></h2>
<h3>字根本义</h3>
<p>【419 犮部】犮与亥同源，金文象直立的旱獭正面形、足加一丿表示抬起前肢；转义：直立→挺拔抽引（拔）、往前扑（跋）、毛皮细软面小宜作蔽膝（袚/韍/帗）、掘根致沙化→旱灾（魃）、毛发（髮）、腿肉（胈）。音源：源自旱獭叫声。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《正字通》「肤毳皮，又股上小毛」；《集韵》「白肉也」。</p>
<h3>横向对照</h3>
<p>同取犮部「旱獭皮毛／蔽膝」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b「闭剥」取「剥」：毛附肉如剥。</p>
