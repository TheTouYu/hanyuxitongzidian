<h2>娋 <small>shào</small></h2>
<h3>释义</h3>
<p>【第582部「小部」·肖支】肖＝从肉小聲（骨肉相似），引申像、似；其字族多从肖聲，取「細小、相似、散盡、高遠」諸面。</p>
<h3>声母拟态</h3>
<p>sh取失收：女小而收。</p>
