<h2>裼 <small>xī/tì</small></h2>
<h3>古文字字形</h3>
<p>字形庫未收本字。</p>
<h3>本義</h3>
<p>甲骨文从又从衣，象脫衣露體，「裼」之初文（xī，《說文》「裼，袒也」）。</p>
<h3>轉義</h3>
<p>①包裹嬰幼兒之繈褓（tì）；②赤身露體之北方部族「狄」（dí）。</p>
<h3>音源</h3>
<p>借音字，義音同「易」。</p>
<h3>聲母擬態</h3>
<p>x 取「續」：衣相續而解（推）。</p>
