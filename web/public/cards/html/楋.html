<h2>楋 <small>là</small></h2>
<h3>释义</h3>
<p>【第574部「剌部」】剌（là）＝甲骨文从刀从<img class="cim" src="/glyphs/chars/257a5.png">（脫粒的秸稈束）亦聲，以秸稈反覆刮擦、拋光器物，「揧」之初文；轉義乖違不正；又因粗糙刺膚引申灼痛；音源為刮擦聲，與蠍螫之痛近故義音同「萬」。</p>
<h3>声母拟态</h3>
<p>l取拢离：木割而离。</p>
