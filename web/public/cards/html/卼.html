<h2>卼 <small>wù</small></h2>
<h3>字根本义</h3>
<p>【455 兀部】兀＝高而上平（《说文》「高而上平也，从一在儿上」），象人首秃而高；引申突兀、动摇不安。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「卼臲，危也」——危动不安。</p>
<h3>横向对照</h3>
<p>同取兀部「高而上平／动摇」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>w取问：危动而问。</p>
