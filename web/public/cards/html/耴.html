<h2>耴 <small>zhé</small></h2>
<h3>释义</h3>
<p>十部部头甲骨文象竖置的算筹，表数字十；十进为用数之极，引申完备、极点、十倍很多；《說文》以「一为东西、ㄧ为南北」析形不确。</p>
<h3>声母拟态</h3>
<p>耳垂附于头侧，取「附合」一面。</p>
