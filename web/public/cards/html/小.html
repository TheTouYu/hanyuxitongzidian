<h2>小 <small>xiǎo</small></h2>
<h3>释义</h3>
<p>【第582部部首字·一級字根】甲骨文象麻雀的腳印形。麻雀雖然跟大多數鳥類一樣，都是四趾，但後面的距趾較短，因此留下的腳印不明顯，而為前面三趾。可謂“雀（què）”的初文，《說文》：“依人小鳥也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
