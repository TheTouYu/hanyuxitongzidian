<h2>良 <small>liáng</small></h2>
<h3>释义</h3>
<p>【第521部部首字·一級字根】甲骨文象口的上下各有兩獠牙形。由于口張開時才會露出牙齒，所以“口”或寫如“日”，象口張開時露出舌頭的樣子。表示有著獠牙的動物。肉食性動物，一般都長有獠牙，便于撕咬，其中狼最為突出，故應為“狼（láng）”的初文，《玉篇》：“獸似犬。”因其形似犬，所以或另加“犬”旁。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
