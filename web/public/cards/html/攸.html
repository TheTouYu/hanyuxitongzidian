<h2>攸 <small>yōu</small></h2>
<h3>释义</h3>
<p>【第59部部首字·一級字根】甲骨文从人从攴。“攴”指持杖，在“人”後，象意人背後遭杖撲打的樣子，表示懲治。“修（xiū）”的初文，《玉篇》：“治也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第59部），無擬態聲母義可系，義靠義類與字形。</p>
