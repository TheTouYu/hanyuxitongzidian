<h3>本义</h3>
<div class="bx">祡，chái：从示此聲，本义为烧柴燎祭天神（原稿：「祡本義為燒柴燎祭天神」）。</div>
<h3>音源</h3>
<div class="bx">音源：借「此」聲。</div>
<h3>声母拟态</h3>
<div class="bx">ch「刺持」取「持」：柴持而燎（推）。</div>
<h3>字族衍义</h3>
<p><b>柴薪短小，表参差聚集与篱落</b></p>
