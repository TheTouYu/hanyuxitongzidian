<h2>罙 <small>shēn</small></h2>
<h3>释义</h3>
<p>【第178部部首字·一級字根】甲骨文从又入冖中有小點形。“又”，指手；“冖”，西周金文或作“穴”，指洞穴；“小”指細小的物體。象意從洞穴中摸索。“探（tàn）”的初文，《爾雅》：“取也。”“試也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
