<h2>亡 <small>wáng</small></h2>
<h3>释义</h3>
<p>【第313部部首字·一級字根】“亡”與“刃”的字形結構差不多，都是在刀刃部位加一短豎作為象事符號。不過，“刃”的短豎離刃遠，表示整個刀刃；“亡”的短豎連著刀刃，表示刀尖。“釯（máng）”的初文，《字彙》：“刀端。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wáng）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
