<h2>袃 <small>chài</small></h2>
<h3>释义</h3>
<p>【第567部「七部」】七＝甲骨文在「一」中間加指示符，象切、刻之意，「切」之初文（《廣韻》「割也、刻也」）；借為數詞七（源于手势语）；音源為切刻聲。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「刺」：刺鯁而持。</p>
