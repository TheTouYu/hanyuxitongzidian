<h2>昣 <small>zhěn</small></h2>
<h3>释义</h3>
<p>【第594部「彡部」】彡＝三丿，象細長而多之物；㐱（zhěn）＝从人从彡，毛髮稠密（《說文》「稠髮也」），引申細密、細緻，為本部二級字根。</p>
<h3>声母拟态</h3>
<p>zh取凿总：日密而凿。</p>
