<h2>呭 <small>yì</small></h2>
<h3>释义</h3>
<p>部頭世（丗㔺卋）：象枝葉之形，指草木的葉子，是「枼（葉）」的初文（《正字通》引鄭樵「枼卽葉字」）。轉義：葉春發秋落→更迭（《廣韻》「代也」，父子相代為一世）、年歲、時代、一生。辯證：《說文》「三十年為一世，从卅而曳長之」析形不確；世義與「三十」無直接關係（三十年一代是後起計算）。音源：源自風吹樹葉的悉索聲；義音同「蛇」（《史記》「抴獨繭之褕袘」，《漢書》作「袣」）。字族衍義：①葉挂枝頭→牽引拖拽 ②葉多→層層疊疊 ③葉更替→改易逾越 ④葉間縫隙→洩漏光明。</p>
