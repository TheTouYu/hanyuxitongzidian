<h2>尸 <small>shī</small></h2>
<h3>释义</h3>
<p>【第17部部首字·一級字根】象人屈膝蹲踞的樣子。指古代的祭祀儀式中，用死者的後代代替已經死去的人接受祭拜，故蹲著不動。《公羊傳·宣公八年》：“祭之明日也。”漢何休注：“祭必有尸者，節神也。禮，天子以卿為尸，諸侯以大夫為尸，卿大夫以下以孫為尸。夏立尸，殷坐尸，周旅酬六尸。”唐李華《卜論》：“夫祭有尸，自虞夏商周不變。戰國蕩古法，祭無尸。”</p>
<h3>声母拟态</h3>
<p>聲母義（尸部）：声母义（sh·强） 辨證：《說文》：“陳也。象臥之形。凡尸之屬皆从尸。式脂切。”根據何休所注，尸祭時並不是臥著的，故析形不確。</p>
