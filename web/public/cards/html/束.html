<h2>束 <small>shù</small></h2>
<h3>释义</h3>
<p>【第372部部首字·一級字根】从木从○。“〇”象捆纏形；从“木”，象意將散亂的木柴捆在一起。〇楷化作囗。shù，《說文》：“縛也。从囗木。凡束之屬皆从束。書玉切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
