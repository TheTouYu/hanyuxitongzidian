<h2>性 <small>xìng</small></h2>
<h3>字根本义</h3>
<p>【497 生部】生＝象草木从地面长出之形，本義生長、生育（《說文》「進也」）；轉義生命、生熟、生計。部內从生諸字取「生長、所生」兩面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从心生聲：生之質曰性（《說文》「人之陽氣性善者也」）。</p>
<h3>横向对照</h3>
<p>同取生部「草木出土、所生」一面：晶取其光，牛取其畜，心取其質，女取其脈。</p>
<h3>声母义</h3>
<p>x取续消：生而相續。</p>
