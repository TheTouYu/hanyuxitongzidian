<h3>释义</h3>
<p>象爬行動物身子扭動之形。本義應是指蟲蛇類的爬行。楷化分作“乙、、乁、<img class="cim" src="/glyphs/chars/200c9.png">、乚”等形。</p>
<h3>声母拟态</h3>
<p>溪母q，「親缺」取「缺」：角曲而缺。</p>
