<h2>祝 <small>zhù</small></h2>
<h3>释义</h3>
<p>【第609部部首字·一級字根】甲骨文从示从丮或兄。“丮”，象人伸出雙手禱告之形；上或加“口”，表示言語。从“示”，象意向神靈禱告，表示在舉行祭祀活動的巫祝。zhù，《廣韻》：“巫祝。又太祝令，官名。《周禮》曰：‘太祝，掌六祝之辭，以事鬼神，祈福祥，求永貞。’亦音呪。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
