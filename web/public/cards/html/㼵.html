<h2>㼵 <small>dì</small></h2>
<h3>字根本义</h3>
<p>《玉篇》「小盆也」，《广韵》「小甕」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>日行族②之瓦：以「瓦」定其器，小器如日之圆。</p>
<h3>横向对照</h3>
<p>同取「日行」一面（移动、刮削、阻滞、安稳），形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>d「囤动」取「囤」：器囤而盛。</p>
