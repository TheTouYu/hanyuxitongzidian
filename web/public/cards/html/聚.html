<h2>聚 <small>jù</small></h2>
<h3>释义</h3>
<p>取部部头从耳从又，象手取耳而获；一字兼抓耳、获取、贴耳三象意，故其字族分三条衍义。</p>
<h3>声母拟态</h3>
<p>众人相贴而会，取「贴近相聚」一面。</p>
