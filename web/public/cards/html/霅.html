<p>【第556部「辛部」】辛（䇂）＝象小刻刀，用於刻字紋身；部内四系 言（直言）／<img class="cim" src="/glyphs/chars/234c0.png">（親，至）／新（析木）／豙（豕怒），皆承刻刀之鋒。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「凿」：電凿而總。</p>
