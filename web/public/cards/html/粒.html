<h2>粒 <small>lì</small></h2>
<h3>字根本义</h3>
<p>【429 立部·顆粒】立之第二支取「粒」义：物分散成颗曰粒，故有摧折、崩裂诸字。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「糂也」——米粒；分散成颗。</p>
<h3>横向对照</h3>
<p>同取立部「散成颗／折使离」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>l「拢离」取「离」：米散成颗。</p>
