<h2>主 <small>zhǔ</small></h2>
<h3>释义</h3>
<p>【第230部部首字·一級字根】甲骨文从木上有火形，象意燃木頭照明，指火炬。但隨著油脂的被用以照明，後來則指油燈。出土發現，早在商代，已經出現了陶制油燈。因此，可謂“炷（zhù）”的初文，《集韵》：“燈也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
