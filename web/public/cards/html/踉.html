<h2>踉 <small>liáng</small></h2>
<h3>释义</h3>
<p>【第521部「良部」】良＝甲骨文象口之上下各有兩獠牙，為「狼」之初文（有獠牙的肉食動物）；轉義狼崇拜、引申善美；辯證牙形小篆訛作「亡」，《說文》「从亯省亡聲」析形不確；音源為狼嚎聲。</p>
<h3>声母拟态</h3>
<p>l取拢离：足跳而離。</p>
