<h2>㚇 <small>zōng / miǎn</small></h2>
<h3>释义</h3>
<p>字族「㚇」（<img class="cim" src="/glyphs/chars/21569.png"><img class="cim" src="/glyphs/chars/2156b.png"><img class="cim" src="/glyphs/chars/21562.png"><img class="cim" src="/glyphs/chars/21570.png">，zōng/miǎn）：本同「兇」，指囟門未合的幼兒；戰國古文加意符「夊」（倒退，表幼弱）。轉義：護囟故留髮不剃，由蓄髮之狀引申為叢聚（《玉篇》「聚也、最也」）。辯證：《說文》「斂足也…从夊凶聲」所釋斂足雖通，然「凶」與鳥飛無涉，析形不確；「<img class="cim" src="/glyphs/chars/21569.png">」从囟最為標準，「<img class="cim" src="/glyphs/chars/2156b.png">」為訛字。</p>
<h3>声母拟态</h3>
<p>精母z，「鑿總」取「總」：蓄髮總束於頂。</p>
