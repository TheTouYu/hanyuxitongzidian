<h2>豊 <small>lǐ</small></h2>
<h3>释义</h3>
<p>【第581部部首字·一級字根】既然“朋”的甲骨文可作，也可作；則與所指也當相同。故“豊”與“豐”本同源。fēng，《玉篇》：“豐，大也。俗作豊。”但側重點有別：“豐”，从壴朋聲，側重于指有著繁盛裝飾的鼓。“豊”，从朋壴聲，側重于指朋、玉之类堆疊如鼓。lǐ，《玉篇》：“豊，行禮之器也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
