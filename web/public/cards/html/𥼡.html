<h3>释义</h3>
<p>【第601部「麤部」】麤＝从鹿二疊：鹿角枝杈、腿細善走、性警惕，二疊表極致——行超遠／角粗大／相背而食；引申粗糙，俗作麤/粗。</p>
<h3>声母拟态</h3>
<p>c取刺持：米粗而刺。</p>
