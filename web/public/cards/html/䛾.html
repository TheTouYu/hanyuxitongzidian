<h2>䛾 <small>sù</small></h2>
<h3>释义</h3>
<p>素部（第373部）部头：据「傃」「<img class="cim" src="/glyphs/chars/2616b.png">」的甲骨文，初文从糸从集束，象纱线织成的生帛；《玉篇》「白緻繒」、《廣韻》「帛也」。轉義：生帛未漂未染，故为白、为本、为不加修饰、为平常。辯證：戰國古文訛从垂从糸，小篆沿袭，《說文》析形不确。音源：義音同「索」。</p>
<h3>声母拟态</h3>
<p>熟者习之久而见其本色，取「本色」一面。</p>
