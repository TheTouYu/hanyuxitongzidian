<h2>嘦 <small>jiào</small></h2>
<h3>释义</h3>
<p>嘦，jiào：方言，只要（象意字，含獨一義）（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：只要，總聚而取其一（推）。</p>
