<h2><img class="cim" src="/glyphs/chars/25f18.png"> <small>qí</small></h2>
<h3>字根本義</h3>
<p>部頭幾（几㡬jī）：从戍、<img class="cim" src="/glyphs/chars/221b6.png">聲——「<img class="cim" src="/glyphs/chars/221b6.png">」指微小，「戍」指持戈守衛，象意細微卻十分重要的事物，表示要害、關鍵（《法言》「為政有幾」，李軌注「幾，要也」）。轉義：①細微的跡象、苗頭預兆 ②臨界點→危險、危機、終盡（《說文》「微也，殆也」）③器物上的凹凸線紋。辯證：商金文本从「威」从「<img class="cim" src="/glyphs/chars/221b6.png">」，象意細微卻具威力，西周演變作「戍」。字族衍義：①細微卻重要 ②細微而連續。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該條前後無獨立插圖。</p>
<h3>形旁声旁</h3>
<p>从米，《集韻》小食也，或从口。</p>
<h3>横向对照</h3>
<p>②組：與嘰同取「小食」，以米定落點。</p>
<h3>声母义</h3>
<p>q「親缺」取「缺」：食少而缺。</p>
