<h2>䳁 <small>bó</small></h2>
<h3>字根本义</h3>
<p>【419 犮部（叐）】犮与亥同源，商代晚期金文象直立的旱獭正面形，足部加一丿表示抬起前肢（《说文》误以形近「犬」释为「走犬皃」）。转义：直立→挺拔抽引（拔）、往前扑（跋）、毛皮细软面小宜作蔽膝（袚）、穴居掘根致沙化→旱灾（魃）、毛发（髮）、腿肉（胈）。音源：源自旱獭叫声。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「鸟也」——大鸟；似凫、似雉。</p>
<h3>横向对照</h3>
<p>同取犮部「直立·抽引／短硬·扑出」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b「闭剥」取「剥」：鸟剥羽而飞。</p>
