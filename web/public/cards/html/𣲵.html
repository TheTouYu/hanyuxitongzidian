<h2><img class="cim" src="/glyphs/chars/23cb5.png"> <small>zhǐ</small></h2>
<h3>释义</h3>
<p>从水只聲：水名（《山海經》拘扶之山）；只聲記音，不取义。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「凿」：<img class="cim" src="/glyphs/chars/23cb5.png">水多箴魚，其喙如箴（針），尖利刺物。</p>
