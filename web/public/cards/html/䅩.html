<h2>䅩 <small>zhǐ</small></h2>
<h3>释义</h3>
<p>从<img class="cim" src="/glyphs/chars/2574c.png">从支、只聲：艸木屈曲不伸、枝曲；取只之曲义。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「总」：多小意而總聚止息（推）。</p>
