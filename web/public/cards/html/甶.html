<h2>甶 <small></small></h2>
<h3>释义</h3>
<p>【第160部部首字·一級字根】象面具形。為形制，即“甲”，指狀如盔甲。或與“甲”本是同源字。因義而發生分化：“甲”指盔甲；“甶”，指古代巫師在祭祀時所戴的面具。跟現存的儺戲面具差不多。fú，《說文》：“鬼頭也。象形。凡甶之屬皆从甶。敷勿切。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 無；未列 02z，按緒論取一面未判（02z 未收）。</p>
