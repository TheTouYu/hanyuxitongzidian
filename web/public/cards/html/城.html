<h2>城 <small>chéng</small></h2>
<h3>字根本义</h3>
<p>【495 丁部】丁＝象釘子之形，為「釘」之初文；轉義成年男子（壯丁）、天干第四位、當、遭逢。部內从丁諸字取「釘、當、遭逢」三面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从土成聲：築土為牆以成邑，取成之成就義。</p>
<h3>横向对照</h3>
<p>同取丁部「釘子、當值、遭逢」一面：土取其築，言取其平，頁取其顛。</p>
<h3>声母义</h3>
<p>ch取持：土持而成垣。</p>
