<h2><img class="cim" src="/glyphs/chars/282ed.png"> <small>páo</small></h2>
<h3>本义</h3>
<p><img class="cim" src="/glyphs/chars/282ed.png">，páo：《廣雅》「軫<img class="cim" src="/glyphs/chars/282ed.png">，轉戾也」，身子勾曲。《正字通》「譌字」；王念孫疏證：「軳（páo），曹憲音牛力反。各本軳譌作<img class="cim" src="/glyphs/chars/282ed.png">，自宋時本已然。」</p>
<h3>讹字说明</h3>
<p>《正字通》：「譌字。」王念孫疏證：「軳（páo）……各本軳譌作<img class="cim" src="/glyphs/chars/282ed.png">。」所訛之字為「軳」（从車包聲，字根「包」）。</p>
<h3>声母拟态</h3>
<p>x組取「豁」：<img class="cim" src="/glyphs/chars/282ed.png">，páo：《廣雅》「軫<img class="cim" src="/glyphs/chars/282ed.png">，轉戾也」，身子勾曲。（推）。</p>
