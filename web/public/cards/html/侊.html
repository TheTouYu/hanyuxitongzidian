<h2>侊 <small>guāng</small></h2>
<h3>释义</h3>
<p>【第519部「光部」】光＝从火在卩（跪人）上，象人借火光照明（《說文》「明也」）；轉義榮耀、色彩、裸露空盡；音源借「黃」（火光偏黃）。字族多取「耀眼／照亮」。</p>
<h3>声母拟态</h3>
<p>g取隔估：人盛而隔。</p>
