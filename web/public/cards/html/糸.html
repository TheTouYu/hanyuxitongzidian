<h2>糸 <small>mì</small></h2>
<h3>释义</h3>
<p>【第383部部首字·一級字根】从“幺”的一頭或兩頭出緒，象多股絲絞在一起的樣子，指拈出的紗線。mì，《說文》：“細絲也。象束絲之形。凡糸之屬皆从糸。讀若覛。，古文糸。莫狄切。（注）徐鍇曰：一蠶所吐為忽，十忽為絲。糸，五忽也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
