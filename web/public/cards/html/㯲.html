<h2>㯲 <small>jìn</small></h2>
<h3>释义</h3>
<p>【第593部「林部」】林＝二木並立（《說文》「平土有叢木曰林」），借音同「廩」（聚集）；禁＝从示林聲，對社林神靈的畏忌→禁止（《說文》「吉凶之忌也」）；㪔＝从攴从林，敲擊林木使果葉四散（《玉篇》「分離也、放也」）。</p>
<h3>声母拟态</h3>
<p>j取聚决：木格而决。</p>
