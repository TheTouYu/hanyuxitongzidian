<h2>䅲 <small>qí</small></h2>
<h3>释义</h3>
<p>䅲（<img class="cim" src="/glyphs/chars/2650c.png">蒔）qí《集韻》：“<img class="cim" src="/glyphs/chars/2650c.png">，麥下種也。或从禾。”《正字通》：“<img class="cim" src="/glyphs/chars/2650c.png">，俗蒔字。”</p>
<h3>声母拟态</h3>
<p>声母义：今读 qí，按声母取绪论拟态义一面（02z 未列本部）。</p>
