<h2>梁 <small>liáng</small></h2>
<h3>释义</h3>
<p>【第522部「刅部」】刅＝西周金文象枝葉對生之形（一般樹木枝葉交互，荊卻對生），為「荊」之初文；枝條柔韌有香，可編籃、作鞭→引申懲罰、創傷；音源義音同「良」（氣味如狼）。</p>
<h3>声母拟态</h3>
<p>l「拢离」取「拢」：木攏為梁。</p>
