<h2>㩱 <small>jué</small></h2>
<h3>释义</h3>
<p>【第585部「爵部」】爵＝象酒器爵形：三足、側有鋬、上有兩柱（側視或顯一柱）、侈口有嘴；《說文》「禮器也，所以飲器象雀者，取其鳴節節足足也」；轉義 酒、舀酒器、爵位（爵有五種，貴者獻爵、賤者獻散）；辯證《說文》以爵為雀之象形不確（有「其鳴節節足足」語，段注改「雀」為「爵」）；音源借音，因爵形如雀，義音同「雀」。</p>
