<h2>巨 <small>jù</small></h2>
<h3>释义</h3>
<p>【第600部部首字·一級字根】西周金文从大（人）持壬。“壬”指經紗，經紗直，以一手持之，故不是指據織，而是指手持線繩測量，故指規矩。jù，《說文》：“規巨也。从工，象手持之。，巨或从木矢；矢者，其中正也。，古文巨。其呂切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
