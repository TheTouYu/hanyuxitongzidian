<h2>鱼 <small>yú</small></h2>
<h3>释义</h3>
<p>【第55部部首字·一級字根】象魚形。yú，《說文》：“水蟲也。象形。魚尾與燕尾相似。凡魚之屬皆从魚。語居切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第55部），無擬態聲母義可系，義靠義類與字形。</p>
