<h2>箏 <small>zhēng</small></h2>
<h3>字根本义</h3>
<p>【498 爭部】爭＝甲骨文从兩「又」抓住「凵」的兩邊：凵象筐或器皿，又指手，象意兩人爭搶一器物；金文凵或演作力，見雙方用力拉扯。本義爭奪（《說文》「引也」），轉義辯論、爭執、競爭。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从竹爭聲：弦樂器，取爭之聲。</p>
<h3>横向对照</h3>
<p>同取爭部「兩手爭器」一面：青取其審，水取其潔，言取其直。</p>
<h3>声母义</h3>
<p>zh取凿：弦張而鏘。</p>
