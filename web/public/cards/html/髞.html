<h2>髞 <small>sāo</small></h2>
<h3>释义</h3>
<p>【第584部「喿部」】喿＝眾口在木上鳴叫（噪之初文）；字族五面：聲音之雜／狀態之雜／色彩之雜／行為之雜／心理之雜。</p>
<h3>声母拟态</h3>
<p>s取失收：高急而收。</p>
