<h3>释义</h3>
<p>【第578部部首字·一級字根】商代甲骨文象有著長柄的網兜形。“畢”的初文。bì，《說文》：“田网也。”《段注》：“《小雅》毛傳曰：‘畢所以掩兔也。’《月令》注曰：‘网小而柄長謂之畢。’按‘鴛鴦’傳云：‘畢掩而羅之。’然則不獨掩兔，亦可掩鳥。皆以上覆下也。畢星主弋獵，故曰畢。亦曰䍐車。許于‘率’下曰：‘捕鳥畢也。’此非別有一畢，亦是掩物之网。《特牲饋食禮》助載鼎實之噐象之亦曰畢。此則用以上載爲異。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
