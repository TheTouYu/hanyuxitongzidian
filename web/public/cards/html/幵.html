<h2>幵 <small>jiān</small></h2>
<h3>释义</h3>
<p>【第138部部首字·一級字根】从的二疊或三疊。，象髮簪形。簪的作用在于固定頭髮與頂戴，使用時一般要用到多根，故作二疊。“笄（jī）”的初文，《說文》：“簪也。从竹幵聲。古兮切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
