<h2>䠟 <small>dié</small></h2>
<h3>释义</h3>
<p>㚔部部头象桎梏之夹，本义拘押控制；㚔与<img class="cim" src="/glyphs/chars/21d18.png">同源，楷化并为「幸」，其族一支取执持拘系，一支取「锁定而不可动」所生的僵直、侥幸。</p>
<h3>声母拟态</h3>
<p>足被绊，取「拘」一面。</p>
