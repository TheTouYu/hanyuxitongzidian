<h2>蝨 <small>shī</small></h2>
<h3>字根本义</h3>
<p>【才部·卂声】「卂」甲骨文本从水才声，与「<img class="cim" src="/glyphs/chars/21fe7.png">」同源，指水灾，是「汛」的初文，指雨季江河水位暴涨；转义迅速（《玉篇》「疾飞也，亦作迅」）。辯證：西周金文将「水」置于右上角，小篆遂演变得近似「飛」字无羽毛，故《说文》「疾飞也，从飛而羽不见」析形不确。字族衍义：指迅疾。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿才部有「▲花的结构图」「▲桃花汛期的壶口瀑布」可参。</p>
<h3>形旁声旁</h3>
<p>从䖵卂声，《说文》「啮人虫」所栉切；《六书正讹》「卂即迅字，疾也，虱行疾」——虱子。</p>
<h3>横向对照</h3>
<p>卂族之虫：以「䖵」定其类，行疾如汛。</p>
<h3>声母义</h3>
<p>sh「失收」取「收」：附而收血。</p>
