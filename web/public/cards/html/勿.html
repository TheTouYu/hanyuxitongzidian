<h2>勿 <small>wù</small></h2>
<h3>释义</h3>
<p>【第305部部首字·一級字根】根據甲骨文學者的認讀，“勿”有兩種字形：或从刀旁有三小點，表示刀刃崩了許多口子。或从弓的弦為虛線，表示將要斷弦的弓。鈍了的刀、將斷弦的弓，都是不能使用的。故用以表示否定。wù，《廣韻》：“無也。莫也。”《玉篇》：“非也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wù）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
