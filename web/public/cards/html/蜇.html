<h2>蜇 <small>zhē</small></h2>
<h3>释义</h3>
<p>部頭折（歽㪿）：甲骨文从斤（斧）从木之斷處，象意砍斷樹木。與「析」相對——析依木紋豎砍（破），折攔腰橫砍（斷）。轉義：折扣損失夭折（木斷則用少）、斷而仍連（shé）、彎曲倒伏回轉屈從、安舒。辯證西周金文訛斷木為艸，小篆連寫成手，故《說文》「从斤斷艸」不確。音源音源字，源自折斷聲，因斷而猶連義音同「世」。字族①折損②折而猶連③為刀所斫。</p>
<h3>声母拟态</h3>
<p>照母zh，「鑿總」取「鑿」。</p>
