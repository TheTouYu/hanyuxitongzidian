<h2>孚 <small>fú</small></h2>
<h3>释义</h3>
<p>【第141部部首字·一級字根】甲骨文初本从爪从鳥卵形，表示鳥類以爪扒蛋進行孵化之形。鳥卵或作“子”，从而演變為从爪从子。fū，《說文》：“卵孚也。从爪，从子。一曰：信也。，古文孚从<img class="cim" src="/glyphs/chars/21940.png">，<img class="cim" src="/glyphs/chars/21940.png">，古文<img class="cim" src="/glyphs/chars/20203.png">。芳無切。（注）徐鍇曰：鳥之孚卵皆如其期，不失信也。鳥袌恒以爪反復其卵也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
