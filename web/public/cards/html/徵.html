<h2>徵 <small>zhēng</small></h2>
<h3>字根本义</h3>
<p>【482 帚部】帚＝草穗紮成的掃帚；部內从帚諸字取「隱蔽、刷洗、徵召懲戒」三面：一形从又从攴，象人頭上戴彐（草穗）為偽裝而以攴擊之，是「微」之初文（隱行也）；「徵」與「微」同源，側重攴（施為於隱者）故為徵召、懲戒。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从微省：行於微而文達者即徵之，故為徵召、徵驗；引申懲戒（分化作懲）。</p>
<h3>横向对照</h3>
<p>同取帚部「穗可偽裝、可刷洗」两面：心取戒，豆取治。</p>
<h3>声母义</h3>
<p>zh「凿总」取「总」：徵召而總。</p>
