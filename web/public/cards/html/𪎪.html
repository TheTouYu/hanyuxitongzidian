<h2><img class="cim" src="/glyphs/chars/2a3aa.png"> <small>zōu</small></h2>
<h3>释义</h3>
<p>芻部部头作「又」（手）持斷艸斷木之形，本義拔草、採枝葉；楷化或訛「又」為「丑」，俗作「蒭」。四支衍义：喂养、嫩小、皱缩、反芻。</p>
<h3>声母拟态</h3>
<p>麻秆可析可饲，取「草料之秆」一面。</p>
