<h2>蹴 <small>cù</small></h2>
<h3>字根本义</h3>
<p>【465 就部】就＝甲骨金文从亯（祭坛）从京（高屋），象高高的祭坛；战国古文加「尤」表特别高；转为靠近、迁就、成就、只、仅；音源借音（特出义同尤，蹙缩义同戚）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从足就声——《说文》「躡也」，踢、踏；《集韵》「蹴然，敬皃」。</p>
<h3>横向对照</h3>
<p>同取就部「高、靠近、蹙缩」三面，形符各定落点：人与言主就而近，足口手主迫，鳥虫主名物。</p>
<h3>声母义</h3>
<p>c「亲缺」取「亲」：踏而亲。</p>
