<h2>䫶 <small>fán</small></h2>
<h3>字根本义</h3>
<p>【436 <img class="cim" src="/glyphs/chars/20b1c.png">部】樊＝棥（林木交叉如篱）＋<img class="cim" src="/glyphs/chars/20b1c.png">（双手分拨），本义马负过重止而不前；字族取「篱障、攀引、分拨」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「大丑貌，从页樊声」——十分丑陋，疑指秃顶而周围有发如樊篱。</p>
<h3>横向对照</h3>
<p>同取樊部「篱障／攀引／分拨」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>f取分：发分而丑。</p>
