<h3>本义</h3>
<p>《龍龕》：「<img class="cim" src="/glyphs/chars/28836.png">，誤；<img class="cim" src="/glyphs/chars/28811.png">，正。音移。飲酒也。」《集韻》：「酡，飲而赭色著面。或作<img class="cim" src="/glyphs/chars/28811.png">。」飲酒而臉紅。</p>
<h3>声母拟态</h3>
<p>y 零声母一系（yí），绪论七组未列，不系（推）。</p>
