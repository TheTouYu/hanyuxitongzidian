<h2>射 <small>shè</small></h2>
<h3>释义</h3>
<p>【第24部部首字·一級字根】象矢在弓弦上欲射出的樣子。或加“又”，用手拉弓射箭的意思。象意射箭。shè，《集韻》：“弓弩發也。或从寸。”</p>
<h3>声母拟态</h3>
<p>聲母義（射部）：声母义（sh·弱） 辨證：因戰國文字將“弓”演變成“身”，故或从身从矢或寸，故《說文》：“，弓弩發於身而中於遠也。从矢从身。食夜切。，篆文䠶从寸。寸，法度也；亦手也。”</p>
