<h2>之 <small>zhī</small></h2>
<h3>释义</h3>
<p>【第410部部首字·一級字根】甲骨文从止从一。“止”，指足跡；“一”指地面、處所。有了足跡，意味著已經來過、已經到達，故象意往、到。跟“至”的表意結構差不多。zhī，《玉篇》：“至也。往也。”《廣韻》：“適也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
