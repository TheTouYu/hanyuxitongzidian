<h2>唐 <small>táng</small></h2>
<h3>释义</h3>
<p>【第597部「用部」】用＝象蟲蛹形；庸、唐、康三支皆取「中空、外張」一面：唐从口庚聲表大言空大，康从庚从米表穀皮中空（糠），繭从糸表蠶所結之空殼。</p>
<h3>声母拟态</h3>
<p>t「涂突」取「突」：唐从口庚聲，大言空大——語大而虛，突口而出。</p>
