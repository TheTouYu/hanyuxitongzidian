<h2>籮 <small>luó</small></h2>
<h3>释义</h3>
<p>【第579部「䍜部」】䍜（罩）＝从网从隹，象以網罩鳥令不飛走（讀若到）；春秋金文加糸作「羅」（以絲罟鳥）；轉義 環繞羅列、巡查、羅綺、遭遇；音源為借音（義音同離）。字族多指張羅之狀，表示環繞。</p>
<h3>声母拟态</h3>
<p>l取拢离：器編而离。</p>
