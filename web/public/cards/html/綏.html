<h2>綏 <small>suī / suí</small></h2>
<h3>释义</h3>
<p>妥＝从又从女，以手安撫女子（娞/綏之初文）；轉義止息安定、柔弱委頹（p292-297）。</p>
<h3>声母拟态</h3>
<p>心母s，「失收」取「收」：執綏而收身，使不傾側。</p>
