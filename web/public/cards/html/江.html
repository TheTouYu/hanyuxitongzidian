<h2>江 <small>jiāng</small></h2>
<h3>字根本义</h3>
<p>【500 工部】工＝象規矩之器（一說夯築之具），本義工具、工匠、工巧（《說文》「巧飾也」）；轉義工程、官吏、擅長。部內从工諸字多取「器用、工巧、中空方正」三面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从水工聲：長江、大川，取工之聲。</p>
<h3>横向对照</h3>
<p>同取工部「器用、工巧、中空」一面：水取其流，穴取其虛，金取其固。</p>
<h3>声母义</h3>
<p>j取聚：水聚成江。</p>
