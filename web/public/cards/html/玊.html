<h2>玊 <small>sù</small></h2>
<h3>释义</h3>
<p>【第543部「玉部」】玉＝象玉串形（三玉相連、一貫其間），《說文》「石之美……象三玉之連，ㄧ其貫也」；轉義玉製品、瑞玉、佩玉、美稱；音源借音（古玉、九通用）。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：玉朽而收。</p>
