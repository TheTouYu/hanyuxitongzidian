<h2>熯 <small>hàn</small></h2>
<h3>释义</h3>
<p>【第550部「火部」】火＝象火焰上騰；部内字族 耿／煩／赤／焦／麃／熯／難，皆以火為義源而各有取面。</p>
<h3>声母拟态</h3>
<p>h「豁活」取「豁」：火烘而豁。</p>
