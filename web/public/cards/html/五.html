<h2>五 <small>wǔ</small></h2>
<h3>释义</h3>
<p>【第226部部首字·一級字根】初象五根算籌（或五指）形，表示數字五。後省用交叉的算籌來表示；或从二，指上下，表示上下相對交錯之意。wǔ，《玉篇》：“數也，次四也。”《增韻》：“中數也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wǔ）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
