<h2>斤 <small></small></h2>
<h3>释义</h3>
<p>【第44部部首字·一級字根】甲骨文象曲柄的石斧形；刃部與“矢”鋒同，指其利如石鏃。jīn，《正字通》：“斧類。”《釋名·釋用器》：“斤，謹也。板廣不可得削，又有節，則用此斤之，所以詳謹令平滅斧跡也。”</p>
<h3>声母拟态</h3>
<p>聲母義（斤部）：声母义（j·中） 辨證：斤作為砍斫器具，功用是多方面的。《說文》：“斫木也。象形。凡斤之屬皆从斤。舉欣切。”失之于片面。</p>
