<h2>天 <small>tiān</small></h2>
<h3>释义</h3>
<p>【第115部部首字·一級字根】象枝狀閃電形。本“申”的異體。</p>
<h3>声母拟态</h3>
<p>聲母義（天部）：声母义（t·强） 辨證：由于“天”的字形，尤其是商代金文，是一個正立的人形。一般都認為是指人的頭頂。《說文》：“顛也。至高無上。从一大。他前切。” 《戰國古文》：“甲骨文作。从大，（丁）象人頭之形。丁亦聲。”</p>
