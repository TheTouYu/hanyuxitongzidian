<h2>層 <small>céng</small></h2>
<h3>字根本义</h3>
<p>【503 曾部】曾＝甑之初文，象蒸器（箅上有汽）之形；借為「曾經」，轉義重疊（曾祖）、乃。部內从曾諸字取「增加、重疊」兩面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从尸曾聲：重屋曰層，取曾之重疊。</p>
<h3>横向对照</h3>
<p>曾部取「重疊增加」，亙部取「迴環延續」，从部取「相隨而聚」；形符各定落點。</p>
<h3>声母义</h3>
<p>c「刺持」取「持」：重積而持。</p>
