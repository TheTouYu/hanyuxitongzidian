<h2>䳑 <small>yǒu</small></h2>
<h3>字根本义</h3>
<p>【463 又部·余支】又部末诸字，多取「手持、器用、声貌」之细义：<img class="cim" src="/glyphs/chars/25053.png">为舀水小瓯，醢为盛于瓯中的肉酱，<img class="cim" src="/glyphs/chars/29472.png">为头颤之疾；喐、哊、詴皆口出声；䳑、䒴以鸟与草为名。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从鳥有声——《玉篇》「白鵫也」，白鹇。</p>
<h3>横向对照</h3>
<p>同为又部之细义，形符各定落点：皿受器，酉受酱，頁受颤，口与言受声，鳥与艸受名。</p>
<h3>声母义</h3>
<p>y取柔：鸟白而柔。</p>
