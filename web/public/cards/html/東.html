<h2>東 <small></small></h2>
<h3>释义</h3>
<p>【第122部部首字·一級字根】从木田聲。“田”，指鼓；从“木”，象意木鼓，將木頭掏空而成。可謂“<img class="cim" src="/glyphs/chars/27bfe.png">（dōng）”的初文，《類篇》：“<img class="cim" src="/glyphs/chars/27bfe.png"><img class="cim" src="/glyphs/chars/27bfe.png">，鼓聲。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 無；未列 02z，按緒論取一面未判（02z 未收）。</p>
