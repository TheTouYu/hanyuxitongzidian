<h2>讘 <small>niè</small></h2>
<h3>释义</h3>
<p>聶部部头从耳之二叠或三叠：叠体表多与极致，象仔细听；亦象割耳记功之合拢叠合、耳垂之长、耳之原地摇动。音源借音，耳薄小如叶，义音同「葉」，又与「十」通。</p>
<h3>声母拟态</h3>
<p>口动而声微，取「轻语」一面。</p>
