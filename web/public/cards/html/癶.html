<h2>癶 <small>bō</small></h2>
<h3>字根本义</h3>
<p>【423 癶部】癶＝象两足相背之形，表示两脚交叉、行走不顺（《说文》「足剌癶也，读若拨」）；辨证「癶、舛」应是一字——动物正常脚印是相对的，交错便走不好；故癶、舛或指两足并立、或指两足交错。音源：借音字，义音或如「乘」（作登字声符）、或如「背」（作癹字声符）。字族：荈（老茶）、<img class="cim" src="/glyphs/chars/25b2b.png">（竹贯物）、曻（昇）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>本部部首字——两足相背、交叉，行走不顺。</p>
<h3>横向对照</h3>
<p>同取「两足交踏——除草／分拨」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b「闭剥」取「剥」：足剥地而交。</p>
