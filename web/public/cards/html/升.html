<h2>升 <small>shēng</small></h2>
<h3>释义</h3>
<p>【第168部部首字·一級字根】从斗从八，象意用斗量。“八”或作許多小點，指用斗量穀米時，穀米灑落的樣子。shēng，《說文》：“十龠也。从斗，亦象形。識蒸切。”《正字通》：“十合器也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
