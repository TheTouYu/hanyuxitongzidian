<h2>夾 <small>jiā</small></h2>
<h3>释义</h3>
<p>【第76部部首字·一級字根】象兩人分處于一人腋下两侧之形。可象意一人夾持左右兩人。jiā，《說文》：“持也。从大俠二人。古狎切。”</p>
<h3>声母拟态</h3>
<p>聲母義（夾部）：声母义（j·强） 辨證：可能是為了區別，春秋金文將一人夾持兩人之義之中的兩人分化作兩“入”，从而演變作“㚒（shǎn）”。故《說文》：“㚒，盜竊褱物也。从亦，有所持。俗謂蔽人俾夾是也。弘農陝字从此。失冄切。”</p>
