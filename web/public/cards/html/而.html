<h2>而 <small>ér</small></h2>
<h3>释义</h3>
<p>【第330部部首字·一級字根】象人四肢著地的樣子，指嬰幼兒的爬行階段。音義與“爾”同，指小孩。</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 ér；未列 02z，按緒論取一面未判（02z 未收）。</p>
