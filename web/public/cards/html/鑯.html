<h2>鑯 <small>jiān</small></h2>
<h3>释义</h3>
<p>【第595部「㦰部」】㦰（jiān）＝象戈割从（眾人）之足，對一群體全部割取，表收割、滅盡（《玉篇》「田器。又盡也」）；轉義 細小脆弱→纖細；辨證《說文》「从从持戈」析形已隔；音源借音同「冉」「三」。</p>
<h3>声母拟态</h3>
<p>j取聚决：鐵尖而决。</p>
