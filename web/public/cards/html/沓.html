<h2>沓 <small>tà</small></h2>
<h3>字根本义</h3>
<p>【466 眔部字族】从眔诸字皆取蟾蜍「皮衣鼓囊、爬行相及」两面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从水眔声（《说文》「語多沓沓也」）：水流重叠相及，引申繁多、重复、合沓。</p>
<h3>横向对照</h3>
<p>同取眔部「蟾蜍皮裹、爬行相及」两面：衣取其裹，水、辵、艸取其相及，魚取其独。</p>
<h3>声母义</h3>
<p>t「涂突」取「涂」：重叠相涂。</p>
