<h2>刅 <small>chuāng</small></h2>
<h3>释义</h3>
<p>【第522部部首字·一級字根】西周金文象枝葉對生形。一般樹木的枝葉多是交互而生，但荊卻是對生的，故專指荊。 “荊（jīng）”的初文，《說文》：“楚木也。从艸刑聲。，古文荊。舉卿切。”《廣韻》：“木名，可染。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
