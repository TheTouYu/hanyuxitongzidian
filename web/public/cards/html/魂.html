<h2>魂 <small>hún</small></h2>
<h3>字根本义</h3>
<p>【471 鬼部】鬼＝从甶（面具）从人，面目不可辨，表死者魂魄（鬼之言歸也）；音如蛙鳴。本部诸字皆由「魂魄—精怪—高大可畏」三面孳乳。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从鬼云声：《說文》「陽气也」，魂為陽神，遊於天。</p>
<h3>横向对照</h3>
<p>同取鬼部「陽魂／陰魄／高大／精怪」四面，形符各定落点。</p>
<h3>声母义</h3>
<p>h「豁活」取「活」：氣動而活。</p>
