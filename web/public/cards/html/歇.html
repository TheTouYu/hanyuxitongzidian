<h2>歇 <small>xiē</small></h2>
<h3>释义</h3>
<p>从欠曷聲：《說文》「息也」，氣泄而止。</p>
<h3>声母拟态</h3>
<p>x「续消」取「消」：勞作不已，氣力消盡乃休歇。</p>
