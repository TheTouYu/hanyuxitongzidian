<h2>禓 <small>yáng</small></h2>
<h3>释义</h3>
<p>【第525部「昜部」】昜＝从日从丂（丂為脖頸象形），象對日呼喊、日初升，「暘」之初文；《說文》「日出也」。轉義：日飛升→飛舉（《廣韻》「飛也」）；日大→乾旱不生。辨證：金文於丂下添光芒形，遂形近「勿」。音源：本丂聲，源出呼號，故與羊、象通。字族分三面：日烈（熱瘡夭折）／日出（明亮灼熱）／日升（飛揚搖盪）。</p>
<h3>声母拟态</h3>
<p>y取圆容：祭於道周。</p>
