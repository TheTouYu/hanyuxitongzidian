<h2><img class="cim" src="/glyphs/chars/2389c.png"> <small>yǒu</small></h2>
<h3>释义</h3>
<p>【第587部「幺部」】幺＝象蠶吐絲（兩股相交）；幼支＝从力幺聲（力氣小，指小孩）：少也（《說文》），引申 嫩弱、精微美好、軟曲；字族取「幽暗黑色／聲音細小幽靜／形態柔曲細弱」三面。</p>
<h3>声母拟态</h3>
<p>y取续消：氣出而续。</p>
