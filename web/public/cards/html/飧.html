<h2>飧 <small>sūn</small></h2>
<h3>釋義</h3>
<p>飧（餐湌）sūn《說文》：“餔也。从夕、食。思魂切。”晚飯。《玉篇》：“水和飯也。”《釋名》：“飧，散也。投水于中，自解散也。”《集韻》：“或作餐。通作湌。”</p>
<h3>字理分析</h3>
<p>聲旁為「夕」，其古文字字形、本義、轉義、辯證、音源、字族衍義見字根卡「夕」（本頁會自動鏈接呈現）。</p>
<h3>聲母擬態</h3>
