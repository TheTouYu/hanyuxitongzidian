<h2>禠 <small>sī</small></h2>
<h3>释义</h3>
<p>甲骨文初本从林或艸从人。象意人在森林或草原中迷失方向。後來“林”或“艸”簡寫作“屮”。shī，《廣韻》：“錯也。”</p>
<h3>声母拟态</h3>
<p>心母s，「失收」取「失」：跪拜而伏。</p>
