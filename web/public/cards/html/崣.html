<h2>崣 <small>wěi</small></h2>
<h3>释义</h3>
<p>委：从匚从禾／从女从禾，象禾穗或髮辮下垂；引申彎曲、枯萎、堆積、末尾跟隨，音同「妥」（p513-518）。</p>
<h3>声母拟态</h3>
<p>影母／零聲母，「豁活」取「豁」：山勢豁然開朗而高。</p>
