<h2>巫 <small>wū</small></h2>
<h3>释义</h3>
<p>【第315部部首字·一級字根】甲骨文為“工”的橫直交叉形。“工”指百工；橫直交叉，表示能經緯天地四方之意。wū，《玉篇》：“神降。男為巫，女為覡。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wū）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
