<h2>叟 <small>sǒu</small></h2>
<h3>释义</h3>
<p>【第98部部首字·一級字根】甲骨文从宀从又持火把。“宀”指屋子。表示在屋裏舉著火把的樣子。象意有二：</p>
<h3>声母拟态</h3>
<p>聲母義（叟部）：声母义（s·强） 辨證：《說文》：“老也。从又从災。闕。，籀文从寸。，叜或从人。穌後切。”“災”指火災，字義與之無關。故析形不確。</p>
