<h2><img class="cim" src="/glyphs/chars/20094.png"> <small>zǐ</small></h2>
<h3>释义</h3>
<p>【第21部部首字·一級字根】甲骨文从（丰）从。“丰”，指艸的長勢茂盛；“”，指集束。象意將豐茂的草類捆成一束。實即“秭（zǐ）”的初文，《集韻》：“禾五稯。”稯，《廣韻》：“禾束。”</p>
<h3>声母拟态</h3>
<p>聲母義（<img class="cim" src="/glyphs/chars/20094.png">部）：声母义（z·中） 辨證：西周金文演變較大，已經看不出“丰”字，小篆从之。故《說文》：“止也。从<img class="cim" src="/glyphs/chars/233b5.png">盛而一橫止之也。即裏切。”析形不確。</p>
