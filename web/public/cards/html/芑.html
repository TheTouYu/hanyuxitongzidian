<h2>芑 <small>qǐ</small></h2>
<h3>字根本義</h3>
<p>己（<img class="cim" src="/glyphs/chars/22012.png">jǐ）：象磚石等壘疊所形成的縫隙形，表示累積、堆疊（《釋名》「紀也，皆有定形，可紀識也」）。轉義：相對的個體→自己本身；累疊之狀→傾覆崩塌（分化為圮）。字族衍義：①磚縫→堆疊、編結、接續；②形近「厶、尸、弓」之訛。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該條前後無獨立插圖。</p>
<h3>形旁声旁</h3>
<p>从艸己聲，《說文》「白苗嘉榖」（驅裡切），疑因形近誤同「<img class="cim" src="/glyphs/chars/26b0a.png">」；《爾雅》<img class="cim" src="/glyphs/chars/26b0a.png">白苗，郭注今白粱粟；本指爬山虎之類攀牆植物。</p>
<h3>横向对照</h3>
<p>①組：藤蔓攀牆、蔓延相接，正是「接續」在艸一面的落點。</p>
<h3>声母义</h3>
<p>q「親缺」取「親」：蔓附牆而親。</p>
