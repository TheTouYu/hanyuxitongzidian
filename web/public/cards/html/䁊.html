<h2>䁊 <small>wò</small></h2>
<h3>释义</h3>
<p>【第586部「爪部」·㕚及形近之訛】㕚＝从又（手）指間有小點，象以手抓撓（小點為掉落皮屑），實「搔」之初文；《說文》「手足甲也，从又，象㕚形」所解與字形不符（小點在指間非指頭），應指爪子。部內另有形近「又、介、<img class="cim" src="/glyphs/chars/200a2.png">」之訛字組。</p>
<h3>声母拟态</h3>
<p>w取蒙末：目深而末。</p>
