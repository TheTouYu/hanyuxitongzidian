<h2>縊 <small>yì</small></h2>
<h3>释义</h3>
<p>部頭益：甲骨文从皿中水滿形，與「易」本同源，表示水滿溢之狀，是「溢」的初文（《說文》「器滿也，从水益聲，夷質切」）。轉義三路：①水溢出→富饒、增加、助益（《說文》「益，饒也」）；②皿中溢滿亦因放進別物→淹沒；③「<img class="cim" src="/glyphs/chars/20373.png">」（縊之初文，象用繩索勒住形，从冉（竹索）加○（繩套））→用繩勒死→勒住脖頸→咽喉（嗌）、要隘。辯證：《說文》「<img class="cim" src="/glyphs/chars/20373.png">，咽也，从口益聲」析形不確——西周金文从冉，上加○，象繩套。音源：源自縊時喉嚨所發出的聲音；義音同「失」（泆、佚、軼並作溢）。字族衍義：①溢（溢出滿數）②縊（勒住捉住）③嗌（喉嚨脖頸要隘）。</p>
<h3>声母拟态</h3>
<p>影母y，不系（古音屬影母）。</p>
