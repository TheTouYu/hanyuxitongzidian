<h2>麂 <small>jǐ</small></h2>
<h3>释义</h3>
<p>从鹿旨聲：大麋，狗足，皮毛淺而油光；取旨之脂膏光澤義。</p>
<h3>声母拟态</h3>
<p>j取聚决：鹿聚而决。</p>
