<h2>舄 <small>què</small></h2>
<h3>释义</h3>
<p>【第415部部首字·一級字根】象喜鵲展翅之形。喜鵲的翅膀很特別，雙翅黑色而在翼肩有一大形白斑，尾遠較翅長，呈楔形，嘴、腿、腳純黑色，腹面以胸為界，前黑後白。西周金文突出的就是它的翅膀。què，《廣韻》：“古鵲字。”《說文》：“鵲也。象形。篆文舄从隹昔。七雀切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 q（擬態「亲缺」），取「缺」一面；本部未列 02z 表，按緒論推。</p>
