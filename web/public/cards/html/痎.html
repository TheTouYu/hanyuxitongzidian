<h2>痎 <small>jiē</small></h2>
<h3>字根本义</h3>
<p>【418 亥部】亥＝甲骨文象直立的旱獭形，「鼥」之初文；转义：掘食草根→荄，直立放哨→警惕·防备（该）、受惊竖立（骇），爪尖善掘→刻镂，传播鼠疫近似疟疾→痎，借指地支末位。辯證：字形近「豕」且恰应生肖，故或混同，《说文》「从二，二古文上字」析形不确。音源：源自旱獭叫声，因有直挺义而义音同「介」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「二日一发疟」——疟疾；旱獭易染鼠疫，症状近似。</p>
<h3>横向对照</h3>
<p>同取亥部「旱獭直立放哨——警惕·闭塞」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>j「聚决」取「聚」：寒热聚而发。</p>
