<h2>厄 <small>è</small></h2>
<h3>释义</h3>
<p>【第38部部首字·一級字根】甲骨文从跪著的人形（卩）膝蓋部位畫一弧線。象事字，表示曲如彎著的膝蓋，指牲口拉東西時駕在頸上的曲木。西周金文徑作車軛的象形。“軛（è）”的初文，《說文》：“轅前也。从車戹聲。”《玉篇》：“牛領軶也。亦作軛。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第38部），無擬態聲母義可系，義靠義類與字形。</p>
