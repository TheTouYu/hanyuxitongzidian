<h3>释义</h3>
<p>【第592部「冬部」】冬＝象冰淩垂珠形，結冰時節；轉義 終盡（《釋名》「終也」）；音源＝敲冰聲（懸冰如磬，義音同殸）。本批取「終了終盡」「螽紋」「冬聲」三面。</p>
<h3>声母拟态</h3>
