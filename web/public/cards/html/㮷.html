<h2>㮷 <small>jī</small></h2>
<h3>释义</h3>
<p>㮷jī《廣韻》：“㮷風，扶杓木也。”《集韵》：“木名，如楓。”</p>
<h3>声母拟态</h3>
<p>声母义：今读 jī，按声母取绪论拟态义一面（02z 未列本部）。</p>
