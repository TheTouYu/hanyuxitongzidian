<h2>兟 <small>shēn</small></h2>
<h3>释义</h3>
<p>【第565部部首字·一級字根】“兟”的甲骨文本象人牽引另一人的樣子。象意引導。shēn，《說文》：“兟，進也。从二先。贊从此。闕。所臻切。”或寫作“大”的二疊為“夶”，故也可象意眾多。《玉篇》：“兟兟，衆多皃。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
