<h2>巾 <small></small></h2>
<h3>释义</h3>
<p>【第119部部首字·一級字根】从冂从十。“冂”，表示遮覆，“十”，指十倍，象意遮覆得很嚴實，表示覆蓋用的織物。jīn，《正韻》：“羃也。”</p>
<h3>声母拟态</h3>
<p>聲母義（巾部）：声母义（j·中） 辨證：對“巾”中的“ㄧ”認識不一，《說文》以其“象糸”：“佩巾也。从冂，ㄧ象糸也。凡巾之屬皆从巾。居銀切。”《戰國古文》以其象“所覆之物”：“甲骨文作。从冂（冪之初文），ㄧ表示所覆之物。指事。金文作。”林義光《文源》以其“象佩巾下垂之形。”</p>
