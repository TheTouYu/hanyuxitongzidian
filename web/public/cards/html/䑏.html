<h2>䑏 <small>quán</small></h2>
<h3>字根本义</h3>
<p>【444 雈部】雈＝苍鹭；诸字取鹭之「曲颈、水泽、玉火」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韻》「䑏，肥也」——肥貌。</p>
<h3>横向对照</h3>
<p>同取雈部「曲颈／水泽」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>q取缺：肉丰而缺。</p>
