<h2>艷（豔豓<img class="cim" src="/glyphs/chars/21929.png">艳） <small>yàn</small></h2>
<h3>本义</h3>
<p>《集韻》：「豔，《說文》：『好而長也。从豐，豐，大也。』引《春秋傳》：『美而豔。』隷作艷。」《玉篇》：「美也、好色也。俗作艶。」《增韻》：「歆羨也。」色彩鮮明、羨慕、關于愛情的、美麗，亦指美女。</p>
<h3>声母拟态</h3>
<p>y 零声母，不系（推）。</p>
