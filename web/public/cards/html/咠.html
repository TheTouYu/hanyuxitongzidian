<h2>咠 <small>qì</small></h2>
<h3>释义</h3>
<p>【第83部部首字·一級字根】从口从耳，象意有二：或指以耳就口，聽人說話。此意後來分化作“聖”和 “聽”。或指以口就耳，跟“聶”義近，指對著人的耳朵說悄悄話。qì，《說文》：“聶語也。从口从耳。《詩》曰：‘咠咠幡幡’。七入切。”</p>
<h3>声母拟态</h3>
<p>聲母義（咠部）：声母义（q·强）</p>
