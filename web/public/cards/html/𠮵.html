<h3>释义</h3>
<p>【第528部「上部」】上（丄）＝甲骨文从「一」上加指示符號，指物體的上面（《說文》「高也……指事也」）；轉義往上、登升；位處諸物之上（君也）；以為上（尊崇）。音源借音：物之上敞開，義音同「尚」。字族衍義：①指高處、往上 ②象意含往上義。</p>
<h3>声母拟态</h3>
<p>m「蒙末」取「蒙」：問而不答。</p>
