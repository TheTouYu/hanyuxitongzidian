<h2>淼 <small>miǎo</small></h2>
<h3>释义</h3>
<p>【第590部部首字·一級字根】从水的三疊。“水”，指水；三疊，表示極致。象意水面浩瀚無際，看不到邊。miǎo，《說文》：“大水也。从三水。或作渺。亡沼切。”《正字通》：“水淼茫貌。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
