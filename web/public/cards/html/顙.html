<h2>顙 <small>sǎng</small></h2>
<h3>释义</h3>
<p>【第531部「桑部」】桑（桒枽）＝甲骨文象枝條繁茂的桑樹（《玉篇》「蠶所食葉」）；轉義桑樹堅硬柔韌、老幹多圓鼓結節→圓而堅韌之物（車輞）；以葉飼蠶→蠶之狀（左右搖擺、用力推）。辯證：小篆枝葉訛作「叒」，《說文》析形不確。音源借音：桑葉被摘有空爽義，義音同「爽」（《書》「用爽厥師」一本作「喪」）。字族：①桑之結節（圓鼓硬物）②桑葉蠶事。</p>
<h3>声母拟态</h3>
<p>s取失收：額鼓而收。</p>
