<h2><img class="cim" src="/glyphs/chars/27dcc.png">（<img class="cim" src="/glyphs/chars/27e06.png">贅） <small>zhuì</small></h2>
<h3>释义</h3>
<p>《集韻》「贅，朱芮切。《說文》：『以物質錢…』古作<img class="cim" src="/glyphs/chars/27dcc.png">。」抵押；贅《釋名》「屬也。橫生一肉，屬著體也」疣子；《廣雅》「聚也」「得也」「定也」；《小爾雅》「屬也」連綴；《正字通》「又男壻女家曰贅壻」</p>
<h3>声母拟态</h3>
<p>zong組取「聚」：《集韻》「贅，朱芮切。《說文》：『以物質錢…』古（推）。</p>
