<h3>释义</h3>
<p>【第560部「孨部」】孨＝从子之二疊或三疊：多子（孖，一產二子）或多胞胎；疊體亦表極致，指十分幼弱孤露；引申謹慎、懦弱、孤兒、滋長。</p>
<h3>声母拟态</h3>
<p>z取凿总：水滋而总。</p>
