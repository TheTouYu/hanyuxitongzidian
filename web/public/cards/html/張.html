<h2>張 <small>zhāng</small></h2>
<h3>释义</h3>
<p>【第537部「長部」】長＝甲骨文象人长发拄杖之形，表年长（《廣雅》「老也」），所拄杖亦为权杖→首领（《廣雅》「君也」）；转义久远多→长处→增进→抚育；辩证《说文》以拄杖为倒亡，不确；音源借音（抚育义音同「羊」，古長、羊通用）。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「凿」：弓張而凿。</p>
