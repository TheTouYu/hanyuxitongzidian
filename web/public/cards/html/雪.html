<h2>雪 <small>xuě</small></h2>
<h3>字根本义</h3>
<p>【481 彗部】彗＝象兩彐（草穗）之形，彐象蘆葦、茅草的穗子，兩迭表眾多；音源字，取風吹穗子或穗子抽打之聲。480部後部內另有「雪」（从雨彗聲，雪花如葦絮）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从雨彗聲：雪花如葦絮，故从彗；《釋名》「綏綏然下」。</p>
<h3>横向对照</h3>
<p>同取彗帚一系「草穗可束、可掃、可抽打」三面：雨取其絮，手提之，女執之。</p>
<h3>声母义</h3>
<p>x「续消」取「续」：絮續而落。</p>
