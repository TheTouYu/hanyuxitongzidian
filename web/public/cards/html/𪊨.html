<h2><img class="cim" src="/glyphs/chars/2a2a8.png"> <small>jǐ</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/2a2a8.png">（麂）jǐ《說文》：“大麋也。狗足。从鹿旨聲。，或从几。居履切。”大麋鹿。像鹿，腿細而有力，善跳躍，皮很軟可以制革。毛淺而油光發亮。</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：麂皮毛細軟，毛總聚而密（推）。</p>
