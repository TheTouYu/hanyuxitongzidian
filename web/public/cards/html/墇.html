<h2>墇 <small>zhàng</small></h2>
<h3>释义</h3>
<p>【第520部「章部」】章＝甲骨文从〇（玉璧）从辛（刀），象刀形玉璧，為「璋」之初文；轉義憑信之標記→顯明、篇章章程、紅色；辯證與「璧」同源；音源本「辛」聲，彰明義音同「黃」。</p>
<h3>声母拟态</h3>
<p>zh取凿总：土壅而障。</p>
