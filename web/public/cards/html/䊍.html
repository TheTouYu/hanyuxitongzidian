<h2>䊍 <small>lí</small></h2>
<h3>释义</h3>
<p>【第569部「黍部」】黍＝甲骨文从禾四周有小點，象穗長而穀粒鬆散（糜子、黃黍）；黏者為黍，不黏者為稷；音近「朱」（黏如漆），字族多以「黎」表音，義取離（色黃黑如離）。</p>
<h3>声母拟态</h3>
<p>l取拢离：粥黏而离。</p>
