<h2>女 <small>nǚ</small></h2>
<h3>释义</h3>
<p>【第263部部首字·一級字根】象女子跪跽而有所懷抱之狀，指母親的哺乳，表示女性之意。nǚ，《說文》：“婦人也。象形。王育說。凡女之屬皆从女。尼呂切。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 nǚ；未列 02z，按緒論取一面未判（02z 未收）。</p>
