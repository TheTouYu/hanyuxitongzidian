<h2>款 <small>kuǎn</small></h2>
<h3>本义</h3>
<p>款，kuǎn：从欠柰聲（原稿：「款从柰，本指暗里显露」）。转义：标识、条款、诚恳、缓慢。</p>
<h3>音源</h3>
<p>款从「柰」得声，取柰之「短密、暗中」义。</p>
<h3>声母拟态</h3>
<p>k「口控」取「控」：暗里显露而控（推）。</p>
<h3>字族衍义</h3>
<p><b>暗中进行，表幽隐</b></p>
