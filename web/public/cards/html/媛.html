<h2>媛 <small>yuán</small></h2>
<h3>字根本义</h3>
<p>【479 爰部】爰＝甲骨文與「寽」形近，兩手各持「一」的一端，象以藤狀物相牽拉；金文或改「一」為「帀」（倒生），上手下手分指俯拉與攀援。轉義為援助、又作虛詞「為、于、曰」。音源借猿善攀援為聲（古袁、爰通用）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从女爰聲：美女，《詩》「邦之媛也」。</p>
<h3>横向对照</h3>
<p>同取爰部「牽引相助、柔緩相續」两面：手引、女美、絲緩、日暖各定其一。</p>
<h3>声母义</h3>
<p>y取续：女美相牽。</p>
