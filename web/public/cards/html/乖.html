<h2>乖 <small>guāi</small></h2>
<h3>字根本义</h3>
<p>【443 乖支】乖（guāi）＝卝之二叠，象十分幼稚顽皮；多指奇异歪斜。辯證：《说文》「从<img class="cim" src="/glyphs/chars/26af3.png">而<img class="cim" src="/glyphs/chars/20501.png">」析形不确。音源：借音，义音同癸（睽/乖）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《广韵》「睽也、離也、戾也、背也」；《广雅》「差也」——十分幼稚顽皮，引申乖违、奇异。</p>
<h3>横向对照</h3>
<p>同取卝部「总角／门闩穿连」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>g取隔：背戾而隔。</p>
