<h2>隳 <small>huī</small></h2>
<h3>字根本义</h3>
<p>【485 毀部】毀＝从攴从臼从工，工指夯土之杵、臼指舂穀之臼、攴指擊打，象搗杵擊打破壞；轉義為毀謗、毀壞；音源字，取搗物之聲。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从阜毀聲：毀壞城郭牆垣，引申隳敗。</p>
<h3>横向对照</h3>
<p>同取尾部「末端垂垂」與毀部「擊打破損」兩面：女取其順，火阜取其破。</p>
<h3>声母义</h3>
<p>h取豁：城塌而豁。</p>
