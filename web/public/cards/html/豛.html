<h2>豛 <small>yì</small></h2>
<h3>本义</h3>
<p>豛，yì：《說文》「上谷名豬豭。从豕，役省聲。營只切。」上谷（地名）把公豬叫作「豛」；从「豕」表類，从「役」省聲。</p>
<h3>辩证</h3>
<p>《玉篇》：「齧豕。」——疑指野豬：有獠牙似「殳」，受驚時撞向對方（原稿按語）。</p>
<h3>音源</h3>
<p>从「役」省聲（營只切），借役之音記豛之讀。</p>
<h3>声母拟态</h3>
<p>y 零聲母，不系（照實）。</p>
