<h2>寅 <small>yín</small></h2>
<h3>释义</h3>
<p>【第515部「黃部」·寅支】寅＝甲骨文象矢穿過丙形（丙為整直箭杆的柄形器），本義整直箭杆；轉義矯直則長→拉引、演進；音源借「引」。</p>
<h3>声母拟态</h3>
<p>y「柔锐」取「锐」：矢銳而引。</p>
