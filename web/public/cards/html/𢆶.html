<h2><img class="cim" src="/glyphs/chars/221b6.png"> <small>yòu</small></h2>
<h3>释义</h3>
<p>【第387部部首字·一級字根】幺的二疊。“幺”，指蠶絲；二幺，言其極致。既可象意其蠶絲的連綿不斷；也可象意其十分纖細。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yòu）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
