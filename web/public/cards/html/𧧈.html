<h2><img class="cim" src="/glyphs/chars/279c8.png"> <small>lěi</small></h2>
<h3>释义</h3>
<p>部頭糸（幺糹糸<img class="cim" src="/glyphs/chars/221af.png">）：从「幺」的一頭或兩頭出緒，象多股絲絞在一起的樣子，指拈出的紗線（《說文》「細絲也，象束絲之形」，莫狄切）。轉義：紗線細微→微小（《廣雅》「微也」）；綿長→連綿（《廣韻》「連也」）。音源：源自拈絲聲。字族衍義：①線繩之用→羈縻束縛 ②絲線→細微 ③形近「耒」之訛。</p>
<h3>声母拟态</h3>
<p>l 舌「攏離」取「攏」：總括其行以成謚。</p>
