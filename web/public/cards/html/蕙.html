<h2>蕙 <small>huì</small></h2>
<h3>字根本义</h3>
<p>【450 叀部】惠支取「纺叀之短尖、细密、用心专一」诸面；軎支取「纺轮转动、缠线、相击」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「香草，生下濕地」——一干数花而香不足者蕙，古以避疫。</p>
<h3>横向对照</h3>
<p>同取叀部「短尖／细密／轮转」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>h取活：草香而活。</p>
