<h2>臊 <small>sāo</small></h2>
<h3>释义</h3>
<p>【第584部「喿部」】喿＝从品从木，眾口在木上（象蟲鳥獸眾多在樹上鳴叫），「噪」之初文，《玉篇》「呼噪也」；轉義 雜亂（米穀雜）、焦躁急迫；音源為噪雜叫聲（義音同「小」）。字族五面：聲音之雜／狀態之雜／色彩之雜／行為之雜（擾動爬搔）／心理之雜（焦急）。</p>
<h3>声母拟态</h3>
<p>s取失收：肉臭而收。</p>
