<h2>鰳 <small>lè</small></h2>
<h3>释义</h3>
<p>【第571部「力部」】力＝耒之初文（有弧度的樹杈，上加橫木踏足，即「耒」，犁之初文）；引申功勞、力量、能力；《說文》「象人筋之形」析形不確；音源為耒耕時與泥土的摩擦聲。</p>
<h3>声母拟态</h3>
<p>l取拢离：魚刺而离。</p>
