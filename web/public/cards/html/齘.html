<h2>齘 <small>xiè</small></h2>
<h3>释义</h3>
<p>【第81部「介部」（卷十三 合）】介＝甲骨文从人四周有小點（象人身上長小硬塊，即「疥」之初文；或象人披皮革金屬連綴之鎧甲，《玉篇》「甲也」）；轉義 幫助護佑憑藉（《廣韻》「助也佑也」）／間隔障礙疆界側旁／堅固／大、獨特、單個（个）；辯證 小篆將小點簡寫作「八」，《說文》「从八从人，人各有介」析形不確；音源借音（古介、丯通用，《老子》「執左契」帛書作「介」）。字族二面：外殼硬／散佈的小塊。</p>
<h3>声母拟态</h3>
<p>x「续消」取「消」：齒切而消。</p>
