<h2>你 <small>nǐ</small></h2>
<h3>释义</h3>
<p>你：从人从爾，第二人称；尔为草裙幼儿，借为对称（推）。</p>
<h3>字理分析</h3>
<p>字根「尔」＝穿草裙的幼儿（爾之初文），故「你」取人称、亲密口吻。</p>
<h3>声母义</h3>
<p>n「纳弄」取「纳」：人对而纳。</p>
