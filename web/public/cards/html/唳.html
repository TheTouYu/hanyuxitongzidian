<h2>唳 <small>lì</small></h2>
<h3>字根本义</h3>
<p>【430 戾部】戾＝犬后腿直立欲扑（马抬前腿同义），引申乖张、凶残；字族多取「立而不稳／曲戾」之状。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「鹤鸣也」——鹤雁高亢鸣叫，含惊惧意。</p>
<h3>横向对照</h3>
<p>同取戾部「曲戾而立」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>l取离：声高而离。</p>
