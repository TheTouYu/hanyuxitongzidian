<h2>祘 <small>suàn</small></h2>
<h3>释义</h3>
<p>【第507部部首字·一級字根】从示的二疊。“示”，不是指神靈之“示”，而是象算籌縱橫佈局之形：上橫為十位算籌，下豎為個位算籌；二迭以表示多欄之意。後來的算盤，其構造原理其實跟算籌差不多，只是用串珠代替短棍而已。《說文》：“明視以筭之。从二示。《逸周書》曰：‘土分民之祘。均分以祘之也。’讀若筭。蘇貫切。”清陳昌治刻本《說文》注：“算籌縱橫之象。蜀本《說文》祘从二<img class="cim" src="/glyphs/chars/25605.png">。民之祘：民之賦稅。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 s（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
