<h2>翏 <small>liù</small></h2>
<h3>释义</h3>
<p>【第548部部首字·一級字根】甲骨文本从（帚）的二疊。“帚”，象草穗形；二疊，表示極致。中或有小點，後演變成“㐱”，指子實。象意草穗高高挺立或成片的樣子。“蓼（liǎo）”的初文，《集韻》：“艸長大皃。《詩》：‘蓼蓼者莪。’一曰眾薪也。”準確地說，應該是指草穗的長大。或專指蓼草。《說文》：“辛菜，薔虞也。从艸翏聲。盧鳥切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
