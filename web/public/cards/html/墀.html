<h2>墀 <small>chí</small></h2>
<h3>释义</h3>
<p>象獨角的犀牛形。本“兕”或“<img class="cim" src="/glyphs/chars/24261.png">”。sì，《說文》：“<img class="cim" src="/glyphs/chars/24261.png">（兕），如野牛而青。象形。與禽、离頭同。凡<img class="cim" src="/glyphs/chars/24261.png">之屬皆从<img class="cim" src="/glyphs/chars/24261.png">。，古文从儿。徐姊切。”《集韻》：“一說雌犀也。古作兕、<img class="cim" src="/glyphs/chars/27c3d.png">，或作<img class="cim" src="/glyphs/chars/20483.png">、雉。”</p>
<h3>声母拟态</h3>
<p>澄母ch，「刺持」取「持」：泥塗附地而持住。</p>
