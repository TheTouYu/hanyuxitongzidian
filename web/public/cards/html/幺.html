<h2>幺 <small>yāo</small></h2>
<h3>释义</h3>
<p>【第587部部首字·一級字根】象蠶剛吐出的絲形。蠶吐絲時，頭部左右搖擺，故吐出的絲呈兩根相交狀。mì，《集韻》：“糸，《說文》：‘細絲也。像束絲之形。’徐鍇曰：‘一蠶所吐為忽；十忽為絲。’糸，五忽也。或省。”實際上“幺”應該是徐鍇所說的“忽”；而“糸”的兩頭有三股，表示多根幺績成的絲線。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yāo）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
