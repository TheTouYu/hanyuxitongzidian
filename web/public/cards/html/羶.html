<h2>羶 <small>shān</small></h2>
<h3>释义</h3>
<p>【第592部「冬部」·亶族】亶＝从㐭从旦，象穀倉堆滿（《說文》「多穀也」）；轉義 誠然、信（《爾雅》「亶，信也」）、厚；此族取「穀多、厚實、展轉」三面。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：羊臭而收。</p>
