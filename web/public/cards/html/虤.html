<h2>虤 <small>yán</small></h2>
<h3>释义</h3>
<p>【第426部部首字·一級字根】甲骨文象兩虎一倒一順之形。“虎”，象虎形；二疊，既可象意兩虎的相爭；也可象意十分兇猛、憤怒。yán，《說文》：“虎怒也。从二虎。凡虤之屬皆从虤。五間切。”《廣韻》：“贙，一曰對爭也。到一虎者，非也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yán）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
