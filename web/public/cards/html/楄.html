<h2>楄 <small>pián</small></h2>
<h3>字根本义</h3>
<p>【439 扁部】扁＝从戶从冊，象意门牌（户籍册与门户对应），本义「署门牌」；轉義四路：不圆→扁平，薄小→轻便，户户皆有→普遍，区分门户→分别排列。音源：本「冊」聲，因有别义音同「辡」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「楄部，方木也」——方木；《廣韻》「木名，食不噎」。</p>
<h3>横向对照</h3>
<p>同取扁部「门牌分户／扁平」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p取辟：木方而分。</p>
