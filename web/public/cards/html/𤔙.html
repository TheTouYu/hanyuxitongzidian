<h2><img class="cim" src="/glyphs/chars/24519.png"> <small>shuǎ</small></h2>
<h3>释义</h3>
<p>【第586部「爪部」】爪＝甲骨文象動物趾（指）爪形，西周金文在趾尖加指示符表示趾甲，《說文》「覆手曰爪」；轉義 形狀類似之物（車蓋之爪、笊籬）、抓掐搔等行為；音源為抓撓聲（指爪在肢體末梢，義音通「小」）。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：玩弄而收。</p>
