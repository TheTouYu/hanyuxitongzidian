<h2>嗤 <small>chī</small></h2>
<h3>字根本义</h3>
<p>《玉篇》「笑皃」——讥笑。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>蛇貌族③之口：以「口」定其声，蛇行可笑则嗤。</p>
<h3>横向对照</h3>
<p>同取蚩部「蛇行迟缓／蛇貌可笑」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>ch「刺持」取「刺」：笑如刺人。</p>
