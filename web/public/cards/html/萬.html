<h2>萬 <small>wàn</small></h2>
<h3>释义</h3>
<p>【第573部部首字·一級字根】象蠍子形。楷化作“萬”或“<img class="cim" src="/glyphs/chars/27363.png">”。因其尾部常呈蜷曲狀，故又名全蟲。西周金文也根據這一特點，演變為从“九”，為小篆所本，作“厹”。wàn，《說文》：“萬，蟲也。从厹，象形。無販切。”chài，《說文》：“<img class="cim" src="/glyphs/chars/27363.png">，毒蟲也。象形。，<img class="cim" src="/glyphs/chars/27363.png">或从䖵。醜芥切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wàn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
