<h2>楨 <small>zhēn</small></h2>
<h3>字根本义</h3>
<p>【509 鼎部】鼎＝象鼎形，三足兩耳、下空生火，兼具鍋與灶；《說文》「三足兩耳，和五味之寶器也」，禹收九牧之金鑄鼎，故為重器、權威、鼎立。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从木貞聲：築牆時立的木柱（《說文》「剛木也」），引申楨幹。</p>
<h3>横向对照</h3>
<p>鼎部取「重器、權威」一面，典部取「簡冊、常法」一面；形符各定落點。</p>
<h3>声母义</h3>
<p>zh取凿：木立如凿。</p>
