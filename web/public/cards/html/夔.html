<h2>夔 <small>kuí</small></h2>
<h3>字根本义</h3>
<p>【476 夒部】夒＝甲骨文象長臂猿之形（《集韻》「猱，玃猱，獼猴類。或作夒」）；音源字，取猴子的叫聲。部内「夔」另为一物：神魖如龍一足，商周青銅器玉器有其紋飾，疑即鱷魚之類，音源取雷聲。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从夒从攵：象有角、手、人面的一足神獸（神魖），音源取雷聲。</p>
<h3>横向对照</h3>
<p>同取夒部「長臂猿形、善攀附」一面：犬取獸，虫取其附。</p>
<h3>声母义</h3>
<p>k「口控」取「控」：一足而控。</p>
