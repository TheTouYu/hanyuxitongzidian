<h2>索 <small>suǒ</small></h2>
<h3>释义</h3>
<p>【第371部部首字·一級字根】甲骨文象繩索形。字有多體：或作“屮串”，或作“木串”，或作“竹串”，指用草莖、麻皮、竹篾、藤條、樹皮等搓成的繩索；故或加“又、<img class="cim" src="/glyphs/chars/20b1e.png">”，表示用手搓的意思。或作“<img class="cim" src="/glyphs/chars/20b1e.png">幺”“<img class="cim" src="/glyphs/chars/20b1e.png">糸”，指用絲線搓成。西周金文才或訛从“<img class="cim" src="/glyphs/chars/20b1e.png">素”。suǒ，《玉篇》：“糾繩為索。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 s（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
