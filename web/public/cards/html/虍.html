<h2>虍 <small></small></h2>
<h3>释义</h3>
<p>【第48部部首字·一級字根】“虍”象虎頭部分大眼與巨嘴形。整體象形字為“虎”。籀文或以其腳印來表示為，或以其血盆大口來表示為。hǔ，《玉篇》：“虎，惡獸也。”《正字通》：“ 猛獸，狀似貓，大如牛，黃質黑章，鋸牙鉤爪，有威。”</p>
<h3>声母拟态</h3>
<p>聲母義（虍部）：声母义（h·中） 辨證：因小篆字形變化較大，故《說文》：“虍，虎文也。象形。凡虍之屬皆从虍。荒烏切。（注）徐鍇曰：象其文章屈曲也。”“虎，山獸之君。从虍，虎足象人足。象形。，古文虎。，亦古文虎。呼古切。”析形皆不確。</p>
