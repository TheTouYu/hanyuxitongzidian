<h2>染 <small>rǎn</small></h2>
<h3>释义</h3>
<p>【第531部「桑部」·染系（二级字根）】染（<img class="cim" src="/glyphs/chars/23471.png">）＝从水从桑，象意以桑樹汁液作染料（《本草綱目》「煮汁染褐色，久不落」；柘桑染黃赤）；轉義染色→玷污（《廣雅》「污也」）、薰陶（《正字通》「習俗積漸曰染」）。</p>
<h3>声母拟态</h3>
<p>r「柔锐」取「柔」：染而柔。</p>
