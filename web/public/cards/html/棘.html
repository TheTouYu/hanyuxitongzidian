<h2>棘 <small>jí</small></h2>
<h3>释义</h3>
<p>【第568部部首字·一級字根】从朿的並疊。“朿”象木有刺形；並疊表示極致。象意橫向成叢的刺木。jí，《正字通》：“朿木叢生凡有刺者皆曰棘。”或專指酸棗。《說文》：“小棗叢生者。从並朿。已力切。” 《詩詁》：“棘如棗而多刺，木堅，色赤，叢生，人多以為藩。歲久無刺，亦能高大如棗。木色白者為白棘，實酸者為樲棘，亦名酸棗。”因“朿、來”形近，或訛寫作“㯤”，《集韻》：“木名，野棗酸者。江南、山東曰㯤子。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
