<h2>需 <small>xū</small></h2>
<h3>释义</h3>
<p>【第331部部首字·一級字根】甲骨文从大从或，可楷化作“汏”。“大”，指人；小點表示水滴。西周金文小點演變成“雨”；戰國古文“大”演變成“而”，遂定形為“需”。象意有二：一指將水灑在身上，即“濡”之意，此或為沐浴齋戒之狀。rú，《集韻》：“渜，沐浴餘潘。或从需。”或為巫師的洒水模擬求雨，即“儒”之意。rú，《說文》：“儒，柔也。術士之稱。”一指嬰幼兒的遺尿，即“孺”之意。rú，《說文》：“孺，乳子也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
