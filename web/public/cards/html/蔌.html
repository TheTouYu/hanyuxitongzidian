<h2>蔌 <small>sù</small></h2>
<h3>释义</h3>
<p>部頭束：从木从〇，「〇」象捆纏形，象意將散亂木柴捆在一起，〇楷化作囗（《說文》「縛也，从囗木」）。轉義：捆束、聚集、控制（《玉篇》「約束」）；事情結束。辯證：「娕、餗」所从實為「索」（艸束），故同束；「敕」所从為「柬」，形近而訛；「朿」亦與「束」訛混。音源：音源字，源自束縛聲；束縛必用繩索，故義音同「索」；又義音同「聿」。字族①捆縛收縮②聚集③結束。</p>
<h3>声母拟态</h3>
<p>心母s，「失收」取「收」。</p>
