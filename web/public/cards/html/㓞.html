<h2>㓞 <small>qià</small></h2>
<h3>释义</h3>
<p>【第570部「丯部」】丯＝「七」的上下各刻一橫，表鍥刻多道紋路（《六書故》「丯即㓞字，以丯為聲」）；音源為刻畫聲；字族 㓞（刀刻）／害（割之初文）／憲／戟。</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「亲」：刀刻而亲。</p>
