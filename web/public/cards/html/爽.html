<h2>爽 <small>shuǎng</small></h2>
<h3>释义</h3>
<p>【第530部部首字·一級字根】甲骨文象人兩手各提大的器物之形。象意有二：一表示孔武有力、豪爽。《廣韻》：“烈也。猛也。”二也可表示所提的為空的、粗疏的器物。所以器物之狀或即陶缸，或簡寫作一個×或兩個ｘ，與“希”所从同。《爾雅》：“差也。忒也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
