<h2>窜 <small>cuàn</small></h2>
<h3>字根本义</h3>
<p>【445 串部】串部余字：取「贯穿、逃匿、环绕」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>「竄」的简化字，义同：逃匿、奔逃、删改。</p>
<h3>横向对照</h3>
<p>同取串部「贯穿／逃匿」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>c取刺：窜而刺。</p>
