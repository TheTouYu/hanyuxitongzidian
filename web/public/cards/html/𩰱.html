<h2><img class="cim" src="/glyphs/chars/29c31.png"> <small>shāng</small></h2>
<h3>释义</h3>
<p>【第523部「羊部」】羊＝象有角的羊頭形，取其角為標誌符號；音源為羊叫聲。字族分六面：多而群處／有角多毛／羊鳴／羊病瘙癢／羊眼假寐／羊味烹煮。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：鬲煮而收。</p>
