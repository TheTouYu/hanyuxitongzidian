<h2>衣 <small>yī</small></h2>
<h3>释义</h3>
<p>【第177部部首字·一級字根】象有衣領的上衣之形，指古代的對襟衣，左右相包抄而成。yī，《廣韻》：“衣著。”“上曰衣，下曰裳。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yī）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
