<h2>曲 <small>qū</small></h2>
<h3>释义</h3>
<p>【第92部部首字·一級字根】甲骨文象曲尺形，即九十度直角尺。是木工常用的工具，上面的條文為刻度，一般用于在木頭上預畫直線和榫眼，以便按標準加工。“矩（jǔ）”的初文，《玉篇》：“法也，圓曰䂓，方曰矩。”</p>
<h3>声母拟态</h3>
<p>聲母義（曲部）：声母义（q·中） 辨證：由于戰國古文或訛作“匚”，小篆作，跟受物之器的“凵”混同。故《說文》：“象器曲受物之形。或說曲，蠶薄也。凡曲之屬皆从曲。，古文曲。丘玉切。”所釋不確。</p>
