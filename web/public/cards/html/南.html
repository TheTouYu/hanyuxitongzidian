<h2>南 <small>nán</small></h2>
<h3>释义</h3>
<p>【第66部部首字·一級字根】象竹節有枝形。象竹節，象竹枝。指楠竹，實為“竹”或“冉”的異體。“䈒（nán）”的初文，《玉篇》：“竹弱。”</p>
<h3>声母拟态</h3>
<p>聲母義（南部）：声母义（n·弱） 辨證：《說文》依據小篆，故以為：“南，艸木至南方，有枝任也。从<img class="cim" src="/glyphs/chars/233b5.png"><img class="cim" src="/glyphs/chars/22189.png">聲。，古文。那含切。”析形不確。</p>
