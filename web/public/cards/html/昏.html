<h2>昏 <small>hūn</small></h2>
<h3>释义</h3>
<p>【第271部部首字·一級字根】从日从氐。“氐”，即低；从“日”，指太陽落山的這段時間，即黃昏之意。hūn，《說文》：“日冥也。从日，氐省。氐者，下也。一曰民聲。呼昆切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 h（擬態「豁活」），取「豁」一面；本部未列 02z 表，按緒論推。</p>
