<h2>雙 <small>shuāng</small></h2>
<h3>释义</h3>
<p>【第506部部首字·一級字根】甲骨文从隹从再。“隹”，指鳥；“再”，指兩、重。象意鳥的交尾，表示配偶。shuāng，《集韻》：“相偶也。”“隹”或作“雔”，“雔”也是配偶之意。戰國古文“再”演變作“又”。故《說文》：“隹二枚也。从雔，又持之。所江切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
