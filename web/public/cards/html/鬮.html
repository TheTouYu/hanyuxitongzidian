<h2>鬮 <small>jiū</small></h2>
<h3>释义</h3>
<p>【第540部「秋部」】秋＝甲骨文象蟋蟀形（促織／紡織娘），入秋入户鳴聲促織；借以代表秋季，另造从禾从炅之「秋」（禾穀成熟，《說文》「禾穀孰也」）；轉義焦枯、光秃、悲愁、時節、聚束、飛騰。</p>
<h3>声母拟态</h3>
<p>j取聚决：取聚而决。</p>
