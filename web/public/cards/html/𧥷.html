<h2><img class="cim" src="/glyphs/chars/27977.png">（訖<img class="cim" src="/glyphs/chars/27aa2.png">） <small>qì</small></h2>
<h3>本义</h3>
<p>《說文》「止也。从言气聲。居迄切。」言辭終止。《玉篇》：「畢也。」</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「缺」：話已說盡，言辭缺而止。</p>
