<h2>爣 <small>tǎng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·黨系（二级字根）】黨（党）＝从黑尚聲：「黑」為墨色不鮮，「尚」為敞開；本義色暗不鮮（《說文》「不鮮也」）；轉義同色相聚→朋黨、黨與，又借為「儻」表或然。字族三面：色暗不明／朋群相合／直而不隱。</p>
<h3>声母拟态</h3>
<p>t取涂突：火光而突。</p>
