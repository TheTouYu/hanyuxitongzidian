<h2>辟 <small>bì</small></h2>
<h3>释义</h3>
<p>【第152部部首字·一級字根】“璧”的商代甲骨文本从〇从辛（或省），〇為璧的象形。西周後才从玉辟聲。璧，《說文》：“瑞玉圜也。”古代一種平圓形的玉，中間有孔。一般是王公貴族用作祭祀、朝聘、喪葬時的禮器。“辛”即憑信之意。則“辟”實際上是从卩璧聲，象意持璧跪跽的人。bì，《廣韻》：“君也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
