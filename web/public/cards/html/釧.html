<h2>釧 <small>chuàn</small></h2>
<h3>字根本义</h3>
<p>【461 川部→462 鮮部】川支取「贯穿、顺流」诸面；462 鮮部＝从魚从羴省，鲜鱼之味，引申新鲜、鲜明、少。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「釧，臂環也」——手镯，取贯穿腕上。</p>
<h3>横向对照</h3>
<p>同取川／鮮支「贯穿、鲜少」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>ch「刺持」取「持」：环贯而持。</p>
