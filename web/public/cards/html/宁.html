<h2>宁 <small>zhù</small></h2>
<h3>释义</h3>
<p>【第64部部首字·一級字根】象一塊苧麻織成的布幅形。因其纖維較粗，故布幅的兩頭露出經線。實為“紵（zhù）”的初文，《說文》：“檾屬。細者為絟，粗者爲紵。从糸宁聲。，紵或从緒省。直呂切。”</p>
<h3>声母拟态</h3>
<p>聲母義（宁部）：声母义（zh·中） 辨證：《說文》：“辨積物也。象形。凡宁之屬皆从宁。直呂切。”所釋乃引申義，析形則不確。</p>
