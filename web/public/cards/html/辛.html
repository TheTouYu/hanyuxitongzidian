<h2>辛 <small>xīn</small></h2>
<h3>释义</h3>
<p>【第556部部首字·一級字根】象小刻刀形。上為柄，下為刃，中間凸出的為護手。郭沫若《甲骨文字研究》：“辛、䇂實本一字……字乃象形，由其形象以判之，當係古之剞<img class="cim" src="/glyphs/chars/2073e.png">。《説文》云：‘剞<img class="cim" src="/glyphs/chars/2073e.png">，曲刀也’。”殷墟婦好墓中就出土了許多玉刻刀。它們有龍、虎、魚、鳥、蛙、龜等多種形狀，最長的也不足八釐米。這麼小的刀，顯然只能用于刻字、紋身等。商人崇尚紋身，故或在上面加一橫為“上”，表示上天所賜予之意。實為“王”的倒寫。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
