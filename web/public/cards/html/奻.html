<h2>奻 <small>nuán</small></h2>
<h3>释义</h3>
<p>【第280部部首字·一級字根】从女的二疊或三疊。“女”，指女子；疊體，或表示多；或表示極致。女子相對而言，愛說話些；多個女子在一起，會嘰嘰喳喳說過不停。从而象意爭吵、喧鬧。nuán，《說文》：“奻，訟也。从二女。女還切。”《集韻》：“諠訟也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 n（擬態「纳弄」），取「弄」一面；本部未列 02z 表，按緒論推。</p>
