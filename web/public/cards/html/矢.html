<h2>矢 <small></small></h2>
<h3>释义</h3>
<p>【第16部部首字·一級字根】象箭形。shǐ，《玉篇》：“箭也。古者牟夷作矢。”</p>
<h3>声母拟态</h3>
<p>聲母義（矢部）：声母义（sh·中） 辨證：字本箭的完整象形，包括箭鏃、箭杆、箭羽、箭栝。《說文》：“弓弩矢也。从入，象鏑、栝、羽之形。古者夷牟初作矢。凡矢之屬皆从矢。式視切。”“入”指的本是箭栝，是箭的一部分。故析形不確。</p>
