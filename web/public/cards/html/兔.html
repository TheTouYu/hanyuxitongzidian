<h2>兔 <small>tù</small></h2>
<h3>释义</h3>
<p>【第205部部首字·一級字根】象長耳兔子形。tù，《說文》：“獸名，象兔踞，後其尾形。兔頭與㲋頭同。凡兔之屬皆从兔。湯故切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
