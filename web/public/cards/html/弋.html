<h2>弋 <small></small></h2>
<h3>释义</h3>
<p>【第26部部首字·一級字根】象拴有線繩，前端有倒刺的箭形。甲骨文下部鼓出的部分為繞線的繳；金文用一橫代替，从而演變成今天的字形。yì，《玉篇》：“繳射也。”《宋兆麟·戰國弋射圖及弋射溯源》：“弋射之矢，箭頭有倒刺，箭鋌中有孔槽，前者防獵物逃脫，後者適於繫繩。”這種箭的作用在于利用繩子在空中纏束住鳥的翅膀而可以將其活捉；所以，往往會形成人牽著飛鳥的奇觀，據稱風箏就是模仿此而發明出來的。名之為“紙鳶”。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第26部），無擬態聲母義可系，義靠義類與字形。</p>
