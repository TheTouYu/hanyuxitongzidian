<h2>㐁 <small>tiàn</small></h2>
<h3>释义</h3>
<p>【第374部部首字·一級字根】甲骨文象一塊有斜紋的編織品形，指席子。tiàn，《廣雅》：“席也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
