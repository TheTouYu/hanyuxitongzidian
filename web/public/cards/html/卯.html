<h2>卯 <small>mǎo</small></h2>
<h3>释义</h3>
<p>【第99部部首字·一級字根】甲骨文象空心而表面長有凸起物的樹榦形。“柳（liǔ）”的初文，《玉篇》：“小楊也。”</p>
<h3>声母拟态</h3>
<p>聲母義（卯部）：声母义（m·弱） 辨證：由于“卯”跟“<img class="cim" src="/glyphs/chars/20a0d.png">”字形相近，本屬于“<img class="cim" src="/glyphs/chars/20a0d.png">”的字如“卿”，訛寫成“卯”。實質上，“<img class="cim" src="/glyphs/chars/20a0d.png">”的甲骨文為，象兩人相對之形，跟“卯”沒有任何關係。</p>
