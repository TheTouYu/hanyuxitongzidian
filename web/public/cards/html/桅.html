<h2>桅 <small>wéi</small></h2>
<h3>字根本义</h3>
<p>【474 危部】危＝甲骨文从从回（回亦聲），象一種古老禮器「<img class="cim" src="/glyphs/chars/22f28.png">」之形；从「回」，指其翻覆後可自動回位；轉義為傾倒、不正、不安。音源本「回」聲（字形變後聲旁失），古「危」「鬼」通用。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从木危聲：船上高竿，取危之高；又與「危」通。</p>
<h3>横向对照</h3>
<p>同取危部「高而傾側」一面：木取高、足取屈、言取反側。</p>
<h3>声母义</h3>
<p>w取末：竿高而危。</p>
