<h2>娙 <small>xíng</small></h2>
<h3>释义</h3>
<p>【第176部「壬部」·巠（坙）系】坙＝从巛从壬，象經線繃直、織機上縱線；《說文》「水脈」之析不確。字族取「縱直、修長、經行」一面；娙為「<img class="cim" src="/glyphs/chars/21707.png">」之或体（㓝族一見），本屬此部。</p>
<h3>声母拟态</h3>
<p>x取续消：女長而續。</p>
