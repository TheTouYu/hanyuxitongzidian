<h2>申 <small>shēn</small></h2>
<h3>释义</h3>
<p>【第114部部首字·一級字根】象閃電之形，指閃電。“電（diàn）”的初文，《玉篇》：“隂陽激耀也。”</p>
<h3>声母拟态</h3>
<p>聲母義（申部）：声母义（sh·强） 辨證：由于戰國古文訛成雙手拉丨形，小篆承之。故《說文》解為：“神也。七月，陰氣成，體自申束。从<img class="cim" src="/glyphs/chars/26951.png">，自持也。吏臣餔時聽事，申旦政也。凡申之屬皆从申。，古文申。，籀文申。失人切。”析形不確。不過，《說文》在解“<img class="cim" src="/glyphs/chars/2732b.png">”字時，認為：“申，電也。”釋義是正確</p>
