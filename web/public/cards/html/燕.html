<h2>燕 <small>yàn</small></h2>
<h3>释义</h3>
<p>【第319部部首字·一級字根】象燕子形。yàn，《說文》：“玄鳥也。籋口，布翄，枝尾。象形。凡燕之屬皆从燕。于甸切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yàn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
