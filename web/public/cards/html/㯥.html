<h2>㯥 <small>cáo</small></h2>
<h3>释义</h3>
<p>【第95部部首字·一級字根】从“東”的二疊。“東”指木鼓；二疊，表示極致。可象意有二：木鼓本是挖空木頭而成，二疊，指其大，表示鏤空的大木頭。實即“槽（cáo）”字初文，《說文》：“畜獸之食器。”《玉篇》：“馬槽。”</p>
<h3>声母拟态</h3>
<p>聲母義（㯥部）：声母义（c·强） 辨證：由于《說文》誤釋“東”為：“動也。从木。官溥說：从日在木中。”未理解其字源義，故對“㯥”的音義沒有作出解釋：“㯥，二東，曹从此。闕。祖叨反。（注）臣鍇按：《說文》舊本無音，今《字書》音云闕者，無聞焉爾。”只是指出“<img class="cim" src="/glyphs/chars/23358.png">”就是“曹”。其實甲骨文</p>
