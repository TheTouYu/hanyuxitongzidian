<h2><img class="cim" src="/glyphs/chars/254ad.png"> <small>chù</small></h2>
<h3>字根本义</h3>
<p>【407 足部】部首足（<img class="cim" src="/glyphs/chars/20bc1.png"><img class="cim" src="/glyphs/chars/24d15.png">zú）：甲骨文象人的整条腿形（大腿、脚、掌、趾），后腿脚部分写作「口」形（《说文》「人之足也，在下，从止口」）。轉義：足起支撑基础→器物的脚、植物根茎、事物基础；足小而承重→足够满足增益；两足等长并拢→等齐、迫促。音源：足踏声。字族衍义：①两足距离→迫促急促 ②两足长度→齐整相等 ③足的大小→小 ④与足相关的行为。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「音矗，小石」——小石。</p>
<h3>横向对照</h3>
<p>小族③之石：以「石」定其质，石小如粒。</p>
<h3>声母义</h3>
<p>ch「刺持」取「持」：石持于地。</p>
