<h2>惟 <small>wéi</small></h2>
<h3>字根本义</h3>
<p>【511 心部】心＝象心臟形，本義心臟；轉義心思、感情、中心。部內从心諸字皆以心為義符，聲符給具體情狀，故同一心理而有喜怒哀懼之別。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从心隹聲：思考（《說文》「凡思也」），借為僅、但是。</p>
<h3>横向对照</h3>
<p>同以心為義符，聲符各給一情：之定向、中守正、己拒斥、刃堪忍。</p>
<h3>声母义</h3>
<p>w?零聲母。</p>
