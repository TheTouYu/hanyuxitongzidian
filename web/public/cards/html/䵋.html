<h2>䵋 <small>wěi</small></h2>
<h3>字根本义</h3>
<p>【463 又部】又＝象手腕以下的指掌，本义为手（《说文》「手也。象形。三指者，手之列多略不過三也」）；音源搓手声；转为重复、继续之虚词（《广韵》「又，猶更也」）；字族衍义「指动如手」。</p>
<h3>字形</h3>
<p>字形：古文字字形库已收「又」部头字形，本卡从略。</p>
<h3>形旁声旁</h3>
<p>从黄有声——《说文》「靑黃色也」，青黄色（手掌肉色之引申）。</p>
<h3>横向对照</h3>
<p>同取又部「手之动作、持物」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>w「蒙末」取「末」：色暗而末。</p>
