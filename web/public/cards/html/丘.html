<h2>丘 <small>qiū</small></h2>
<h3>释义</h3>
<p>【第50部部首字·一級字根】象兩山相夾形。或指山丘。戰國古文或加“土”，或加“丌”，指土堆或小山包。qiū，《廣韻》：“丘陵。”或指兩山之間的谷地。《集韻》：“空也。”</p>
<h3>声母拟态</h3>
<p>聲母義（丘部）：声母义（q·中） 辨證：由于春秋金文以後，兩邊的山形演變作“北”形，小篆承之，故《說文》：“土之高也，非人所為也。从北，从一。一，地也，人居在丘南，故从北。中邦之居，在昆侖東南。一曰四方高中央下為丘，象形。，古文，从土。去鳩切。”析形不確。</p>
