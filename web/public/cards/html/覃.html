<h2>覃 <small>tán</small></h2>
<h3>释义</h3>
<p>【第179部部首字·一級字根】甲骨文本像尖底大口的瓶形，其形制大抵跟“酉”近似，只是“酉”的形制要小，口不大。金文添加“鹵”，當指用這種罐子將鹵水熬制成鹽。跟用釀酒的“酉”表示“酒”的方式相同，實為“鹽（yán）”的初文，《說文》：“鹹也。从鹵監聲。古者，宿沙初作煑海鹽。凡鹽之屬皆从鹽。”“監”，指水鑒，鹵水在罐中如水鑒一般。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
