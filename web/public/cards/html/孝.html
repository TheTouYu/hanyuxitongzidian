<h2>孝 <small>xiào</small></h2>
<h3>释义</h3>
<p>【第544部「老部」】老＝甲骨文象人長髮拄杖之形，七十曰老（《說文》「考也，七十曰老」）；轉義年長、衰暮、久舊；音源借音（老、考同源互通）。</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：事亲而續。</p>
