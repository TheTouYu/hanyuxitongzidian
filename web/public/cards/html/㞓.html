<h2>㞓 <small>qì</small></h2>
<h3>释义</h3>
<p>㞓qì《說文》：“尻也。从尸旨聲。詰利切。”臀部。肉質最厚實的部位。《廣韻》：“身欹坐。”身體斜坐。jī，《漢典》：“男性外生殖器。”</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「缺」：臀部肉厚而中凹成溝（推）。</p>
