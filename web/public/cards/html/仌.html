<h2>仌 <small>bīng</small></h2>
<h3>释义</h3>
<p>【第196部部首字·一級字根】甲骨文為＾的二疊。“＾”即“冬”，象冰凌形；二疊，表示極致。象意冬季冰封的樣子。bīng，《說文》：“仌，凍也。象水凝之形。凡仌之屬皆从仌。筆陵切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
