<h2>肁 <small>zhào</small></h2>
<h3>字根本义</h3>
<p>【427 聿部·肁】肁＝从戶从聿，聿指拿开顶门的竹杠，象开门，故为「始开」；转义开端、初始。《说文》「始开也」。辨证：肁之初文本当为「启」（从户从口）；「肈」甲骨文从戈从户，象破门攻打，故又引申开始、谋划。音源：本聿声，因有开始义而义音同「兆」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从户从聿，以竹杠开门——始开；引申开端、初始。</p>
<h3>横向对照</h3>
<p>同取本部「竹竿／持械触物」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>zh「凿总」取「凿」：凿门而开。</p>
