<h2>釵 <small>chāi</small></h2>
<h3>释义</h3>
<p>【第586部「爪部」·叉支】叉＝商代金文从又的拇指與食指中間加一點，象虎口；《說文》「手指相錯也」；轉義 張開岔開的物體（首笄曰叉→釵；樹幹歧枝）、叉取；辯證《說文》「手指相錯」應是兩手，與字形不符，交錯之意應引申自以叉取物（《段注》「凡布指錯物閒而取之曰叉」）；音源為叉物時所發之聲。</p>
<h3>声母拟态</h3>
<p>ch取刺持：笄歧而持。</p>
