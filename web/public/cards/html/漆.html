<h2>漆 <small>qī</small></h2>
<h3>释义</h3>
<p>【第567部「七部」】七＝从一加指示符（切、刻之初文）；字族二义：甲（甲胄、硬殼，穿甲状之逼窄）／桼（割樹取汁，漆之初文；與朱同源）／皂（橡實之房，黑色）。</p>
<h3>声母拟态</h3>
<p>q取亲缺：水黏而亲。</p>
