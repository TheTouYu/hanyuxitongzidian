<h2>俜 <small>pīng</small></h2>
<h3>字根本义</h3>
<p>【434－435部】番支余字取「繁生」一面；甹（pīng）＝从丂（脖颈）从西（鸟窝），象鸟在巢边伸长脖子自在鸣叫，「聘」之初文。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「使也，从人甹声」——放任、任侠。</p>
<h3>横向对照</h3>
<p>同取本部「翻生／鸟鸣放任」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p取辟：放而分。</p>
