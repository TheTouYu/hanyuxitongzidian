<h2>柰（奈） <small>nài</small></h2>
<h3>本义</h3>
<p>柰，nài：从木从示，本义为堆柴于「示」（神主）前燎祭（原稿：「奈本義為堆柴於示前燎祭」）。转义：由堆柴引申为柰树与「忍得住」（奈何）。</p>
<h3>辩证</h3>
<p>《廣雅》以石榴釋柰，非其本義。</p>
<h3>音源</h3>
<p>音源：「示」为音源字，义音同「氏」。</p>
<h3>声母拟态</h3>
<p>n「纳弄」取「纳」：柴纳于示前而燎（推）。</p>
<h3>字族衍义</h3>
<p><b>堆柴爎祭，表短而密集</b></p>
