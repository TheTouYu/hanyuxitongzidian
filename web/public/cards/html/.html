<h2> <small>yíng</small></h2>
<h3>释义</h3>
<p>【第554部部首字·一級字根】甲骨文从宀內有火。“宀”指屋子；从“火”，指燈燭之火。因為屋內的火當然不能很大，不然會引起火災的。西周金文徑作兩交叉的火炬形。戰國古文或沿襲甲骨文；或沿襲西周金文，在屋上面加上兩火，小篆从之。yíng，《說文》：“屋下燈燭之光。从焱冂。戶扃切。”《集韻》：“火光。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yíng）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
