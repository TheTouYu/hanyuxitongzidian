<h2>戌 <small>xū</small></h2>
<h3>释义</h3>
<p>【第185部部首字·一級字根】象寬刃長柄的兵器形。形制大抵跟戉差不多；但戉只是權力的象徵，比較輕薄；而戌則是實戰性武器，比較厚重，刃較平，跟板斧差不多。xū，《篆隸萬象名義》：“斧。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
