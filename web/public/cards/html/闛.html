<h2>闛 <small>táng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·堂系（二级字根）】堂＝从土尚聲，用土築成的高臺、空闊殿堂；字族三面：堂之空（顯明空闊）／堂之高（撐起抵距）／堂之聲（鼓鐘之聲）。</p>
<h3>声母拟态</h3>
<p>t取涂突：門盛而突。</p>
