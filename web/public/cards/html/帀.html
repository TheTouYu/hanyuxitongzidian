<h2>帀 <small>zā</small></h2>
<h3>释义</h3>
<p>【第77部部首字·一級字根】甲骨文為倒（生）形。指艸木的因生長茂盛而枝葉倒垂之狀。</p>
<h3>声母拟态</h3>
<p>聲母義（帀部）：声母义（z·强） 辨證：《說文》依據小篆，釋為：“<img class="cim" src="/glyphs/chars/208d8.png">（周）也。从反之而帀也。凡帀之屬皆从帀。周盛說。子荅切。”“反之”之意本有“夂”字，林義光《文源》即認為“反之無周帀之意。”而以其“三面各集于一也。”但“周帀”之意是指四圍，“三面”並不能體現。故析形皆不確。</p>
