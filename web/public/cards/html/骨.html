<h2>骨 <small>gǔ</small></h2>
<h3>释义</h3>
<p>冎象三節相連之腿骨，為骨之初文；骨从冎有肉，《說文》「肉之覈也」。</p>
<h3>声母拟态</h3>
<p>見母 g，「隔估」取「隔」：骨節相隔相扣。</p>
