<h2><img class="cim" src="/glyphs/chars/292c4.png"> <small>chǒu</small></h2>
<h3>释义</h3>
<p>取部部头从耳从又，象手取耳而获；「<img class="cim" src="/glyphs/chars/292c4.png">」由「取」之聚义一面分张。</p>
<h3>声母拟态</h3>
<p>韦束即收聚，取「束而聚」一面。</p>
