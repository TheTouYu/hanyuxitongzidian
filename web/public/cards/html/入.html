<h2>入 <small>rù</small></h2>
<h3>释义</h3>
<p>【第338部部首字·一級字根】象箭尾形。以局部象事，箭只剩尾部，表示射進之意。rù，《玉篇》：“進也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 r（擬態「柔锐」），取「锐」一面。</p>
