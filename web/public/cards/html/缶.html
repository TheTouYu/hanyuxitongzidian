<h2>缶 <small>fǒu</small></h2>
<h3>释义</h3>
<p>【第255部部首字·一級字根】从口从午。“午”指杵；从“口”，象意可以搗杵的器皿。應有別于臼，而是指擂缽之類，較厚，用以舂香料、藥材，榨取果汁、肉汁等物；秦人或以其作為打擊樂器。fǒu，《廣韻》：“瓦器。鉢也。《史記》云‘秦王趙王會于澠池，藺相如使秦王擊缶’是也。”《玉篇》：“盎也。《詩》曰：‘坎其擊缶’。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 fǒu；未列 02z，按緒論取一面未判（02z 未收）。</p>
