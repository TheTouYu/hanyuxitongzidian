<h2>枉 <small>wǎng</small></h2>
<h3>释义</h3>
<p>【第517部「王部」·王支】王＝甲骨文象闊刃短柄的玉斧，代表無上權力，引申首領、君主；轉義大、盛；辯證《說文》「三畫連中」不確；音源借「黃」。字族多以「㞷」為聲，指歸往，表急、多、亂。</p>
<h3>声母拟态</h3>
<p>w取往：木往而曲。</p>
