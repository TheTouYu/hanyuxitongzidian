<h2>蜀 <small>shǔ</small></h2>
<h3>释义</h3>
<p>【第233部部首字·一級字根】甲骨文本从目从回。“目”指其為動物；“回”指其身軀條形蜷縮，象意爬蟲。或作，象蟲身有毛形。金文加“虫”，遂演變成今天的字形。本指毛毛蟲，即蛾蝶之類的幼蟲。shǔ，《說文》：“葵中蠶也。从虫，上目象蜀頭形，中象其身蜎蜎。《詩》曰：‘蜎蜎者蜀。’市玉切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
