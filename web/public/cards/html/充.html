<h2>充 <small>chōng</small></h2>
<h3>释义</h3>
<p>部頭充（<img class="cim" src="/glyphs/chars/2047d.png"><img class="cim" src="/glyphs/chars/2063a.png">）：从<img class="cim" src="/glyphs/chars/20ad3.png">从儿——<img class="cim" src="/glyphs/chars/20ad3.png">本「子」的倒寫，人上有倒子，實即「允」字；讓人騎在肩上，一般也是帶孩子出行時才這樣（《玉篇》「行也」）。轉義：人上肩人→長、高（《說文》「長也，高也」）；充滿、富足、填塞、完備（《玉篇》「美也、塞也、滿也」，《小爾雅》「備也」）；借別人顯得高→假冒（冒充、充當）。辯證：漢印及金文「允」上从「」，與「冕」所从同，當指冠冕，為「珫」之初文——冠冕兩側當耳之玉（亦稱瑱，《詩》「充耳琇瑩」）。故充之高、晃蕩、填塞諸義或本屬珫。字族：①高（統）②填塞（銃、<img class="cim" src="/glyphs/chars/212bf.png">、<img class="cim" src="/glyphs/chars/2a3bd.png">）。</p>
<h3>声母拟态</h3>
<p>昌母ch，「刺持」取「刺」：氣充而上刺。</p>
