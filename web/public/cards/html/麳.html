<h2>麳 <small>lái</small></h2>
<h3>释义</h3>
<p>【第576部「來部」·麥支】麥＝从來从夊（倒止），秋種夏熟之芒穀；字族取「麥實、麥皮、麥屑、煮麥」諸面。</p>
<h3>声母拟态</h3>
<p>l「拢离」取「离」：麥穗而离。</p>
