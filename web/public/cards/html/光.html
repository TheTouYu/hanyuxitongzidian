<h2>光 <small>guāng</small></h2>
<h3>释义</h3>
<p>【第519部部首字·一級字根】从火在卩上。“卩”為跪著的人形；从“火”在頭上，象意人借助于火的照明以看見事物。guāng，《說文》：“明也。从火在人上，光明意也。，古文。，古文。古皇切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 g（擬態「隔估」），取「隔」一面；本部未列 02z 表，按緒論推。</p>
