<h2>㗆 <small>gé</small></h2>
<h3>字根本义</h3>
<p>【421 革部】革＝甲骨文象剖剥摊开的整张兽皮，引申去毛、更改、革除、急；又指皮制品、老迈、翅膀。音源：借音字，由兵革防御之义而义音同「戒」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「㗆噊，鸟鸣也」——或作嗝，又作助词「的」。</p>
<h3>横向对照</h3>
<p>同取革部「皮革绷张／雨濡虚起」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>g「隔估」取「隔」：声隔而鸣。</p>
