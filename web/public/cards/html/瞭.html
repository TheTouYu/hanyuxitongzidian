<h2>瞭 <small>liǎo</small></h2>
<h3>释义</h3>
<p>【第552部「尞部」】尞＝从木从火，架柴而燒（《說文》「柴祭天也」），燎之初文；字族取「燃燒所生之光、遠、明、纏」諸面。</p>
<h3>声母拟态</h3>
<p>l取拢离：目明而離。</p>
