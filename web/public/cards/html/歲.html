<h2>歲 <small>suì</small></h2>
<h3>释义</h3>
<p>【第213部部首字·一級字根】象有著長柄的石鐮刀之形。上有兩點，為系鐮于柄上時所用的孔。“劌（guì）”之初文，《廣韻》：“傷也。割也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 s（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
