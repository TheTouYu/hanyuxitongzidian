<h2>敕 <small>chì</small></h2>
<h3>释义</h3>
<p>束部（第372部）部头从木从〇，〇象绳缠，捆散木使聚，《說文》「縛也，書玉切」；轉義捆束、聚集、控制与事情结束；音源字，源自束縛声，义音同「索」。</p>
<h3>声母拟态</h3>
<p>告誡者以言约束之，正取「收」；攴旁定其动作。</p>
