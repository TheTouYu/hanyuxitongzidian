<h2>朿 <small>cì</small></h2>
<h3>释义</h3>
<p>【第18部部首字·一級字根】“朿”最初是象事字，在“矢”上加“一”，表示為箭頭部分；箭頭部分十分尖利，故借指木刺。後“一”演化成箭頭狀，象尖刺形；“矢”則或演化作“木”形；“一”或演化作表示集束性符號的，表示有許多數不清的小刺。cì，《說文》：“木芒也。象形。凡朿之屬皆 从朿。讀若刺。七賜切。（注）徐鍇曰：草木之朿。茦、莿二文，義音同。”</p>
<h3>声母拟态</h3>
<p>聲母義（朿部）：声母义（c·强）</p>
