<h2>炙 <small>zhì</small></h2>
<h3>释义</h3>
<p>【第47部部首字·一級字根】从肉从火，象意用火燒烤肉。zhì，《說文》：“炮肉也。从肉在火上。凡炙之屬皆从炙。，籀文。之石切。”</p>
<h3>声母拟态</h3>
<p>聲母義（炙部）：声母义（zh·强）</p>
