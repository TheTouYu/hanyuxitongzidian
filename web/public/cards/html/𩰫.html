<h2><img class="cim" src="/glyphs/chars/29c2b.png"> <small>guō / wāi</small></h2>
<h3>释义</h3>
<p>【第351部部首字·一級字根】甲骨文从鬲上有斜口形。象意側邊開口的鬲器。鬲是開口朝上的陶器，下有足可以燒火；因此，<img class="cim" src="/glyphs/chars/29c2b.png">應該也是可以燒的，當是陶爐與釜的組合。周金文就寫如盧（爐）身與酉的上部組合，旁或添加“口”。guō，《玉篇》：“秦名土釜曰<img class="cim" src="/glyphs/chars/29c2b.png">。亦作<img class="cim" src="/glyphs/chars/29c2c.png">。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 g（擬態「隔估」），取「隔」一面；本部未列 02z 表，按緒論推。</p>
