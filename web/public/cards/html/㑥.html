<h2>㑥 <small>yì</small></h2>
<h3>释义</h3>
<p>部頭裼（xì）：甲骨文从又从衣，象意脫衣露體，是「裼」的初文（《說文》「裼，袒也」，《玉篇》「脫衣見體也」）。轉義：袒露→繈褓（緥）；赤身露體之北方部族→狄；借音，義音同「易」。字族衍義：多指改換、轉變。</p>
<h3>声母拟态</h3>
<p>喻母y，不系。</p>
