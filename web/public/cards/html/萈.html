<h2>萈 <small>huán</small></h2>
<h3>字根本义</h3>
<p>【444 雈部】萈支雈聲字：取鹭之宽阔、曲颈、水草诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「山羊細角者，从兔足，萈聲」——細角山羊（原稿字形析为萈声）。</p>
<h3>横向对照</h3>
<p>同取雈部「宽阔／曲颈」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>h取活：羊角而活。</p>
