<h2>牆 <small>qiáng</small></h2>
<h3>释义</h3>
<p>【第592部「冬部」·㐭（嗇）族】㐭＝象禾稭堆積入倉之形（《說文》「穀所振入」），嗇＝从㐭从來（收禾吝惜）；轉義 吝嗇、愛惜；音源同冬。此族取「收倉、牆蔽、懸挂」三面。</p>
<h3>声母拟态</h3>
<p>q取亲缺：垣隔而缺。</p>
