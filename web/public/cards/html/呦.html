<h2>呦 <small>yōu</small></h2>
<h3>释义</h3>
<p>【第587部「幺部」】幺＝象蠶剛吐出的絲形（蠶吐絲時頭部左右搖擺，絲呈兩股相交）；轉義 細小、幼、後（排行最小，《字彙》「豕之最後生者為幺」）；辯證《說文》「象子初生之形」與字形不符；音源借音，義音同「交」（幺、交古通）。</p>
<h3>声母拟态</h3>
<p>y取续消：鳴而续。</p>
