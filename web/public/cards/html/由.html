<h2>由 <small>yóu</small></h2>
<h3>释义</h3>
<p>【第257部部首字·一級字根】从从（口）。，象滴狀物，指油滴；“口”指嘴，象意油滴入口之形，指動植物的油脂。 “油（yóu）”的初文，《集韻》：“膏也。”《玉篇》：“麻子汁也。”《廣韻》：“油脂。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yóu）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
