<h2>候 <small>hòu</small></h2>
<h3>字根本义</h3>
<p>【477 侯部】侯＝甲骨文从厂从矢（厂指石，矢指箭），象用石塊製成的箭鏃，是「鍭」的初文；由箭鏃為箭之核心，引申君主、尊稱、美。音源借「猴」為聲——成年獼猴有頰囊，鼓如箭鏃。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从人侯聲：伺望、等候；引申時候、氣候、徵候。</p>
<h3>横向对照</h3>
<p>同取侯部「箭鏃居中、頰囊鼓起」两面：口取要道，人取伺望，土取標記，金取本義。</p>
<h3>声母义</h3>
<p>h取豁：伺望而豁。</p>
