<h3>释义</h3>
<p>【第527部「向部」】向＝从宀从口（屋与窗），本義窗；轉義窗所朝→方向、相向；音源借音（向陽有光）。字族分向系／尚系／堂系／當系／黨系／掌系六組。</p>
