<h2>邐 <small>lǐ</small></h2>
<h3>释义</h3>
<p>【第580部「麗部」】麗＝象無杈角之鹿（麂），引申配偶、附著、美麗；字族多从麗聲，取「附麗、離散、華美」諸面。</p>
<h3>声母拟态</h3>
<p>l「拢离」取「离」：路曲而离。</p>
