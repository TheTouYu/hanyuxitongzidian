<h2>段 <small>duàn</small></h2>
<h3>释义</h3>
<p>【第244部部首字·一級字根】从石从殳。“殳”，指錘子。从“石”，象意以石為砧，在上面敲打別的物體。duàn，《集韻》：“《說文》：‘椎物也。’亦姓。古作<img class="cim" src="/glyphs/chars/20a7b.png">。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 d（擬態「囤动」），取「动」一面；本部未列 02z 表，按緒論推。</p>
