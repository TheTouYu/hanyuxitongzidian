<h2>獺 <small>tǎ</small></h2>
<h3>释义</h3>
<p>【第574部「剌部」·賴支】賴＝从貝剌聲，贏也（《說文》），依靠、利益；其字族多从賴聲，取「依附、毀壞、怠惰」諸面。</p>
<h3>声母拟态</h3>
<p>t「涂突」取「突」：獸突而噬。</p>
