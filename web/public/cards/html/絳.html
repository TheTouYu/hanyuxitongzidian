<h2>絳 <small>jiàng</small></h2>
<h3>字根本义</h3>
<p>【501 夅部】夅＝从夂从午（丰），象二人相承而不敢並行，本義降服、順服（《說文》「服也」）；轉義下降、貶抑。部內从夅諸字取「下降、相承」兩面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从糸夅聲：大紅之色，取夅之聲。</p>
<h3>横向对照</h3>
<p>夅部取「下降相承」一面，<img class="cim" src="/glyphs/chars/20b1e.png">部取「兩手捧持共舉」一面；形符各定落點。</p>
<h3>声母义</h3>
<p>j取聚决：染聚而深。</p>
