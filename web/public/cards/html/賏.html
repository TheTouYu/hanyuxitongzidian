<h2>賏 <small>yīng</small></h2>
<h3>释义</h3>
<p>【第195部部首字·一級字根】商代金文从兩貝相連形。象意串聯的貝殼。貝串在古代主要有兩個作用。一作裝飾：yīng，《說文》：“賏，頸飾也。从二貝。烏莖切。”《正字通》：“ 聯小貝為頸飾也。亦作瓔。”跟現在的項鏈差不多。一作貨幣使用。此義分化作“朋（péng）”，《廣韻》：“五貝曰朋。”為了區別，加上了人形，後來演化作“嬰（yīng）”，《說文》：“頸飾也。从女、賏。賏，其連也。”因此，其衍生字族多从“嬰”。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yīng）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
