<h2><img class="cim" src="/glyphs/chars/22636.png"> <small>tuì</small></h2>
<h3>字根本义</h3>
<p>【433 肆部】肆＝从金从隶（隶亦声），本指编钟一虡二十六枚之「銉」（《周礼》「全为銉」），引申穷极、陈列、恣意。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「肆也、忘也、忽也」——放肆无拘、遗忘、舒缓、惆怅。</p>
<h3>横向对照</h3>
<p>同取本部「附著／陈列」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>t「涂突」取「突」：放纵而突。</p>
