<h2>巿 <small>fú</small></h2>
<h3>释义</h3>
<p>【第159部部首字·一級字根】从巾上加一橫。“巾”，指布帛；上加一橫，表示腰帶，指蔽膝，跟現在的圍腰近似。fú，《說文》：“韠也。上古衣蔽前而已，巿以象之。天子朱巿，諸矦赤巿，大夫蔥衡。从巾，象連帶之形。凡巿之屬皆从巿。，篆文巿从韋从犮。分勿切。（注）臣鉉等曰：今俗作紱，非是。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
