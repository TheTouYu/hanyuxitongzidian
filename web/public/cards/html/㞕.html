<h2>㞕 <small>xiè</small></h2>
<h3>释义</h3>
<p>部頭㞕（屑）：西周金文从尸从夕，「尸」象人蹲踞，「夕」指夜晚——象意人在夜晚摸黑探索、緩緩行進之狀（《廣韻》「動進皃」）。另解：依小篆从「䏌」，則實同「佾」——一種集體舞蹈（《月令章句》「天子八佾，諸侯六佾，大夫四佾，佾，列也，每佾八人」），人眾列齊，動作難以施展，與夜行摸索同理。轉義：由黑夜小心行進→細小、瑣碎、恭敬、辛勞（《玉篇》「絜也、碎也、勞也、敬也」）、不得已、偷偷摸摸（《方言》「獪也」）。字族衍義：多指細小。</p>
<h3>声母拟态</h3>
<p>心母x，「失收」取「失」：暗中摸索而失。</p>
