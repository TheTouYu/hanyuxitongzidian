<h2>愫 <small>sù</small></h2>
<h3>释义</h3>
<p>素部（第373部）部头：据衍生字「傃」「<img class="cim" src="/glyphs/chars/2616b.png">（紷）」的甲骨文，初文从糸从集束，糸为绩成的纱，象用纱线织成的生帛；《玉篇》「白緻繒也」、《廣韻》「帛也」。轉義：生帛未漂未染，本色尚存，故为白、为本、为本质不加修饰、为平常。辯證：戰國古文訛从垂从糸，小篆沿袭，故《說文》「从糸<img class="cim" src="/glyphs/chars/200b9.png">取其澤」析形不确。音源：中间一体未独立成字，其义音同「索」。</p>
<h3>声母拟态</h3>
<p>素为本色，心之本色即诚，故愫取「本色」一面。</p>
