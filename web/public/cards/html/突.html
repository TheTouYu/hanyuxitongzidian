<h2>突 <small>tū</small></h2>
<h3>释义</h3>
<p>【第208部部首字·一級字根】从宀从小从犬。可象意有兩：一指狗洞。養狗的人家為了方便狗的出入，往往會在牆邊設置一個小洞。一指狗从洞中鑽出來。《說文》：“犬从穴中暫出也。从犬在穴中。一曰滑（《桂馥·義證》釋‘滑’為‘搰’，義即挑抉）也。徒骨切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
