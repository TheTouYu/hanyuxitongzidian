<h2>门 <small>mén</small></h2>
<h3>释义</h3>
<p>【第278部部首字·一級字根】象雙扇門形。mén，《玉篇》：“人所出入也。在堂房曰戸，在區域曰門。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
