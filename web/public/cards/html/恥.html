<h2>恥 <small>chǐ</small></h2>
<h3>释义</h3>
<p>【第333部「耳部」】耳＝耳朵；恥取聞過自愧、耳熱面赤（《六書總要》从心耳會意）；恥从耳得聲，歸耳部。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：耳刺而愧。</p>
