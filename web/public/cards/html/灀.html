<h2>灀 <small>shuāng</small></h2>
<h3>释义</h3>
<p>【第529部「相部」】相＝从目从木，指觀木、察看木材質（戴侗《六書故》「相，度才也。工師用木，必相視其長短曲直」）；轉義省視、形貌；由觀木引申共、交互、輔助教導。音源借音，義同「向」（徜徉＝相羊）。字族分「交互相對輔助」與「霜系」兩組。</p>
<h3>声母拟态</h3>
<p>sh取失收：水寒而收。</p>
