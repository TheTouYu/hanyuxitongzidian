<h2><img class="cim" src="/glyphs/chars/2a4f7.png"> <small>xí</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/2a4f7.png">xí《說文》：“水蟲也。薉貉之民食之。从黽奚聲。胡雞切。”《段注》：“葢猶中國之食鼃，謂之水雞也。”田雞。蛙類。</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：水蟲牽連群游（推）。</p>
