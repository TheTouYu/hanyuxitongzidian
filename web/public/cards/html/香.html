<h2>香 <small>xiāng</small></h2>
<h3>释义</h3>
<p>【第588部「杳部」】杳＝从日在木下，象太陽落下，表夜晚、幽冥（《說文》「冥也」）；轉義 幽深、寬廣（《玉篇》「深、廣、寛皃」）；音源借音，因幽微而義音同「幺」（《莊子》「居於窈冥」一本作杳）。</p>
<h3>声母拟态</h3>
<p>x取续消：氣香而续。</p>
