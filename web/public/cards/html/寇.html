<h2>寇 <small>kòu</small></h2>
<h3>释义</h3>
<p>【第93部部首字·一級字根】从攴从完。“攴”指擊打，戰國古文或作“戈”，表示用武器攻打；从“完”，即攻破牆垣，入室搶劫之意。kòu，《玉篇》：“賊寇也。”《廣韻》：“鈔也。”</p>
<h3>声母拟态</h3>
<p>聲母義（寇部）：声母义（k·强）</p>
