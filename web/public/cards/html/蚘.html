<h2>蚘 <small>yóu</small></h2>
<h3>字根本义</h3>
<p>【464 尤部·余支】尤支转义有二：一为「寄生的、不动的」——肬为赘瘤、<img class="cim" src="/glyphs/chars/29463.png">为头颤、忧为不动、<img class="cim" src="/glyphs/chars/27c30.png">为疣猪；一为「形近之讹」——㞃、<img class="cim" src="/glyphs/chars/233de.png">、㕱皆讹字。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从虫尤声——蚩尤之「尤」通作蚘；又读 huí，即蛔虫。</p>
<h3>横向对照</h3>
<p>同取尤部「寄生不动／形近致讹」两面，形符各定落点：頁主颤、肉主瘤、虫豕主物、言心主情。</p>
<h3>声母义</h3>
<p>y取锐：虫聚而锐。</p>
