<h2>枱 <small>sì</small></h2>
<h3>释义</h3>
<p>枱，sì：《說文》「耒端也」，同「耜」——耒端挺出如男根，故从木（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>台多讀（yí／tái／sì），聲母不系（照實）。</p>
