<h2><img class="cim" src="/glyphs/chars/20b65.png">（<img class="cim" src="/glyphs/chars/22fc6.png">） <small>zhuì、suì</small></h2>
<h3>释义</h3>
<p>《說文》「楚人謂卜問吉凶曰<img class="cim" src="/glyphs/chars/20b65.png">。从又持祟，祟亦聲。讀若贅。之芮切。」清承培元《廣說文答問疏證》「<img class="cim" src="/glyphs/chars/20b65.png">即冬賽報祠之賽…賽即<img class="cim" src="/glyphs/chars/20b65.png">之俗字也」：古時農人于收成後舉辦謝神祭典，以答謝神的保祐；甲骨文从又持木从示，象意將柴堆于示前，準備燎祭，或引申指堵塞之意</p>
<h3>声母拟态</h3>
<p>zong組取「囤」：《說文》「楚人謂卜問吉凶曰<img class="cim" src="/glyphs/chars/20b65.png">。从又持祟，祟亦聲。（推）。</p>
