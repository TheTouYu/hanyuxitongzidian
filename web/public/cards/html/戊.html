<h2>戊 <small>wù</small></h2>
<h3>释义</h3>
<p>【第298部部首字·一級字根】象戟類兵器形，兼具矛的穿刺、戈的鉤割、斧的砍斫。wù，《正字通》：“周伯琦曰：戊，兵器，卽矛字，古文作<img class="cim" src="/glyphs/chars/25365.png">。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wù）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
