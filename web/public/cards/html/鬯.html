<h2>鬯 <small>chàng</small></h2>
<h3>释义</h3>
<p>【第539部部首字·一級字根】“<img class="cim" src="/glyphs/chars/2068d.png">”的甲骨文本从其的二疊。“其”，即箕；二疊，表示極致。象意細長的箕狀物，即釀酒時用以濾酒的竹簍。中或有小點，代指糟粒。釀酒時，將其放置在酒糟的中間，釀出的酒水會過濾到酒簍中，从而象意釀出來的醇酒。跟“酉”構型差不多。上加“勺”為“鬯”，象意舀取醇酒。chàng，《正字通》：“鬯，酒名。釀秬為酒，和以鬱金。鬱金，香艸也。”本義應該是指濾出的醇酒。後世專用黑黍釀成，並加上鬱金香，从而成為一種特殊的香酒。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
