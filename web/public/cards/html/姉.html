<h2>姉 <small>zǐ</small></h2>
<h3>释义</h3><p>zǐ《正字通》：“女兄也。《爾雅》：‘男子謂女子先生曰姉。’《詩·<img class="cim" src="/glyphs/chars/2868d.png">風》：‘問我諸姑，遂及伯姉。’今作姊……”</p>
<h3>讹字说明</h3><p>③形近字「<img class="cim" src="/glyphs/chars/20094.png">、帀、寺、巿」之訛</p>
