<h2>侖 <small>lún</small></h2>
<h3>释义</h3>
<p>【第448部部首字·一級字根】从亼从冊。“亼”為倒“口”形，表示會聚之意，可謂“合”之省；“冊”，指簡冊。象意卷成一捆的簡冊。lún，《正字通》：“亼冊而卷之侖如也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
