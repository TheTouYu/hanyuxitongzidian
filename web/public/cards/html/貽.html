<h2>貽 <small>yí</small></h2>
<h3>释义</h3>
<p>貽，yí：《新附》「贈遺也」，贈給遺留——如種留於後，故从貝（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>台多讀（yí／tái／sì），聲母不系（照實）。</p>
