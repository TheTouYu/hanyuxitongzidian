<h2>狁 <small>yǔn</small></h2>
<h3>释义</h3>
<p>甲骨文象人肩上騎人之形。跟“異”的表意方式近似。“夋（qūn）”的初文，《玉篇》：“倨也。”</p>
<h3>声母拟态</h3>
<p>以母y（零聲母），不系擬態聲母義。</p>
