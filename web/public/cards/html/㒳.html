<h2>㒳 <small>liǎng</small></h2>
<h3>释义</h3>
<p>【第308部部首字·一級字根】甲骨文象車衡縛車軛形。軛是套在牛馬頸上，以便控制牛馬用力拉車的器具。《集韻》：“乘也，匹也，”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
