<h2>吉 <small>jí</small></h2>
<h3>字根本义</h3>
<p>【467 圭部】圭＝甲骨文象上尖下方的玉圭，西周金文讹作相叠的「土」；古人天圆地方，圭上圆下方、琮内圆外方，皆象天地，龟背圆腹方其纹亦如圭。転义为标准（量之所起）、洁净。音源借蛙鸣（其状如蛙）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从口圭声：捧圭对鬼神说祈福之语，吉礼为五礼之首，引申吉祥。</p>
<h3>横向对照</h3>
<p>同取圭部「礼器定界、捧圭祈福」两面：口言取祈福，壺取塞，女力言取分属。</p>
<h3>声母义</h3>
<p>j「聚决」取「聚」：聚福而吉。</p>
