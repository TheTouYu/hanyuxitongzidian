<h2>䁏 <small>yǎo</small></h2>
<h3>释义</h3>
<p>【第589部「要部」】要＝甲骨文从<img class="cim" src="/glyphs/chars/26951.png">从妟，象雙手叉腰、抱腰，腰之初文（《玉篇》「腰，骻也，本作要」）；轉義 中間命門→重要、關鍵、簡略；腰柔→舒緩嫋娜；抱腰→請求、索要、約束。本批取「腰狀柔細」一面。</p>
<h3>声母拟态</h3>
<p>y取续消：視遠而续。</p>
