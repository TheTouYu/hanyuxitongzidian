<h2><img class="cim" src="/glyphs/chars/2052f.png"> <small>bān</small></h2>
<h3>字根本义</h3>
<p>【437 八部】八（bā）＝象物分开成两半、相背之形，《说文》「别也，象分别相背之形」；转义数字八、借「贝」之分二。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「赋事也，从菐从八，八亦声」——分配工作。</p>
<h3>横向对照</h3>
<p>同取八部「分开相背」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b取剥：事分而派。</p>
