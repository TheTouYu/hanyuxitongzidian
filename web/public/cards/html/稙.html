<h2>稙 <small>zhí</small></h2>
<h3>释义</h3>
<p>十部部头象竖置算筹；「直」支从目从十，以十目相交验之而正视，故其族多取「立而正、置而定」之象。</p>
<h3>声母拟态</h3>
<p>禾早立而先成，取「正」一面。</p>
