<h2>孞 <small>xìn</small></h2>
<h3>释义</h3>
<p>【第511部「心部」】心＝象動物心臟形（《說文》「人心，土藏，在身之中，象形」息林切）；音源為心跳聲，古心、刅通用。字族衍義①中心②心臟心思③心跳而滲入、插入、透出。</p>
<h3>声母拟态</h3>
<p>x取续：言續而誠。</p>
