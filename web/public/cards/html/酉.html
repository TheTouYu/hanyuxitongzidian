<h2>酉 <small>yǒu</small></h2>
<h3>释义</h3>
<p>【第547部部首字·一級字根】甲骨文象釀酒的器皿形，大約即尖底瓶（考古學者發現瓶底有酒麴類殘留物）。由于釀酒需要一定的溫度，但又不能太高。而穀物成熟的季節主要在秋季，氣溫偏低，需要適當加溫和保溫。从而採用尖底瓶的方式，以便于插在火塘的餘燼中用以保溫（如果是平底，容易將餘燼壓熄滅）。“酒”的初文。《釋名》：“酒，酉也，釀之米曲，酉澤久而味美也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yǒu）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
