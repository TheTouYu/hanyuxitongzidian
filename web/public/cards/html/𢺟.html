<h3>释义</h3>
<p>【第596部「羴部」】羴（shān）＝羊之二疊三疊（或四疊），象群羊；羊肉腥臊，疊體象十分腥臊（《說文》「羊臭也」）；亦可象溫順（歸「善」）、鮮美（歸「鱻/鮮」）；轉義 插入、爭先恐後；音源借音同「亶」。</p>
<h3>声母拟态</h3>
<p>ch取刺持：手插而持。</p>
