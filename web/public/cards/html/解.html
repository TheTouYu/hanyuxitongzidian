<h2>解 <small>jiě</small></h2>
<h3>释义</h3>
<p>【第218部部首字·一級字根】甲骨文从牛从<img class="cim" src="/glyphs/chars/26951.png">从角，象雙手抓住牛角的樣子，可象意為：一是將牛的角取下來；一是使角鬥的牛分開。“<img class="cim" src="/glyphs/chars/26951.png">”或作“攴”；戰國古文演变作“刀”，義同。jiě、xiè《說文》：“判也。从刀判牛角。一曰解廌獸也。佳買切。又戶賣切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
