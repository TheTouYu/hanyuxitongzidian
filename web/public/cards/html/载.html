<h2>载 <small>zài</small></h2>
<h3>字根本义</h3>
<p>【才部·<img class="cim" src="/glyphs/chars/2298f.png">声】「<img class="cim" src="/glyphs/chars/2298f.png">（<img class="cim" src="/glyphs/chars/22992.png">）」从戈才声：「才」指花果之梗，从戈表用戈割取，本义指采摘花果；转义伤害（《说文》「伤也」）。字族衍义：①指梗，表示承载 ②指采摘，表示受伤害之后的剩余。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿才部有「▲花的结构图」，<img class="cim" src="/glyphs/chars/2298f.png">族有「▲《种竹斋》局部（明 仇英）」。</p>
<h3>形旁声旁</h3>
<p>从车<img class="cim" src="/glyphs/chars/2298f.png">声，《说文》「乘也」作代切；《六书故》「所载之物为载」、《正字通》「承也、胜也」——乘坐、运载、承载。</p>
<h3>横向对照</h3>
<p><img class="cim" src="/glyphs/chars/2298f.png">族①之承：以「车」定其载，梗承花果即车承物。</p>
<h3>声母义</h3>
<p>z「凿总」取「总」：总载于车。</p>
