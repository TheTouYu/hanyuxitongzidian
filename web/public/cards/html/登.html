<h2>登 <small>dēng</small></h2>
<h3>释义</h3>
<p>【第170部部首字·一級字根】从癶（<img class="cim" src="/glyphs/chars/23956.png">）从豆，或加<img class="cim" src="/glyphs/chars/20b1e.png">。“癶”指兩足並立；“<img class="cim" src="/glyphs/chars/20b1e.png">”是雙手捧舉；“豆”指裝食物的圓形器皿。象意手捧豐盛的食物往上進獻。或省“癶”，或省“<img class="cim" src="/glyphs/chars/20b1e.png">”，意義相同。dēng，《玉篇》：“進也。”《爾雅》：“瓦豆謂之登。”祭祀時盛肉食的禮器。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 d（擬態「囤动」），取「动」一面；本部未列 02z 表，按緒論推。</p>
