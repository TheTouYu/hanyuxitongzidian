<h2>歡 <small>huān</small></h2>
<h3>字根本义</h3>
<p>【444 雈部】雈＝苍鹭；诸字取鹭之「盯水面、鸣声亮、颈曲、逐鱼」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「喜樂也，从欠雚聲」——喜悦欢乐。</p>
<h3>横向对照</h3>
<p>同取雈部「鹭之视／鸣／曲颈」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>h取活：喜而气舒。</p>
