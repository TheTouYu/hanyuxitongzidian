<h2>乍 <small>zhà</small></h2>
<h3>释义</h3>
<p>【第238部部首字·一級字根】甲骨文从（入）从（氒），氒亦聲。“入”指嵌入、捶擊；“氒”指勺形器具。或加（丯），指切刻的印記。象意用勺形的器具插進或擊打，跟“撅”義相近，表示耕作或夯築之意。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
