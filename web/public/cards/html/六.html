<h2>六 <small></small></h2>
<h3>释义</h3>
<p>【第51部部首字·一級字根】象帳篷或屋子的輪廓形。跟“宀（mián）”同源。《玉篇》：“宀，交覆深屋也。”</p>
<h3>声母拟态</h3>
<p>聲母義（六部）：声母义（l·中） 辨證：《說文》：“《易》之數，陰變于六，正于八。从入从八。凡六之屬皆从六。力竹切。”析形不確。</p>
