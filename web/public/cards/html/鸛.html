<h2>鸛 <small>guàn</small></h2>
<h3>字根本义</h3>
<p>【444 雈部】雈（huán）＝甲文象头上有角之鸟，本义当指苍鹭（有毛角、盯水面待鱼、鸣声亮、颈常曲）；辯證：《说文》「鴟屬」存疑（猫头鹰「舊」亦从雈），与草名「萑」形近易混。音源：音源字，源自鹭鸣。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《說文》「鸛專，如䧿短尾」——大型涉禽，喙粗颈长，叩喙发声。</p>
<h3>横向对照</h3>
<p>同取本部「乖违／鹭鸟」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>g取隔：涉水而立。</p>
