<h2>弟 <small>dì</small></h2>
<h3>释义</h3>
<p>【第28部部首字·一級字根】象木橛上纏絲之形。本指纏有繒絲的弋。</p>
<h3>声母拟态</h3>
<p>聲母義（弟部）：声母义（d·强） 辨證：《說文》：“韋束之次第也。从古字（《段注》作‘文’）之象。凡弟之屬皆从弟。，古文弟。从古文韋省，丿聲。特計切。”將“弋”與所纏繩視為“韋”，析形不確。</p>
