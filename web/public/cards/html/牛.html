<h2>牛 <small>niú</small></h2>
<h3>释义</h3>
<p>【第295部部首字·一級字根】甲骨文象牛頭形，上面的叉狀為角，下面相對的為耳，中間一豎代表臉部。商代金文或以牛的整體象形表示。niú，《玉篇》：“大牲也。黄帝服牛乘馬。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 niú；未列 02z，按緒論取一面未判（02z 未收）。</p>
