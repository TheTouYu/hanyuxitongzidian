<h2>㶤 <small>chǎo</small></h2>
<h3>释义</h3>
<p>部頭夕：象彎月形，指月亮，與「月」同源。轉義夜晚（《說文》「莫也，从月半見」）、傾斜（《廣雅》「衺也」）、墓穴（穸）。音源：月因形借「缺」，夕因時借「亦」；夜黑易遭蛇咬故又通「也」；夜亦稱「冥」。字族衍義：①夜晚及夜間事物 ②音譯 ③形近「勺、夊、反」之訛。</p>
<h3>声母拟态</h3>
<p>穿母ch，「刺持」取「刺」。</p>
