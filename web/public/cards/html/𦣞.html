<h2><img class="cim" src="/glyphs/chars/268de.png"> <small>jī</small></h2>
<h3>释义</h3>
<p>【第12部部首字·一級字根】象牙床形，尖銳部分為牙齒。指牙床骨。yí，《說文》以其象下巴：“<img class="cim" src="/glyphs/chars/2951e.png">也。象形。凡<img class="cim" src="/glyphs/chars/268de.png">之屬皆从<img class="cim" src="/glyphs/chars/268de.png">。，篆文<img class="cim" src="/glyphs/chars/268de.png">。，籀文从首。與之切。”《龍龕》：“輔車骨也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第12部），無擬態聲母義可系，義靠義類與字形。</p>
