<h2><img class="cim" src="/glyphs/chars/2a181.png"> <small>sī</small></h2>
<h3>字根本義</h3>
<p>部首斯（sī）：从斤其聲——斤指斧，其指箕；箕以竹篾柳條編成，斧斫之自然散成細條；《說文》「析也」，引《詩》「斧以斯之」，息移切。轉義：分散分開分離（《廣雅》裂也分也、《爾雅》離也）、盡與全部、近指此也；散成一條條又引申指束髮帛巾。字族衍義：多指破裂、離析、分散。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該部有插圖可參。</p>
<h3>形旁声旁</h3>
<p>从鳥斯聲，《集韻》「鸒<img class="cim" src="/glyphs/chars/2a181.png">，雅烏也」——烏鴉，指其叫聲嘶啞。</p>
<h3>横向对照</h3>
<p>主組：以鳥定落點——鴉聲嘶。</p>
<h3>声母义</h3>
<p>s「失收」取「失」：聲嘶而失。</p>
