<h2>䜁 <small>xǐ</small></h2>
<h3>字根本义</h3>
<p>【402 夨部】部首夨（zè）：象人侧着头的样子（《说文》「倾头也，从大，象形」）。音源：借音字，有偏侧之意而义音同「则」；但衍生字多与舞有关，实为音源字，源自跳舞歌呼声。字族衍义：多指侧头，表示倾斜。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「謑，《说文》耻也，或从奊」，一曰「謑诟，小人怒」；「䜁訽，怒也」——羞辱、怒诟。</p>
<h3>横向对照</h3>
<p>夨族之言：以「言」定其用，斜行而诟。</p>
<h3>声母义</h3>
<p>x「续消」取「消」：怨消而诟。</p>
