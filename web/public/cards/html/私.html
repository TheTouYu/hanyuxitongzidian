<h2>私 <small>sī</small></h2>
<h3>释义</h3>
<p>私，sī：从禾厶聲。《說文》「禾也。北道名禾主人曰私主人」——本為禾名；《正字通》「又對公而言謂之私。古有公田、私田。私，民所私有也」，引申為自己的、私人的（與「公」相對）。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：禾收而歸私有（推）。</p>
