<h2>㒟 <small>niǎo</small></h2>
<h3>释义</h3>
<p>【第607部「褭部」】褭＝从馬从衣：以組帶馬也（《說文》），絲帶系馬；一曰馬之飄逸（騕褭，良馬）；引申柔長（裊）。</p>
<h3>声母拟态</h3>
<p>n取纳弄：身曲而纳。</p>
