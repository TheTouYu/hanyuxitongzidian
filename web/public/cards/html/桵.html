<h2>桵 <small>ruí</small></h2>
<h3>释义</h3>
<p>妥＝以手安撫女子，引申止息安定、柔弱委頹（p292、p295-296）。</p>
<h3>声母拟态</h3>
<p>日母r，「柔銳」取「柔」：木理白疏，柔而易破。</p>
