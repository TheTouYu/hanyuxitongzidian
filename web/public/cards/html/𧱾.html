<h2><img class="cim" src="/glyphs/chars/27c7e.png"> <small>guāi</small></h2>
<h3>字根本义</h3>
<p>【441 豩部】豩（huān/bīn）＝从豕二叠、三叠，象意野猪成群追逐争斗、顽劣；二叠亦可表小，小野猪毛色条纹→斑驳（豳）。辯證：《说文》「二豕也」无实义，叠体表特性/数量之极致。音源：借音，义音同「分」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《字學三正》「犬逐也」；《正字通》疑「燹」之譌——犬逐。</p>
<h3>横向对照</h3>
<p>同取本部「群豕／全牲／文武」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>g「隔估」取「隔」：逐而分。</p>
