<h2>進 <small>jìn</small></h2>
<h3>释义</h3>
<p>【第564部部首字·一級字根】从止从隹。“止”，指行走；“隹”，指鳥。象意象鳥一樣行進。由于鳥只能向前，不能後退，所以表示前進之義。jìn，《玉篇》：“前也、升也、登也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
