<h2>應 <small>yìng</small></h2>
<h3>字根本义</h3>
<p>【511 心部】心＝象心臟形（甲骨文作心房心室之狀），本義心臟；轉義心思、感情、中心、核心。部內从心諸字皆以心為義符，聲符給具體情狀。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从心䧹聲：本義應當（《說文》「當也」），引申應對、感應。</p>
<h3>横向对照</h3>
<p>同以心為義符：水取其滲，艸取其芯，言取其誠。</p>
<h3>声母义</h3>
<p>y「柔锐」取「柔」：應而柔順。</p>
