<h2>夂 <small></small></h2>
<h3>释义</h3>
<p>【第350部部首字·一級字根】象腳印倒過來的樣子。指往後退、往回走的意思。《說文》以其為“夊（suī）”：“行遲曳夊夊，象人兩脛有所躧也。凡夊之屬皆从夊。楚危切。”實為“退（tuì）”的初文，《集韻》：“復，《說文》：‘卻也。一曰行遲也。’或从內。古作<img class="cim" src="/glyphs/chars/28467.png">、<img class="cim" src="/glyphs/chars/284e4.png">、<img class="cim" src="/glyphs/chars/2852b.png">。隷作退。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 無；未列 02z，按緒論取一面未判（02z 未收）。</p>
