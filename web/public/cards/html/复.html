<h2>复 <small>fú</small></h2>
<h3>释义</h3>
<p>【第148部部首字·一級字根】从<img class="cim" src="/glyphs/chars/20041.png">从夂。“<img class="cim" src="/glyphs/chars/20041.png">”，即鍑，古代的一種大口鍋，敞口、大腹而圈足；“夂”，象腳印往後或往下形。象意鍑足的小。實為“鍑”的初文，《說文》：“釜大口者。从金，复聲。方副切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
