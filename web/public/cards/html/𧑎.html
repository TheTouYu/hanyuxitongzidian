<h2><img class="cim" src="/glyphs/chars/2744e.png">（<img class="cim" src="/glyphs/chars/2726b.png"><img class="cim" src="/glyphs/chars/272ba.png">蠆） <small>cuì</small></h2>
<h3>释义</h3>
<p>《說文》「蟲也。从虫<img class="cim" src="/glyphs/chars/20b65.png">聲。祖外切。」《正字通》引《通雅》「<img class="cim" src="/glyphs/chars/2744e.png">卽蝁蠚之名，祖外之音轉為颯」…《重文揮犀》「蟲狀似蟬，形小而扁，隱屋壁及書册中…此名惡颯，不治殺人」</p>
<h3>声母拟态</h3>
<p>zong組取「豁」：《說文》「蟲也。从虫<img class="cim" src="/glyphs/chars/20b65.png">聲。祖外切。」《正字通》引（推）。</p>
