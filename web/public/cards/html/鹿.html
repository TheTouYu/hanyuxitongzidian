<h2>鹿 <small>lù</small></h2>
<h3>释义</h3>
<p>【第100部部首字·一級字根】象鹿形。指鹿。lù，《說文》：“獸也。象頭角四足之形，鳥鹿足相似，从匕。凡鹿之屬皆从鹿。盧穀切。”</p>
<h3>声母拟态</h3>
<p>聲母義（鹿部）：声母义（l·强）</p>
