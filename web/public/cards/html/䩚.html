<h3>释义</h3>
<p>䩚，dì：《集韻》：“靪，補履下也；從氐定類（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>d「囤动」取「囤」：補履下也——皮聚補於履底。</p>
