<h3>释义</h3>
<p>【第266部部首字·一級字根】甲骨文象乳房的正面形，上象乳房，下為輪廓線，指乳房。“乃”的另體。nǎi，《爾雅》：“迺，乃也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 r（擬態「柔锐」），取「锐」一面；本部未列 02z 表，按緒論推。</p>
