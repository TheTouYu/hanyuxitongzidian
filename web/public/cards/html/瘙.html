<h2>瘙 <small>sào</small></h2>
<h3>释义</h3>
<p>【第586部「爪部」·蚤支】蚤＝甲骨文从虫从又（又即爪，表抓撓），象引起人抓撓的蟲（跳蚤），《說文》「齧人跳蟲，从䖵㕚聲，㕚古爪字」；轉義 早（借為早暮字）、抓撓；字族取「跳動、蚤咬瘙癢吵醒抓撓」二面。</p>
<h3>声母拟态</h3>
<p>s取失收：癢聚而收。</p>
