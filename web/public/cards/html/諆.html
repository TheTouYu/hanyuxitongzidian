<h2>諆 <small>qī</small></h2>
<h3>字根本義</h3>
<p>部首其（jī）：甲骨文象箕形，周中期金文下加「丌」表聲兼表意，戰國或从竹；《說文》「簸也」。轉義：箕主盛裝→代詞；編紋螺旋→週期；編結緊密→密謀。字族衍義：①箕狀（盤踞、面具）②箕紋形（周繞、交會）③博棋（欺、謀）。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該部有插圖可參。</p>
<h3>形旁声旁</h3>
<p>从言其聲，《說文》「諆，欺也」（去其切）；《廣韻》謀也。</p>
<h3>横向对照</h3>
<p>③組：以言定落點——以言相欺。</p>
<h3>声母义</h3>
<p>q「親缺」取「缺」：言虛而缺。</p>
