<h2>比 <small>bǐ</small></h2>
<h3>释义</h3>
<p>【第153部部首字·一級字根】為匕的二疊。“匕”，象翅膀形；二疊，表示極致。或象意鳥類的群飛，表示密切、並列、齊同、比次。bǐ，《廣韻》：“和也。並也。”《字彙》：“齊也。”《廣韻》：“比次。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
