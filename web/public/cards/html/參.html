<h2>參 <small>shēn</small></h2>
<h3>释义</h3>
<p>【第594部「彡部」】參（二級字根）＝商代金文象簪滿珠玉髮飾的跪跽人形，本義插簪（此義分化為「篸/簪」）；轉義 下拜見上（參謁）、加入查驗、參差不齊、眾多；借指數字三、參宿三星。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：簪插而收。</p>
