<h2>齃 <small>è</small></h2>
<h3>释义</h3>
<p>从鼻曷聲：《說文》「鼻莖也」，鼻梁高起；取高舉之義（推）。</p>
<h3>声母拟态</h3>
<p>è 為零聲母一系，緒論七組未列，不系（照實）。</p>
