<h2>麗 <small>lì</small></h2>
<h3>释义</h3>
<p>【第580部部首字·一級字根】象角沒有分杈的鹿形，大約指麂。因其本義隱沒，後世另造“麂”或“<img class="cim" src="/glyphs/chars/2a2a8.png">”名之。jǐ，《說文》：“<img class="cim" src="/glyphs/chars/2a2a8.png">，大麋也。狗足。从鹿旨聲。或从几。”麂子是鹿科動物，形體似麝，雄的生短角。腳細而有力，善于跳躍。常見品種有黃麂、黑麂、小麂等。其中黃麂多見，故《龍龕》：“黃鹿也。”其皮革十分柔軟，適宜做衣服、帽子。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
