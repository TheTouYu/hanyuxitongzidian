<h2>來 <small>lái</small></h2>
<h3>释义</h3>
<p>【第576部部首字·一級字根】甲骨文象麥有穗、莖、葉、根之形。麥子的葉子細長，所以呈披折狀。lái，《說文》：“周所受瑞麥來麰。一來二縫，象芒朿之形。天所來也，故為行來之來。《詩》曰：‘詒我來麰。’凡來之屬皆从來。洛哀切。”《天工開物》：“凡麥有數種，小麥曰來，麥之長也；大麥曰牟、曰穬。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
