<h2>沶 <small>yí</small></h2>
<h3>释义</h3>
<p>《玉篇》：“水名。”chí，《集韻》：“坻，《說文》：‘小渚。’引《詩》：‘宛在水中坻。’或作汷、<img class="cim" src="/glyphs/chars/23e61.png">、<img class="cim" src="/glyphs/chars/21286.png">、沶。”水中的小洲或高地。shì，《集韻》：“沶鄉，縣名。”今湖北南漳縣西南。</p>
<h3>声母拟态</h3>
<p>零聲母，緒論七組未列，不系（照實）。</p>
