<h2>妻 <small>qī</small></h2>
<h3>释义</h3>
<p>【第85部部首字·一級字根】甲骨文从又抓女子頭髮之形。指古代的掠婚制，即掠外族女子為配偶。或疑指古時已婚女子的簪髮，釵、簪的束髮作用猶如手持，故从“又”。與“夫”的結構類似。古代成年男女都要舉行加冠和簪髮儀式，完畢後意味著可以結婚生子了。西周金文或訛變為从母从西。qì，《集韻》：“以女嫁人曰妻。”</p>
<h3>声母拟态</h3>
<p>聲母義（妻部）：声母义（q·强） 辨證：《說文》依據小篆，釋作：“婦，與夫齊者也。从女，从屮，从又。又，持事，妻職也。，古文妻从<img class="cim" src="/glyphs/chars/21b59.png">女。<img class="cim" src="/glyphs/chars/21b59.png">，古文貴字。七稽切。（注）臣鉉等曰：屮者，進也，齊之義也，故从屮。”“屮”本指女子頭髮，故析形不確。</p>
