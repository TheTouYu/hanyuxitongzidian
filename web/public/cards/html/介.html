<h2>介 <small>jiè</small></h2>
<h3>释义</h3>
<p>【第81部部首字·一級字根】甲骨文从人四周有小點之形。小點指小的塊狀物；从“人”，象意有二：</p>
<h3>声母拟态</h3>
<p>聲母義（介部）：声母义（j·强） 辨證：小篆將旁邊的小點簡寫作“八”，故《說文》：“畫也。从八，从人；人各有介。古拜切。”析形不確。</p>
