<h2><img class="cim" src="/glyphs/chars/28ff3.png"> <small>yīng</small></h2>
<h3>释义</h3>
<p>【第200部部首字·一級字根】甲骨文本从隹从勹。“隹”，指鳥；“勹”，指人俯伏的樣子。象意鷹。鷹比一般鳥類不同，因其翅膀寬大，在天空中飛翔時，多是平展著翅膀滑翔，故从“勹”，作俯伏狀。西周金文在“勹”前加一點，象事指胸部。意義更為明確。yīng，《玉篇》：“鷙鳥。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yīng）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
