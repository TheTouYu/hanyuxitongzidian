<h2>凵 <small>kǎn</small></h2>
<h3>释义</h3>
<p>【第183部部首字·一級字根】象開口向上的虛空之形。可指坑洞，也可指器物。kǎn，《正字通》：“魏校曰：‘凵，受物之器。象地體承載形，虛中者，當其無，有器之用也’。”《說文》：“張口也。象形。凡凵之屬皆从凵。口犯切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 k（擬態「口控」），取「控」一面；本部未列 02z 表，按緒論推。</p>
