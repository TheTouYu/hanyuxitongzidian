<h3>释义</h3>
<p>【第525部「昜部」】昜＝从日从丂（脖頸象形），象對日呼號、日出；轉義飛舉、乾旱；音源本丂聲。字族三面：日烈／日出／日升。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「失」：矢中而失。</p>
