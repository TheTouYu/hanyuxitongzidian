<h2>蝯 <small>yuán</small></h2>
<h3>字根本义</h3>
<p>【479 爰部】爰＝兩手各持藤狀物一端相牽拉（金文上手下手分指俯拉、攀援），引申援助，又作虛詞「為、于、曰」；音源借猿善攀援。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从虫爰聲：《集韻》「蝯，《說文》：善援，禺屬」，即猿的本字。</p>
<h3>横向对照</h3>
<p>同取本部「牽援成器、目眶圍黑」两面：金木火各定其用，目取其圍。</p>
<h3>声母义</h3>
<p>y「续消」取「续」：攀續而援。</p>
