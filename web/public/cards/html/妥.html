<h2>妥 <small>tuǒ</small></h2>
<h3>释义</h3>
<p>【第349部部首字·一級字根】从又从女。“又”，指手；或作“爪”，同。从“女”，象意女子用手安撫。實為“娞（綏suī）”的初文，《廣雅》：“撫也。舒也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
