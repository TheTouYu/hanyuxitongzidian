<h2>凜 <small>lǐn</small></h2>
<h3>释义</h3>
<p>【第592部「冬部」·稟（㐭）族】稟＝西周金文从米㐭聲（或加攴加禾），象禾晾或穀倉，與嗇同源（《集韻》「穀所振入，或作廩、稟」）；轉義 往上晾禾→敬、下對上報告；收穀入倉→賜穀、賜予、領受；禾晾高處→寒冷淒清（凜）；辯證 俗訛作「禀」（米、示形近）。</p>
<h3>声母拟态</h3>
<p>l取拢离：寒凝而拢。</p>
