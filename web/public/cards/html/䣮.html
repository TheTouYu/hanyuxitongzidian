<h2>䣮 <small>pò</small></h2>
<h3>字根本义</h3>
<p>【419 犮部】犮与亥同源，金文象直立的旱獭正面形、足加一丿表示抬起前肢；转义：直立→挺拔抽引、往前扑、毛皮宜作蔽膝、掘根致沙化→旱灾、毛发、腿肉。音源：源自旱獭叫声。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《广韵》「酒气」——酒的气味。</p>
<h3>横向对照</h3>
<p>同取犮部「旱獭气息／皮毛」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p「拼辟」取「辟」：气辟而散。</p>
