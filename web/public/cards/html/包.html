<h2>包 <small>bāo</small></h2>
<h3>释义</h3>
<p>【第142部部首字·一級字根】“包、勽”與“孕”初本一字，象子在腹中的樣子，表示懷孕的意思。後期省略掉人形，象人在胎盤中的樣子，而專指“包”或“勽”。bāo，《玉篇》：“包，今作胞。”“胞，胞胎也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
