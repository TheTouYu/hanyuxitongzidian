<h2>咍 <small>hāi</small></h2>
<h3>释义</h3>
<p>咍，hāi：《說文》「蚩笑也」，戲笑葷語——事後調笑，故从口（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>台多讀（yí／tái／sì），聲母不系（照實）。</p>
