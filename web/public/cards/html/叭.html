<h2>叭 <small>pā</small></h2>
<h3>字根本义</h3>
<p>【437 八部】八（bā）＝象物分开成两半、相背之形，《说文》「别也，象分别相背之形」；转义数字八、借「贝」之分二。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「声也」；《字汇》「口开貌」；又军号（号筒）。</p>
<h3>横向对照</h3>
<p>同取八部「分开相背」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p取辟：口开而声。</p>
