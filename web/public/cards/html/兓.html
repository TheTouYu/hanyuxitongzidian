<h2>兓 <small>qīn</small></h2>
<h3>释义</h3>
<p>【第565部「兟部」】兟＝从二先，甲骨文象人牽引另一人（引導），《說文》「進也」；㚘＝从二夫（簪髮成年男子），並行、伴侶；部族以「贊」為重點（贊禮司儀，引申分散、稱頌、聚集）。</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「亲」：口張而亲。</p>
