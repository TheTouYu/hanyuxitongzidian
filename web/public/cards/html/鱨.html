<h2>鱨 <small>cháng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·尚系（二级字根）】尚＝从八向聲：分開并開窗，為「敞」之初文；字族三面：敞開敞亮／推舉罩覆／來回反復。</p>
<h3>声母拟态</h3>
<p>ch取刺持：魚揚而持。</p>
