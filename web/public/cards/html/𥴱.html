<h3>释义</h3>
<p>【第562部「廌部」】廌＝象獨角仙（雙叉犀金龜）形，雄蟲頭生分叉巨角，好鬥，以角挑起對手掀翻定勝負；古人以「神斷」決訟，引申律法；《說文》「解廌獸、觸不直」為後世傳說。</p>
