<h3>释义</h3>
<p>《說文》「謹也。从心<img class="cim" src="/glyphs/chars/20b65.png">聲。讀若毳。此芮切。」謹慎。趙宧光《長箋》「卜問吉凶為<img class="cim" src="/glyphs/chars/22848.png">。卜之于心，謹可知矣，故从<img class="cim" src="/glyphs/chars/22848.png">」</p>
<h3>声母拟态</h3>
