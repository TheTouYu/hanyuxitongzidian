<h2><img class="cim" src="/glyphs/chars/204f2.png"> <small>chéng</small></h2>
<h3>本义</h3>
<p><img class="cim" src="/glyphs/chars/204f2.png">（乘），chéng：甲骨文从大（人）在木上，象人登树／乘车之形。原稿注「167《乘部》」，独立为部。</p>
<h3>转义</h3>
<p>引申为乘坐、登、凭借、四马一车（千乘）。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：乘者持轡而坐。</p>
<h3>部属说明</h3>
<p>本部字根在 167 乘部独立立部，此处存目。</p>
