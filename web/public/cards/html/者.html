<h3>声母拟态</h3>
<p>聲母義（者部）：声母义（zh·中） 辨證：《說文》：“別事詞也。从白<img class="cim" src="/glyphs/chars/23950.png">聲。<img class="cim" src="/glyphs/chars/23950.png">，古文旅字。之也切。”以其从<img class="cim" src="/glyphs/chars/23950.png">，作“旅”的古文，“旅”的甲金文均作，从“㫃”从“从”，跟“者”相差甚遠，當系形近而誤。</p>
