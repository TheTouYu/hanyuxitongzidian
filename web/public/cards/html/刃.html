<h2>刃 <small>rèn</small></h2>
<h3>释义</h3>
<p>【第344部部首字·一級字根】在刀口部位加一指示符號，象事指刀的鋒刃。rèn，《說文》：“刀堅也。象刀有刃之形。凡刃之屬皆从刃。而振切。”《正字通》：“刀口所用割切也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 r（擬態「柔锐」），取「锐」一面；本部未列 02z 表，按緒論推。</p>
