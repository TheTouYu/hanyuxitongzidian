<h3>释义</h3>
<p>【第587部「幺部」】幺＝象蠶吐絲（兩股相交）；幼支＝从力幺聲：少也（《說文》），引申 嫩弱、精微、柔曲；本批取「半乾蜷曲、地不平、面醜頸僵」等柔曲細弱一面。</p>
<h3>声母拟态</h3>
<p>a「隔估」取「隔」：石凹而隔。</p>
