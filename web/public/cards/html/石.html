<h2>石 <small></small></h2>
<h3>释义</h3>
<p>【第45部部首字·一級字根】甲骨文象懸崖形。因為只有石塊才可能這樣呈倒立狀（土塊會崩塌下來），故指石頭。shí，《說文》：“山石也。在厂之下；口，象形。凡石之屬皆从石。常只切。”或下加“口”，指落下的石塊狀。《字彙》：“山骨。”</p>
<h3>声母拟态</h3>
<p>聲母義（石部）：声母义（sh·弱）</p>
