<h3>释义</h3>
<p>《集韻》：“鷤，鳥名。《博雅》：‘鷤鳺，子鳺也。’或作鶗、<img class="cim" src="/glyphs/chars/29ff7.png">。”杜鵑鳥。从“示”，應是指其產卵于某些種鳥的巢中，靠養父母孵化和育雛；而將對方的卵移走一個或多個。義音同“替”。</p>
<h3>声母拟态</h3>
<p>t「涂突」取「突」：《集韻》：“鷤，鳥名。《博雅》：‘鷤鳺，子鳺——借聲之字，聲母亦摹其音（推）。</p>
