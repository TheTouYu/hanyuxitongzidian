<h2>恖 <small>sī</small></h2>
<h3>释义</h3>
<p>字族「恖」（思）：从心、囟聲。指心腦活動——古人以為心腦都是思維器官，故《說文》「容也。从心，囟聲，息茲切」；《集韻》「慮也」，《廣韻》「念也」。轉義：腮與囟門、心臟一樣能在裡面翕動，故引申指腮（sāi，《正字通》「頰旁，或作顋，俗作腮」），或指多鬚（《集韻》「䯱䰄，多須皃，或作思」）。字族兩路：①思索，細密如絲（緦、䰄、罳、䚡、偲）②囟動，翕動不安（鰓、腮、颸、禗、諰）。</p>
<h3>声母拟态</h3>
<p>心母s，「失收」取「收」：思緒收聚於心。</p>
