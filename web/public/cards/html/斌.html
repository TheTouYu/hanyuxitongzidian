<h2>斌 <small>bīn</small></h2>
<h3>字根本义</h3>
<p>【第442部部首字·一級字根】从文从武。象意文武兼備。bīn，《玉篇》：“文質皃。亦作份、彬。”</p>
<h3>字形</h3>
<p>字形：字形库存 2 形（見字根字形圖）。</p>
<h3>形旁声旁</h3>
<p>形旁聲旁：本字為部內字根（象形／象意），形義合一；其字族在本部下。</p>
<h3>横向对照</h3>
<p>同部字族見本部各條：<img class="cim" src="/glyphs/chars/23066.png">pán《改併四聲篇海·文部》引《俗字背篇》：“<img class="cim" src="/glyphs/chars/23066.png">，音鎜字。”《字彙補·文部》：</p>
<h3>声母义</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
