<h2>子 <small>zǐ</small></h2>
<h3>释义</h3>
<p>【第388部部首字·一級字根】像身子被包裹，雙手在外的人形，指繈褓中的嬰兒。zǐ，《玉篇》：“兒也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 z（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
