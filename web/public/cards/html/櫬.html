<h2>櫬 <small>chèn</small></h2>
<h3>释义</h3>
<p>【第556部「辛部」】辛（䇂）＝象小刻刀形（上柄下刃、中有護手），用於刻字、紋身（郭沫若說，婦好墓出土玉刻刀可證）；紋身刺痛故引申辛辣、辛苦，紋身為商人身份象徵故引申新生。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：木持而棺。</p>
