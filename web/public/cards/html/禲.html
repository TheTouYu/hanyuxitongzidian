<h2>禲 <small>lì</small></h2>
<h3>释义</h3>
<p>【第573部「萬部」】萬（<img class="cim" src="/glyphs/chars/27363.png">）＝象蠍子形（尾部常蜷曲，又名全蟲）；因冬眠成堆潛伏、負子於背，引申數目極多、大；音源為借音（蠍不鳴），字族多取「栗」（硬殼毒刺）之音。字族四面：①多盛 ②凶惡燒灼 ③舉尾高 ④殼狀粗糙。</p>
<h3>声母拟态</h3>
<p>l取拢离：鬼災而离。</p>
