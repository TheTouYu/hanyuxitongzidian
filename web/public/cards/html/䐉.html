<h2>䐉 <small>zì</small></h2>
<h3>字根本义</h3>
<p>【416 甾部】甾＝甲骨文从屮（草）被水淹没之形，后作从田<img class="cim" src="/glyphs/chars/21fe7.png">声，指水淹田；转义：浸渍之田泥变黑，引申指黑色（分化作缁）。字族衍义：①草木被淹死→直立、参差 ②浸渍之泥→黑色。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「腊䐉也」；《正字通》「讹字，《说文》无䐉字」，大约即「腦」之讹。</p>
<h3>横向对照</h3>
<p>同取本部「主刀分肉／淹死成滓」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>z「凿总」取「总」：肉总而肥。</p>
