<h2>漅 <small>cháo</small></h2>
<h3>释义</h3>
<p>【第583部「巢部」】巢＝甲骨文从木上有「西」（西本指鳥窩），象樹上有鳥窩形；《說文》「鳥在木上曰巢，在穴曰窠」；轉義 高／笙（鳥窩在樹上猶笙之有瓠）／棧道；音源借音（鷦鷯最善營巢，義音同「少」）。字族分五面：鳥巢之狀／高、抄掠／小／吵鬧／形近之訛。</p>
<h3>声母拟态</h3>
<p>ch取刺持：水聚而持。</p>
