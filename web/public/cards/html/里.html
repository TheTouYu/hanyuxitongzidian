<h2>里 <small>lǐ</small></h2>
<h3>本义</h3>
<p>里：从田从土，本義為人所聚居之地、鄉里。</p>
<h3>转义</h3>
<p>引申為故鄉、里程、內裡（與「裏」通）。</p>
<h3>辩证</h3>
<p>《說文》「居也」，可從；与「裏」表裡字别。</p>
<h3>音源</h3>
<p>士部之聲，里从士得聲（原稿列士部字族）。</p>
<h3>声母拟态</h3>
<p>l「拢离」取「拢」：聚族而居（推）。</p>
<h3>字族衍义</h3>
<p><b>同族</b></p>
