<h2>齉 <small>nàng</small></h2>
<h3>释义</h3>
<p>【第536部「囊部」】囊＝甲骨文象两头扎起的无底口袋（《廣韻》「袋也」）；转义敛藏（《正字通》「凡蓄藏者皆曰囊」）。辩证《说文》「从㯻省，襄省聲」析形不确，亦为襄、囊相混之因。音源借音：袋盛物鼓出，襄本有肥义，音义可通。</p>
<h3>声母拟态</h3>
<p>n取纳弄：鼻塞而纳。</p>
