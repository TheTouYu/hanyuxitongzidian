<h2>則 <small>zé</small></h2>
<h3>释义</h3>
<p>【第401部部首字·一級字根】从鼎从刀，鼎或作二疊。刀是刻不了鼎的，因此，“鼎”指的是跟實物相似的模型。鑄鼎時，要先按照鼎的樣子，用泥土製作成一個模型，在模型上刻好銘文和裝飾圖案。然後將厚厚的泥土敷在模型上，脫下成一塊塊的外廓以及中間的芯子，這就是“範”。再將範組合攏來，中間會形成鼎的空腔，將青銅溶液澆進空腔裏，就會冷卻成鼎的器形了。“則”指的就是用刀製作鼎模型的過程。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 z（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
