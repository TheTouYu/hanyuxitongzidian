<h2>㥏 <small>tiǎn</small></h2>
<h3>字根本义</h3>
<p>【510 典部】典＝从冊从<img class="cim" src="/glyphs/chars/20b1e.png">：冊指書簡，<img class="cim" src="/glyphs/chars/20b1e.png">指兩手捧簡冊，象意有二——尊奉簡冊（經籍）與捧冊頌讀（典禮）。部內从典諸字取「厚重、豐滿、羞慚」三面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从心典聲：慚愧（《說文》「青徐謂慙曰㥏」）。</p>
<h3>横向对照</h3>
<p>同取典部「厚重、豐滿、羞慚」一面：肉取其厚，心取其慙，水取其濁。</p>
<h3>声母义</h3>
<p>t取涂突：心厚而慙。</p>
