<h2>窻 <small>chuāng</small></h2>
<h3>释义</h3>
<p>【第513部「悤部」】悤＝甲骨文从心从十，十倍於常心之跳，本義心跳急速（《廣韻》「速也」）；又取心統率全身血管，引申統領聚束（分化為總）；小篆加囪為聲；音源讀作「十」，後與「蔥」混同。</p>
<h3>声母拟态</h3>
<p>ch取刺持：穴穿而通。</p>
