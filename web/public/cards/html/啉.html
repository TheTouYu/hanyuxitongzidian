<h2>啉 <small>lán</small></h2>
<h3>释义</h3>
<p>【第593部「林部」】林＝二木並立（《說文》「平土有叢木曰林」），借音字，義音同「廩」（聚集）；轉義 眾多盛大、郊野、陰暗；本批取「林木茂密、遮蔽浸漬、幽深」一面。</p>
<h3>声母拟态</h3>
<p>l取拢离：聲聒而拢。</p>
