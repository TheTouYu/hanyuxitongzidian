<h2>晶 <small>jīng</small></h2>
<h3>释义</h3>
<p>【第499部部首字·一級字根】从日的三疊。“日”，指太陽。三疊，指三顆或多。指多，則象意星光點點。也可謂星星的象形字。由于甲骨文“日”或省去裏面部分，導致“晶”跟“厽”相混，因此才疊加“生”作“曐（xīng）”，《說文》：“萬物之精，上為列星。从晶生聲。一曰象形。从口，古口複注中，故與日同。古文星。，曐或省。桑經切。”其實，“晶”也可表聲。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
