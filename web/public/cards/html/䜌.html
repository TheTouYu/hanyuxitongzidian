<h2>䜌 <small>luán</small></h2>
<h3>释义</h3>
<p>【第446部部首字·一級字根】从絲从言。指繅絲時，繭開抽絲如口中吐詞，綿綿不絕。表示繅絲之意。《天工開物·治絲》記述繅絲過程：“鍋煎極沸湯，絲粗細視投繭多寡，窮日之力一人可取三十兩。若包頭絲，則只取二十兩，以其苗長也。凡綾羅絲，一起投繭二十枚，包頭絲只投十餘枚。”luán，《集韻》：“亂也。理也。”今作部件時，簡化作“亦”。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
