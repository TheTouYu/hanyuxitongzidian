<h2>蜥 <small>xī</small></h2>
<h3>字根本義</h3>
<p>部首析（㭊扸斨<img class="cim" src="/glyphs/chars/23094.png">xī）：从斤从木——可以象意砍伐樹木，也可以指砍破木頭；《說文》「破木也。一曰折也」（先激切）。轉義：由砍開木頭，引申指分開、分散、割裂（《廣韻》分也）。音源：音源字，源自木裂之聲；因有分散之義，義音同「斯」（《集韻》「蜤，蟲名，《爾雅》蜤螽蜙蝑」通作斯）。字族衍義：指砍伐，表示分開。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該部有「▲蜥蜴斷尾」圖，可參。</p>
<h3>形旁声旁</h3>
<p>从虫析聲，《說文》「蜥易也」（先擊切）；遇急則斷尾求生。</p>
<h3>横向对照</h3>
<p>主組之要：斷尾正是「剖分」在蟲身上的活例，以虫定落點。</p>
<h3>声母义</h3>
<p>x「續消」取「消」：斷尾而存。</p>
