<h2>殸 <small>qìng</small></h2>
<h3>释义</h3>
<p>【第591部部首字·一級字根】甲骨文从声从殳。“声”从“屮、石”，表示用草繩系懸的石塊；“殳”，指持槌敲擊。象意敲擊懸挂的石塊。“磬（qìng）”的初文，《說文》：“樂石也。从石、殸。象懸虡之形。殳，擊之也。古者毋句氏作磬。，籀文省。，古文从巠。苦定切。”《集韻》：“撃石聲。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 q（擬態「亲缺」），取「缺」一面；本部未列 02z 表，按緒論推。</p>
