<h2>村 <small>cūn</small></h2>
<h3>释义</h3>
<p>【第606部「寸部」】寸＝象事字，在「又」（手）之下加一指示符，指手掌下的寸口（診脈處）；古人以手為尺，稱「同身寸」；引申思量（忖）、短、截斷，又由曲肘引申聚束、包裹。</p>
<h3>声母拟态</h3>
<p>c取刺持：聚落而持。</p>
