<h2>亶 <small>dǎn</small></h2>
<h3>释义</h3>
<p>【第592部「冬部」·亶族】亶＝甲骨文从它从㐭（它＝蛇，㐭＝挂在高处），蟺（蟮、黄鳝）之初文；黄鳝无鳞→袒露（但、袒、襢）；栖泥洞钻行→難行不進（邅）；色赤黄→檀；辨证《说文》「多谷也，从㐭旦声」据战国加旦声之篆文，形义均不确（亶无「多谷」用例）；音源本㐭声，因袒义而义音同「旦」。</p>
<h3>声母拟态</h3>
<p>d「囤动」取「囤」：穀多而囤。</p>
