<h2>戈 <small></small></h2>
<h3>释义</h3>
<p>【第41部部首字·一級字根】象橫刃有柄的長戈形。指戈。一種古代兵器，主要盛行于商周時代。gē，《玉篇》：“平頭戟，長六尺六寸。”</p>
<h3>声母拟态</h3>
<p>聲母義（戈部）：声母义（g·强） 辨證：由于小篆“弋”跟“戈”大部分相同，故《說文》：“平頭<img class="cim" src="/glyphs/chars/229e2.png">也。从弋，一橫之。象形。凡戈之屬皆从戈。古禾切。”“戈”本是完整的象形字。而“弋”本指木橛或系有丝线的箭，跟戈没有关系。故析形不确。</p>
