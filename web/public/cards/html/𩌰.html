<h3>释义</h3>
<p>【第594部「彡部」】參系：參本象簪滿珠玉髮飾之跪人，本義插簪，引申參差、眾多、細長垂飾。</p>
<h3>声母拟态</h3>
<p>sh取失收：鞍垂而收。</p>
