<h2>剌 <small>là</small></h2>
<h3>释义</h3>
<p>【第574部部首字·一級字根】甲骨文从刀从，亦聲。“”，即“<img class="cim" src="/glyphs/chars/257a5.png">”，《說文》：“黍穰也。”脫了粒的秸稈束。从“刀”，象意利用秸稈的粗糙和韌性，對物體進行刮擦、拋光。“揧（là）”的初文，《廣韻》：“研破。”與“厲”的含義差不多。所从“<img class="cim" src="/glyphs/chars/257a5.png">”，《集韻》：“或从厲。”“厲”本指磨礪。或指割。lá，《漢典》：“割開；劃開。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
