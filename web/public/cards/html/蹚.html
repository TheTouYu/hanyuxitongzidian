<h2>蹚 <small>tāng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·堂系（二级字根）】堂（坣㙶）＝从土尚聲：「尚」敞開敞亮，「土」象用土築成的高臺（《玉篇》「土爲屋基也」），或指空闊高大的殿堂（《說文》「殿也」）；轉義顯明、高大（《釋名》「堂，猶堂堂，高顯貌也」）。字族三面：堂之空（顯明空闊）／堂之高（撐起抵距）／堂之聲（鼓鐘之聲）。</p>
<h3>声母拟态</h3>
<p>t取涂突：足蹚而突。</p>
