<h2>䵧 <small>zài</small></h2>
<h3>字根本义</h3>
<p>【才部·<img class="cim" src="/glyphs/chars/2298f.png">声】「<img class="cim" src="/glyphs/chars/2298f.png">（<img class="cim" src="/glyphs/chars/22992.png">）」从戈才声：「才」指花果之梗，从戈表用戈割取，本义采摘花果；转义伤害（《说文》「伤也」，祖才切）。字族衍义：①指梗，表示承载 ②指采摘，表示受伤害之后的剩余。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿才部有「▲花的结构图」「▲桃花汛期的壶口瀑布」可参。</p>
<h3>形旁声旁</h3>
<p>《集韵》「染也」——以染料渍之。</p>
<h3>横向对照</h3>
<p><img class="cim" src="/glyphs/chars/2298f.png">族②之染：以「黑」定其色，割取草木以染。</p>
<h3>声母义</h3>
<p>z「凿总」取「总」：色总于布。</p>
