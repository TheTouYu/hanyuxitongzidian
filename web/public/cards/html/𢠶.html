<h2><img class="cim" src="/glyphs/chars/22836.png"> <small>huàn</small></h2>
<h3>字根本义</h3>
<p>【443 卝部】卝（guàn/kuàng）＝商金文人头上两角，指少年「總角」发式；轉義：幼稚→未冶炼的矿石（矿）。辯證：丱、卝、<img class="cim" src="/glyphs/chars/26af3.png">同源，楷化多混「艹」（卝多作声符、艹多作形符）。音源：借音，总角如鹭之冠羽。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韻》「患，或作<img class="cim" src="/glyphs/chars/22912.png">」——忧患。</p>
<h3>横向对照</h3>
<p>同取卝部「总角／门闩穿连」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>h「豁活」取「活」：忧结而活。</p>
