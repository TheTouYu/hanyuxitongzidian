<h2>老 <small>lǎo</small></h2>
<h3>释义</h3>
<p>【第544部部首字·一級字根】甲骨文象戴帽拄杖的老人之形。頭部或从“未”，“未”指末梢，表示老人的頭髮稀疏之狀。lǎo，《玉篇》：“壽也。”《廣韻》：“耆老。”《論語·季氐》：“及其老也，血氣既衰，戒之在得。”邢邴疏：“老 ，謂五十以上。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
