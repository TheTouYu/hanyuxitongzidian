<h2>鱕 <small>fān</small></h2>
<h3>字根本义</h3>
<p>【434 釆部·番支】番＝簸箕簸扬、筛出杂质（播之初文），字族取「翻动、淘洗、盘绕」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》引《南越志》——鼻有横骨如鐇、缘有锯齿的大鱼（锯鲨类），能使船翻。</p>
<h3>横向对照</h3>
<p>同取番部「簸扬翻动、淘洗盘绕」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>f取分：鳍分如锯。</p>
