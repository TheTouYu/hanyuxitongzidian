<h2>戶 <small>hù</small></h2>
<h3>释义</h3>
<p>【第279部部首字·一級字根】象單扇門形。一般為偏房或室內的門。hù，《六書精薀》：“室之口也。凡室之口曰戶，堂之口曰門。內曰戶，外曰門。一扉曰戶，兩扉曰門。” 《玉篇》：“所以出入也。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 hù；未列 02z，按緒論取一面未判（02z 未收）。</p>
