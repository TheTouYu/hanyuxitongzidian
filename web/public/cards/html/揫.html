<h2>揫 <small>jiū</small></h2>
<h3>释义</h3>
<p>【第540部「秋部」】秋＝蟋蟀象形借為秋季，另造从禾从炅之秋（禾穀成熟）；轉義焦枯、悲愁、時節、聚束。</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：束聚而决。</p>
