<h2>撀 <small>gòu</small></h2>
<h3>释义</h3>
<p>【第591部「殸部」】殸＝擊懸石（磬之初文）；字族第二面＝磬懸空不著物，取「空、盡」之義；第三面＝形近字「㱿」之訛。</p>
<h3>声母拟态</h3>
<p>g取隔估：擠而隔。</p>
