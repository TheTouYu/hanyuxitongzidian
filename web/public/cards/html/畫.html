<h2>畫 <small>huà</small></h2>
<h3>释义</h3>
<p>【第43部部首字·一級字根】甲骨文从从聿或尹，亦聲。象兩腳規形，用于測量、畫圓，應為“規”的初文；从“聿”或“尹”，指刀筆之類工具；象意用刀筆之類工具描畫或刻畫。西周金文从“周”或“琱”，指雕畫。huà，《釋名》：“畫，挂也。以五色挂物象也。”《玉篇》：“形也、繪也、雜五色綵也。”</p>
<h3>声母拟态</h3>
<p>聲母義（畫部）：声母义（h·强） 辨證：戰國古文將所从“周”訛變成“田”，小篆承襲古文，故《說文》：“界也。象田四界。聿，所以畫之。凡畫之屬皆从畫。，古文畫省。，亦古文畫。胡麥切。”析形不確。</p>
