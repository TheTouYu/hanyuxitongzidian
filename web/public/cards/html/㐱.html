<h2>㐱 <small>zhěn</small></h2>
<h3>释义</h3>
<p>【第594部「彡部」】㐱（二級字根）＝从人从彡，彡亦聲：从「人」指人身上的毛髮、皺紋、疙瘩、斑點、氣色、脈息等一切細微生理特徵；「診」之初文。《說文》「稠髮也」失之片面——指髮者別為「髟」。轉義 顯明、告示、驗視。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「凿」：細徵而凿。</p>
