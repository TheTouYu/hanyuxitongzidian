<h2><img class="cim" src="/glyphs/chars/281f3.png"> <small>cù</small></h2>
<h3>字根本义</h3>
<p>【464 尤部】尤＝从「又」的指头部分加一，象事字，指多出一指（枝指），为「肬」之初文；转为特异、突出、过失、怨恨；音源仍同「又」；辩证：小篆讹为从乙，《说文》析形不确。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从足尤声——《龙龛》「俗；蹙，正」，迫、急、近。</p>
<h3>横向对照</h3>
<p>同取尤部「多出、突出」一面，形符各定落点：人与魚馬取突出之状，水系、糸系取名物，足与辵取迫近。</p>
<h3>声母义</h3>
<p>c「亲缺」取「亲」：迫而亲。</p>
