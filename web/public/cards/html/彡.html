<h2>彡 <small>shān</small></h2>
<h3>释义</h3>
<p>【第594部部首字·一級字根】“三”是三根算籌的排列之形，表示數字三。sān，《說文》：“天地人之道也。从三數。凡三之屬皆从三。，古文三，从弋。穌甘切。”但也可視為“一”的三疊，从而表示多的意思。因以其為聲旁的衍生字多寫作“彡”，如“參”。故以“彡”為部。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
