<h2>襲 <small>xí</small></h2>
<h3>字根本义</h3>
<p>【483 龖部】龖＝从龍之二疊，龍本指閃電，二疊表極致，象強烈的電閃雷鳴（震，龖之赫，霆之砉）；音源借音，因亮如彗星而義音同「習」（古龖、習、聶可通）。部內从龖諸字取「重疊、震懾」二面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从衣龖省聲：衣上加衣為重衣，引申因襲、襲擊、沿襲。</p>
<h3>横向对照</h3>
<p>同取龖部「電光重疊、震懾人心」两面：衣取其重，心取其懼。</p>
<h3>声母义</h3>
<p>x「续消」取「续」：衣重相續。</p>
