<h2>槸 <small>yì</small></h2>
<h3>释义</h3>
<p>丮部（第375部）部头「丮」象两手同时拾掇、作复杂劳作之形。本部内分两支：一为「孰（<img class="cim" src="/glyphs/chars/263e7.png">）」，从亯（祭坛）从丮，象在祭坛合手奉献祭品，本义祭祀，引申熟食、烂熟、谁、熟悉（原稿倾向以丮为声，非《說文》所云亯声）；一为「埶」，从丮从屮木，象种植移栽或竖木测影，引申技能（蓺、藝），字族多指竖起、举起。</p>
<h3>声母拟态</h3>
<p>两木相摩如相植而立，取竖而相抵之象。</p>
