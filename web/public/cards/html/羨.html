<h2>羨 <small>xiàn</small></h2>
<h3>字根本义</h3>
<p>【486 美部】美＝象人頭上用羽毛或羊角等裝飾之形，象意儀容裝扮好看，本義美善（《廣韻》「好色」）；轉義為讚美、美好、甘美。部內从美諸字皆取「裝飾好看、因好而欲」兩面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从羊从㳄（涎）：見羊肉而垂涎，本義貪欲、羨慕，引申有餘。</p>
<h3>横向对照</h3>
<p>同取美部「裝飾好看、因好生欲」兩面：女取其色，羊取其涎。</p>
<h3>声母义</h3>
<p>x「续消」取「续」：涎續而羨。</p>
