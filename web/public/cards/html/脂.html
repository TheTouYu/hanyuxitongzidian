<h2>脂 <small>zhī</small></h2>
<h3>释义</h3>
<p>从肉旨聲：有角動物的脂肪（《說文》「戴角者脂，無角者膏」）；取旨之甘美滑潤義，故从肉。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「总」：有角動物的脂肪總聚於肉中，滑而潤。</p>
