<h2>齊 <small>qí</small></h2>
<h3>释义</h3>
<p>【第19部部首字·一級字根】从的三疊。象蒺藜的刺球果實形；三疊，象意蒺藜果的多。“薺（cí）”的初文。《說文》：“薺，蒺棃也。从艸齊聲。《詩》曰：‘牆有薺。’疾諮切。又徂禮切。”</p>
<h3>声母拟态</h3>
<p>聲母義（齊部）：声母义（q·强） 辨證：《說文》：“禾麥吐穗上平也。象形。凡亝之屬皆从亝。徂兮切。（注）徐鍇曰：生而齊者莫若禾麥。二，地也。兩傍在低處也。”“禾麥”應非其本義。禾麥之實雖有芒如刺，但顆粒橢圓，不為菱形；而其穗更是長條。故所析不確。</p>
