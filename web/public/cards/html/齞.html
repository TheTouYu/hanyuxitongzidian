<h2>齞 <small>yǎn</small></h2>
<h3>释义</h3>
<p>从齒只聲：口張齒見、齒露唇外（齙牙）；取只之尖出义，故从齒。</p>
<h3>声母拟态</h3>
<p>y 为零声母，绪论七组未列，不系（照实）。</p>
