<h2>嘯 <small>xiào</small></h2>
<h3>字根本义</h3>
<p>【427 聿部·肅】肅＝持篙撑船渡深水旋流；本义疾速，转义严峻、谨慎恭敬。字族两支：①撑篙→细长深长（木长、竹管、长股）②撑船→浮行泛飞。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「吹声也」——蹙口出声，长啸；又叱喝。</p>
<h3>横向对照</h3>
<p>同取肃部「篙入深流」的细长、清深、疾速一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>x取消：声长而消。</p>
