<h2>掌 <small>zhǎng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」·掌系（二级字根）】掌（牚<img class="cim" src="/glyphs/chars/2397a.png">䟫）＝从手尚聲：本義手掌（《說文》「手中也」），即「手」之攤平者；轉義以掌持物→掌管、主持；又掌之平展→支撐（牚、撐）。字族三面：手掌所為／支撐抵距／平展覆蓋。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「总」：掌合而總。</p>
