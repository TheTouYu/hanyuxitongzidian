<h2>长 <small>cháng</small></h2>
<h3>释义</h3>
<p>【第537部部首字·一級字根】甲骨文象人長髮而拄杖之形，表示年齡大之意。zhǎng，《廣雅》：“老也。”《廣韻》：“大也。”所拄杖也可以指權杖，則表示手持權杖的首領之意。《廣雅》：“君也。”《玉篇》：“主也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
