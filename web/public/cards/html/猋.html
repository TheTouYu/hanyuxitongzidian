<h2>猋 <small>biāo</small></h2>
<h3>释义</h3>
<p>【第154部部首字·一級字根】从犬的二疊或三疊。“犬”，指狗；疊體，表示極致。古時候的狗多用于狩獵，故象意群犬狂奔。biāo，《說文》：“猋，犬走皃。从三犬。甫遙切。”《廣韻》：“群犬走皃。”《字彙》：“犬疾走貌。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
