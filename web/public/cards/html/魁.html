<h2>魁 <small>kuí</small></h2>
<h3>字根本义</h3>
<p>【471 鬼部】鬼＝甲骨文从甶（面具）从人，象人戴面具之形；由面目不可辨而表示死者魂魄（鬼之言歸也）；音如蛙鳴（蛙無項，如戴面具），民間巫術以蛙充魂。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从鬼斗声：羹斗之大者，引申首領、魁偉、魁星。</p>
<h3>横向对照</h3>
<p>同取本部「覆扣成器／面具不可辨」两面：瓦旁定陶器，鬼旁定魂魄可畏。</p>
<h3>声母义</h3>
<p>k「口控」取「控」：首控眾。</p>
