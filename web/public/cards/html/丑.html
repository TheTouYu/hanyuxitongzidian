<h2>丑 <small>chǒu</small></h2>
<h3>释义</h3>
<p>【第299部部首字·一級字根】象屈指之形。彎曲手指，一般是抓扣時所呈現的樣子。本為“扭（niǔ）”的初文，表示揪住、擰轉之意。《正字通》：“《六書故》：‘丑，孥九切。手扭取物也’。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
