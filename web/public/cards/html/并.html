<h2>并 <small>bìng</small></h2>
<h3>释义</h3>
<p>【第132部部首字·一級字根】甲骨文从从的腿部加一畫或兩畫形。既可象意將眾人連在一起，表示並聯。bìng，《廣雅》：“兼也。同也。”也可象意眾人的行走受到限制。“屏”的初文。bīng，《廣韻》：“屏盈，徬徨。”“从”或作“北”，意思相同。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
