<h2>肸 <small>xì</small></h2>
<h3>釋義</h3>
<p>肸xì《說文》：“響，布也。从十，从䏌。羲乙切。（注）臣鉉等曰：䏌，振䏌也。”《康典》：“《前漢·司馬相如傳》：肸蠁布寫。（注）肸蠁，盛作也。又《揚雄傳》：薌呹肸以掍根兮，聲駍隱而曆鐘。（注）言風之動樹，聲響振起眾根，合同駍隱，而盛曆入殿上</p>

<p>聲旁為「䏌」，其古文字字形、本義、轉義、辯證、音源、字族衍義見字根卡「䏌」（本頁會自動鏈接呈現）。</p>
