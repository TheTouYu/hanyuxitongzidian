<h2>永 <small>yǒng</small></h2>
<h3>释义</h3>
<p>【第524部部首字·一級字根】“永、<img class="cim" src="/glyphs/chars/200a2.png">”本同源，从人从彳或行，行亦聲。象意人行于道，表示道路之遠。yǒng，《玉篇》：“長也。引也。逺也。遐也。”或加水，表示在水裏潛行，“泳（yǒng）”的初文，《說文》：“潛行水中也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yǒng）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
