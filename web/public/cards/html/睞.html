<h2>睞 <small>lài</small></h2>
<h3>释义</h3>
<p>【第576部「來部」】來（麦）＝甲骨文象麥有穗、莖、葉、根之形；麥秋種夏收，反於他穀，故加夊（倒止）作「麥」。轉義 適時、趕上、勤勞、賜予；音源為借音（義音同里、斤、豈、力）。</p>
<h3>声母拟态</h3>
<p>l取拢离：目側而离。</p>
