<h2>喪 <small>sàng</small></h2>
<h3>释义</h3>
<p>【第531部「桑部」·喪系（二级字根）】喪（丧䘮）＝甲骨文从吅从桑：「吅」眾口，象群蠶食桑；眾蠶食桑如白衣人匍匐哭喪，故引申失去、死亡（《廣韻》「亡也、死喪也」）、喪事。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：亡而收。</p>
