<h2>恭 <small>gōng</small></h2>
<h3>释义</h3>
<p>【第502部「<img class="cim" src="/glyphs/chars/20b1e.png">部」】<img class="cim" src="/glyphs/chars/20b1e.png">＝兩手拱舉；字族衍義多指拱手之狀，恭＝自拱持而肅；恭从<img class="cim" src="/glyphs/chars/20b1e.png">得聲，歸<img class="cim" src="/glyphs/chars/20b1e.png">部。</p>
<h3>声母拟态</h3>
<p>g「隔估」取「隔」：敬而相隔。</p>
