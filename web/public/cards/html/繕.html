<h2>繕 <small>shàn</small></h2>
<h3>字根本义</h3>
<p>【493 善部】善＝甲骨文象目上有角之形，象意牛羊鹿等有角類動物的頭部；借音字，角狀如「干」，故義音同。本義美好、善良，引申擅長、喜愛。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从糸善聲：修補使之完善（《說文》「補也」）。</p>
<h3>横向对照</h3>
<p>善部取「有角獸頭、美善」一面，旦部取「日出見影」一面；形符各定落點。</p>
<h3>声母义</h3>
<p>sh取收：綴收而繕。</p>
