<h2>颯 <small>sà</small></h2>
<h3>字根本义</h3>
<p>【429 立部】立＝从大从一，大象人跨立、一为地面，象事指人站立、到临、占据某处不动；《说文》「住也」。转义：站不久→即刻、马上；占据→存在、成就；又通粒、位。音源：借音字，义音同「异」（翼/翌），立如握笔亦通「聿」。字族两支：①站立竖起②颗粒摧折。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「翔风也」——回旋之风。</p>
<h3>横向对照</h3>
<p>同取立部「人／物直立不动」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>s「失收」取「收」：风回而收。</p>
