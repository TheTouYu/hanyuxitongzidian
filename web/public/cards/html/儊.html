<h2>儊 <small>chù</small></h2>
<h3>字根本义</h3>
<p>【407 足部·楚（二级）】楚（椘檚䠂<img class="cim" src="/glyphs/chars/23551.png"><img class="cim" src="/glyphs/chars/235c2.png">chǔ）：从林从疋（足）——「林」指荆楚丛木，「疋」指腿脚，象意人走入丛木之中，为枝条所阻滞。轉義：由絆足阻滞→阻碍、滞涩；由丛木之刺→痛楚、酸楚；由荆条之用于笞打→呵斥、痛楚。字族衍义：①指楚的絆足，表示阻碍、滞涩 ②指楚的笞打，表示呵斥、痛楚。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《廣韻》「不滑也」——不滑、滞涩。</p>
<h3>横向对照</h3>
<p>阻涩族①之人：以「人」定其状，行而不滑。</p>
<h3>声母义</h3>
<p>ch「刺持」取「持」：持而滞。</p>
