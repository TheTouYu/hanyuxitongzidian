<h2>芕 <small>sháo</small></h2>
<h3>釋義</h3>
<p>芕（芍䒘）sháo《本草綱目》：“野芕草。《摘<img class="cim" src="/glyphs/chars/248e5.png">方》：治痞滿。”疑“芍”字之訛，指荸薺、芍藥、蓮子。suī，《康典》：“《玉篇》《集韻》：<img class="cim" src="/glyphs/chars/20024.png">同荽。”《漢典》按：“查《玉篇》《集韻》，‘同荽’的字均作‘䒘’，不作‘芕’。《康典》誤。”</p>
<h3>字理分析</h3>
<p>聲旁為「夕」，其古文字字形、本義、轉義、辯證、音源、字族衍義見字根卡「夕」（本頁會自動鏈接呈現）。</p>
<h3>聲母擬態</h3>
<p>今讀 sháo：按聲母取緒論擬態義一面（細辨見字根卡「夕」）。</p>
