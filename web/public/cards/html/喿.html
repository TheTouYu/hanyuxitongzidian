<h2>喿 <small>zào</small></h2>
<h3>释义</h3>
<p>【第584部部首字·一級字根】从品从木。“木”，指樹；从“品”，指眾口。象意蟲、鳥、獸等眾多動物在樹上鳴叫。實即“噪（zào）”的初文，《玉篇》：“呼噪也。”《集韻》：“喿，或从口。亦作<img class="cim" src="/glyphs/chars/20e4f.png">。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 z（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
