<h2>袸 <small>jiàn</small></h2>
<h3>字根本义</h3>
<p>【才部·存声】「存」从子才声：「子」指小孩，「才」指才能，表小孩能力之有限与潜在；《集韵》「在也」、《玉篇》「有也」。转义：由小孩能力有限，引申需照看培育（《说文》「恤问也」）。字族衍义：多指反复、重叠、再三。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿才部有「▲花的结构图」，<img class="cim" src="/glyphs/chars/2298f.png">族有「▲《种竹斋》局部（明 仇英）」。</p>
<h3>形旁声旁</h3>
<p>《类篇》「衣带」；《玉篇》「褰脬衣」；zùn《集韵》「衣衿」——衣襟、衣带。</p>
<h3>横向对照</h3>
<p>存族⑥：以「衣」定其处，重复缠结。</p>
<h3>声母义</h3>
<p>j「聚决」取「聚」：衣聚而系。</p>
