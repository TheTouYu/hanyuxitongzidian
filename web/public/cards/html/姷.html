<h2>姷 <small>yòu</small></h2>
<h3>字根本义</h3>
<p>【463 又部·余支】又有持肉、园囿、走摆诸面：囿以垣养禽兽而引申局限；賄为财货；姷、酭皆酬报相助；䞥、迶皆行走摆手之状。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从女有声——《说文》「耦也」，相助；或从人作侑。</p>
<h3>横向对照</h3>
<p>同取又部「持、围、走」诸面，形符各定落点：贝与酉主财与酬，走与辵主动，穴主空。</p>
<h3>声母义</h3>
<p>y取柔：相助而柔。</p>
