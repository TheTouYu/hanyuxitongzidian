<h2>覼 <small>luó</small></h2>
<h3>释义</h3>
<p>覼，luó：好视、委曲（从見，取层叠繁细）（原稿字族表摘要）</p>
<h3>声母拟态</h3>
<p>l「拢离」取一面：與本義相協（推）。</p>
