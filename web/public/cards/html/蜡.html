<h2>蜡 <small>zhà</small></h2>
<h3>释义</h3>
<p>蜡，zhà：从虫昔聲，《說文》「蠅膽也」；古又为年终大祭之名（蜡祭，合聚百物而祭）。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「总」：合聚百物而总（推）。</p>
