<h2>乃 <small>nǎi</small></h2>
<h3>释义</h3>
<p>【第265部部首字·一級字根】甲骨文象女性乳房的側面輪廓形。“奶”的初文。nǎi，《正字通》：“嬭，乳也。又乳母。按本借乳俗讀乃，改作奶。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 n（擬態「纳弄」），取「弄」一面；本部未列 02z 表，按緒論推。</p>
