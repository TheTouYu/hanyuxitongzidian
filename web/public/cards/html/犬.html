<h2>犬 <small></small></h2>
<h3>释义</h3>
<p>【第88部部首字·一級字根】象狗形，指狗。quǎn，《說文》：“狗之有懸蹏者也。象形。孔子曰‘視犬之字如畫狗也。’凡犬之屬皆从犬。苦泫切。”</p>
<h3>声母拟态</h3>
<p>聲母義（犬部）：声母义（q·中） 辨證：由于“犬”的字形跟“火、犮、大、九”等相近，或存在訛混的現象。其字族需根據字音和字義加以辨析。</p>
