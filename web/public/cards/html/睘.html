<h2>睘 <small>qióng</small></h2>
<h3>字根本义</h3>
<p>【478 袁部】袁＝甲骨文从衣从又（又指手），象脫衣之狀，如沒有穿衣的人，或在上面加「○」表其頭圓並兼聲；是「猿」的初文（猩猩、長臂猿，體大無頰囊無尾，更像人）。因猿善攀援，引申攀援、遙遠。音源字，取猿猴叫聲。部内「睘」从目袁聲，本指猴面鷹（草鴞）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从目袁聲：猴面鷹（草鴞），臉盤如猿、目不能轉須轉頸270°；引申驚視、憂愁孤獨。</p>
<h3>横向对照</h3>
<p>同取袁部「脫衣似猿、攀援致遠」两面：辵取其遠，囗取其圍，犬取其形，目取其驚視。</p>
<h3>声母义</h3>
<p>q「亲缺」取「亲」：轉頸而親。</p>
