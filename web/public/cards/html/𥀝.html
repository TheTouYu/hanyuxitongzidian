<h2><img class="cim" src="/glyphs/chars/2501d.png"> <small>niǔ</small></h2>
<h3>释义</h3>
<p>㐁部（第374部）部头：甲骨文象有斜纹的编织品，指席子；引申竹皮、无光；战国后㐁、因相混，㐁只作构件存席形；音源借音，义音同「簟」。本部「宿」声一系，取席可卷可收之象，故多收缩、捆敛、迫促之义。</p>
<h3>声母拟态</h3>
<p>皮皱即收，虽训未定，仍归收缩一系。</p>
