<h2>弔 <small>diào</small></h2>
<h3>释义</h3>
<p>【第29部部首字·一級字根】象人身上纏著弋線之形。指有線繩的箭，即弋；指人。弋線繩委于人，象意弋射出去後的回收。後或楷化作“吊”，《字彙》：“俗弔字。”可謂“鈟（diào）”的異文，《字彙》：“同釣。”《說文》：“釣，鉤魚。”</p>
<h3>声母拟态</h3>
<p>聲母義（弔部）：声母义（d·强） 辨證：由于小篆將演變作弓形，故《說文》：“問終也。古之葬者，厚衣之以薪。从人持弓，會驅禽。多嘯切。”析形不確。</p>
