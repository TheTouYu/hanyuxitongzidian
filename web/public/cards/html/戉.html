<h2>戉 <small>yuè</small></h2>
<h3>释义</h3>
<p>【第211部部首字·一級字根】象鉞形。跟戈只是鋒刃上的不同：戈是橫刃，主要用于戰車作戰時的拖割；鉞（戉）刃如彎月，跟現在的斧頭差不多。yuè，《正字通》：“ 斧之長柲者。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yuè）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
