<h2>踩 <small>cǎi</small></h2>
<h3>字根本义</h3>
<p>【采部余字】部首采（cǎi）：甲骨文从爪从木，象意采摘树上的果实或叶子；《说文》「捋取也」。轉義：选择、获取；采桑柞饲蚕、采草木染布故引申色彩；采以为食故引申采食之地、封地乃至坟墓。音源：源自采摘声。字族衍义：①采以为食 ②采以为染料 ③采摘行为。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿该部有「▲战国铜器上的采桑纹饰」可参。</p>
<h3>形旁声旁</h3>
<p>《篇韵》「音葵，跳也。又音劣，义同」；cǎi 践踏——以足着地而取径，是采摘之手移到脚下。</p>
<h3>横向对照</h3>
<p>主组③之足：以「足」定其落点，践踏如采撷般直取。</p>
<h3>声母义</h3>
<p>c「刺持」取「刺」：足刺地而行。</p>
