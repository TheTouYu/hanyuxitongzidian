<h2>謑 <small>xǐ</small></h2>
<h3>释义</h3>
<p>謑（䜁）xǐ《說文》：“恥也。从言奚聲。，謑或从奊。胡禮切。”《玉篇》：“謑詬，恥辱也。”《集韻》：“謑詬，小人怒。”xià，《廣韻》：“怒言。”xí，《集韻》：“謑髁，不正皃。”</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：恥辱連綿在心（推）。</p>
