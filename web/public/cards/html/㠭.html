<h2>㠭 <small>zhǎn</small></h2>
<h3>释义</h3>
<p>【第139部部首字·一級字根】从口从二丁。“口”，指嘴，表示敞開、裂開之物。“丁”，本指釘子；二疊，表示許多。象意用釘子固定而使之敞開，表示舒展、展開。一般用于處理皮革之類。攤開風乾或加工皮革時，為防止其捲曲，需要用釘子將其固定在某一平面上。“展（zhǎn）”的初文。《玉篇》：“㠭，今作展。”《集韻》：“展，舒也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
