<h2>屯 <small>tún</small></h2>
<h3>释义</h3>
<p>【第288部部首字·一級字根】象種子發芽形。“”象新生的葉片與根，中間鼓出的部分象開口發芽的種子母體。“芚（tùn）”的初文，《集韻》：“木始生皃。《楊子》：‘春木之芚兮’。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
