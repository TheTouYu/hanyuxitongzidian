<h2>次 <small>cì</small></h2>
<h3>释义</h3>
<p>【第20部部首字·一級字根】从欠从冫。“冫”即冰，水凝結的樣子；“欠”指張開口。象意口水挂在嘴邊狀。与“㳄（xiàn）”本是同源字，《廣韻》：“口液也。”</p>
<h3>声母拟态</h3>
<p>聲母義（次部）：声母义（c·强） 辨證：因“二、冫”形近，故《說文》：“不前，不精也。从欠二聲。，古文次。七四切。”析形不確。</p>
