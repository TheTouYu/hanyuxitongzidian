<h2>退 <small>tuì</small></h2>
<h3>释义</h3>
<p>夂（夊<img class="cim" src="/glyphs/chars/21552.png">）：本義象腳印倒過來，指往後退、往回走；《說文》誤作「夊」，實為「退」之初文；夂夊<img class="cim" src="/glyphs/chars/21552.png">本一字，小篆分三；音源借音（同妥）；字族多指往後、阻行（p349-352）。</p>
<h3>声母拟态</h3>
<p>透母t，「涂突」取「涂」：退者徐徐卻行，如泥塗之緩。</p>
