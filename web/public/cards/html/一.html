<h2>一 <small>yī</small></h2>
<h3>释义</h3>
<p>【第14部部首字·一級字根】象一根算籌或一根手指形。指數字一。yī，《廣韻》：“數之始也，物之極也。”《說文》：“惟初太始，道立于一，造分天地，化成萬物。凡一之屬皆从一。，古文一。於悉切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第14部），無擬態聲母義可系，義靠義類與字形。</p>
