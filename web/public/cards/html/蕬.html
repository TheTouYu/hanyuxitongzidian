<h2>蕬 <small>sī</small></h2>
<h3>字根本義</h3>
<p>部頭糸（幺糹糸<img class="cim" src="/glyphs/chars/221af.png">）：从「幺」的一頭或兩頭出緒，象多股絲絞在一起的樣子，指拈出的紗線（《說文》「細絲也，象束絲之形」，莫狄切）。轉義：細微（《廣雅》微也）、連綿（《廣韻》連也）。音源：源自拈絲聲。字族衍義：①線繩之用→羈縻束縛 ②絲線→細微 ③形近「耒」之訛。</p>
<h3>字形</h3>
<p>字形：字形庫未收；原稿該條前後有「▲蕬草」圖（photos/蕬/01.jpg）。</p>
<h3>形旁声旁</h3>
<p>从艸絲聲，菟蕬（菟絲），《爾雅》「女蘿，菟絲」；或指蕬草（江南水草，葉如薤）。</p>
<h3>横向对照</h3>
<p>②絲線組：二物皆絲狀，故同取「細長如絲」。</p>
<h3>声母义</h3>
<p>s「失收」取「收」：纏繞收附於他草。</p>
