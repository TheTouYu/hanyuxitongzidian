<h2>豯 <small>xī</small></h2>
<h3>释义</h3>
<p>豯xī《方言》：“豬，其子或謂之豯。”《說文》：“生三月豚，腹豯豯皃也。从豕奚聲。胡雞切。”出生三個月的豬，大肚的樣子。</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：三月豚腹豯豯，幼小牽連（推）。</p>
