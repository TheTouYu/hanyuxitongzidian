<h2>袘 <small>yí</small></h2>
<h3>释义</h3>
<p>甲骨文本眼鏡蛇頸部皮褶兩側膨起的樣子，指眼鏡蛇。與“它、虫”同源。“虵（shé）”的初文，《唐韻》：“俗蛇字。”</p>
<h3>声母拟态</h3>
<p>喻母y（零聲母），不系。</p>
