<h2>磿 <small>lì</small></h2>
<h3>字根本义</h3>
<p>【425 秝部】秝＝从二禾，象禾苗排列稀疏，也象秸秆堆积（分化作厤）；转义：禾的春种秋收→经过（歷）、编绳→缠束（<img class="cim" src="/glyphs/chars/2774f.png">）、过滤→沥、编簟→并列夹持（兼）、作柴火→陶鬲（㽁）。音源：借音字，义音同「鬲」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「石声也。从石厤声」——石相击的细声。</p>
<h3>横向对照</h3>
<p>同取秝「排列／堆积而离析」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>l取离：声碎而离。</p>
