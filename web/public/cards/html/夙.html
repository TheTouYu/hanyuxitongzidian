<h2>夙 <small>sù</small></h2>
<h3>释义</h3>
<p>丮部（第375部）部头：甲骨文象两手同时拾掇之形，与<img class="cim" src="/glyphs/chars/20b1e.png">、共不同者，<img class="cim" src="/glyphs/chars/20b1e.png">共只两手捧提，丮则两手作复杂劳作而不可分开；《說文》「持也，象手有所丮據之形，讀若<img class="cim" src="/glyphs/chars/229e2.png">，幾劇切」。音源借音：婴儿之手多拳握，故古丮、兒可通；又义音同「㐁」，夙从丮从夕，拜月而早作。字族衍义多指操持、劳作。</p>
<h3>声母拟态</h3>
<p>拜月而夙兴，取「持事不休」一面，故「敬」亦由此出。</p>
