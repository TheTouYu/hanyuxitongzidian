<h2>竹 <small>zhú</small></h2>
<h3>释义</h3>
<p>【第65部部首字·一級字根】象竹的枝葉形，指竹子。zhú，《說文》：“冬生艸也。象形。下垂者，箁箬也。凡竹之屬皆从竹。陟玉切。”</p>
<h3>声母拟态</h3>
<p>聲母義（竹部）：声母义（zh·中）</p>
