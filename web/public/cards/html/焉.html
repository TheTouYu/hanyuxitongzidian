<h2>焉 <small>yān</small></h2>
<h3>释义</h3>
<p>【第323部部首字·一級字根】根據周武王《封比干墓銅盤》的銘文來看，本象某種大鳥之形。後从鳥从正。“正”，古以黃色為五色中的正色。故指黃鳥。yān，《說文》：“焉鳥，黃色，出于江淮。象形。凡字：朋者，羽蟲之屬；烏者，日中之禽；舄者，知太歲之所在；燕者，請子之候，作巢避戊己。所貴者，故皆象形。焉亦是也。有幹切。”《廣韻》：“鳥雜色。”《禽經》：“黃鳳謂之焉。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yān）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
