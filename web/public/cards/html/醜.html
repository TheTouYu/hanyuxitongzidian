<h2>醜 <small>chǒu</small></h2>
<h3>释义</h3>
<p>【第547部「酉部」】酉＝甲骨文象釀酒器皿（尖底瓶，插火塘餘燼保溫），「酒」之初文（《釋名》「酒，酉也」）；轉義地支第十位、農曆八月、成熟成就、雞（酉時雞歸巢）。</p>
<h3>声母拟态</h3>
<p>ch「刺持」取「持」：鬼持而醜。</p>
