<h2>蠃 <small>luǒ / luó / guǒ</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/267c0.png">＝騾（兩耳長、能馱載）。部内辯證：「蠃」之从「<img class="cim" src="/glyphs/chars/26760.png">」，只取背負為義。</p>
<h3>声母拟态</h3>
<p>來母 l，「攏離」取「攏」：殼與巢皆收攏身形之物。</p>
