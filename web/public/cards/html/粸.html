<h2>粸 <small>qí</small></h2>
<h3>字根本義</h3>
<p>部首其（jī）：甲骨文象箕形，周中期金文下加「丌」表聲兼表意（淺平如丌），戰國或从竹；《說文》「簸也」。轉義：箕主盛裝→代詞（他/它/那）；編紋呈螺旋→週期（借作期）；編結緊密→密謀（與基同）。字族衍義：①箕狀（盤踞、面具）②箕紋形（周繞、交會）③博棋（欺、謀）。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該部有「▲玉箕（漢）」「▲銀絲網格木圍棋盤（遼）」等圖，可參。</p>
<h3>形旁声旁</h3>
<p>从米其聲，《集韻》「餅屬，亦作<img class="cim" src="/glyphs/chars/2a340.png">」。</p>
<h3>横向对照</h3>
<p>①組：餅形圓扁如箕，以米定落點。</p>
<h3>声母义</h3>
<p>q「親缺」取「親」：米相親成餅。</p>
