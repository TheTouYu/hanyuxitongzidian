<h2>奄 <small>yǎn</small></h2>
<h3>释义</h3>
<p>【第322部部首字·一級字根】从申从大。“申”，指閃電；“大”，指跨步，表示遮蔽。象意烏雲覆蓋、電光閃動的情形。“<img class="cim" src="/glyphs/chars/290d7.png">（yǎn）”的初文，《集韻》：“雲氣盛也。”白居易《傷遠行賦》：“雲雷作而風雨晦，忽霉靄兮不見暘。”所描繪的就是這種情形。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yǎn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
