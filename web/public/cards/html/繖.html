<h2>繖 <small>sǎn</small></h2>
<h3>释义</h3>
<p>【第593部「林部」】㪔＝从攴从林，敲擊林木使果葉四散；繖＝从糸散聲，蓋也（《說文》新附），傘蓋。</p>
<h3>声母拟态</h3>
<p>s「失收」取「失」：蓋張而收。</p>
