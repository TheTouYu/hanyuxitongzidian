<h2>廌 <small>zhì</small></h2>
<h3>释义</h3>
<p>【第562部部首字·一級字根】象甲蟲獨角仙形，即雙叉犀金龜。雄性成蟲的頭部長有一支兩邊對稱、雙分叉的巨型觭角，好鬥，為了爭奪食物和交配權會用額角搏鬥。搏鬥的雙方會先上下晃動額角，收縮腹部發出“嘰——嘰——”聲示威，如果雙方均不退卻，它們會努力將額角插入對手的身體下方，將對手舉起掀翻。被舉起的一方即為失敗者，一般只要被舉起一次就會立即認輸逃走。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
