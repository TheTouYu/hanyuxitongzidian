<h2>䳳 <small>xù</small></h2>
<h3>释义</h3>
<p>《說文》「鳥也。从鳥祟聲。辛聿切。」《廣韻》「小鳥名」</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：《說文》「鳥也。从鳥祟聲。辛聿切。」《廣韻》——借聲之字，聲母亦摹其音（推）。</p>
