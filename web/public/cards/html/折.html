<h2>折 <small>zhé</small></h2>
<h3>释义</h3>
<p>【第369部部首字·一級字根】甲骨文从斤从木的中斷狀（春秋金文加“二”表示）。象意砍斷樹木之意。跟“析”相對，“析”為依照樹木的紋理豎砍，故為破；“折”則橫砍，攔腰截斷，故為斷木。zhé，《玉篇》：“斷也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
