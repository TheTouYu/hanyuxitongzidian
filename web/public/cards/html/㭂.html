<h2>㭂 <small>jiǎo</small></h2>
<h3>释义</h3>
<p>【第582部「小部」】小＝甲骨文象麻雀的腳印（麻雀後趾短，落地只顯前三趾），「雀」之初文；又作三點疊體表細微；引申微小、細；音源為麻雀叫聲。（部內分支：肖、雀、少、屑、尗、塵、尖）</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：木末而决。</p>
