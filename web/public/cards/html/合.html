<h2>合 <small>hè</small></h2>
<h3>释义</h3>
<p>【第75部部首字·一級字根】从亼从口。“亼”本“口”的倒寫。两口相對，可象意多種：</p>
<h3>声母拟态</h3>
<p>聲母義（合部）：声母义（h·中） 辨證：《說文》釋“亼”為：“亼（jí），三合也。从入、一。象三合之形。讀若集。凡亼之屬皆从亼。讀若集。秦入切。（注）臣鉉等曰：此疑只象形，非从入一也。”形義皆不確。</p>
