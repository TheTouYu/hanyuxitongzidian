<h2>彔 <small>lù</small></h2>
<h3>释义</h3>
<p>【第101部部首字·一級字根】象轆轤形。象轆轤架；象汲水之器；小點象水滴形。轆轤是一種提取井水的起重裝置。井上豎立井架，上裝可用手柄搖轉的軸，軸上繞繩索，繩索一端系水桶。搖轉手柄，使水桶一起一落，提取井水。也可以廣泛用于从低處上提其它東西。“<img class="cim" src="/glyphs/chars/28320.png">（lù）”的初文，《正字通》：“同轆。”“轆轤，井上汲水軸也。”</p>
<h3>声母拟态</h3>
<p>聲母義（彔部）：声母义（l·强） 辨證：《說文》：“刻木彔彔也。象形。凡彔之屬皆从彔。盧穀切。”析形不確。</p>
