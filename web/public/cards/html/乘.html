<h2>乘 <small>chéng</small></h2>
<h3>释义</h3>
<p>【第167部部首字·一級字根】甲骨文从大从木。“大”指跨立；“木”既可指樹木，也可指木製品。“木”或作，“木”沒有上部，意即木製品。跨立在別的木製品上，沒什麼意義，應該是指跨立在車廂中，指乘車。所以，戰國古文或變“木”為“几”，或下加“車”。chéng，《集韻：“車也。”《韻會》：“乘者，載也。”《廣韻》：“駕也，登也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
