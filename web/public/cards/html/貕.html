<h2>貕 <small>xī</small></h2>
<h3>释义</h3>
<p>貕xī《揚子·方言》：“豬子或謂之豚，或謂之貕。”</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：豬子牽連成群（推）。</p>
