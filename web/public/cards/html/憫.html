<h2>憫 <small>mǐn</small></h2>
<h3>释义</h3>
<p>【第272部「文部」】文（閔从門文聲）＝文飾；憫取傷病而憂憐；憫从文得聲，歸文部。</p>
<h3>声母拟态</h3>
<p>m取蒙末：心蒙而憫。</p>
