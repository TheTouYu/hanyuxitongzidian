<h2>文 <small>wén</small></h2>
<h3>释义</h3>
<p>【第272部部首字·一級字根】甲骨文从乂从入。“乂”指交錯的條紋；从“入”，指刺入，象意刻畫、刺繡紋飾。wén，《說文》：“錯畫也。象交文。凡文之屬皆从文。無分切。”《韻會》：“文，理也。如木有文亦名曰理。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wén）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
