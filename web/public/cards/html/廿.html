<h2>廿 <small>niàn</small></h2>
<h3>释义</h3>
<p>十部部头甲骨文象竖置的算筹，表数字十；十进为用数之极，引申完备、极点、十倍很多；《說文》以「一为东西、ㄧ为南北、四方中央备矣」析形不确，战國古文中间加粗演为一横。</p>
<h3>声母拟态</h3>
<p>两十相并，取「合」一面。</p>
