<h2>蕾 <small>lěi</small></h2>
<h3>释义</h3>
<p>【118.畾部】蕾（藟蘽蕌）lěi：从艸、畾声。《玉篇》「蓓蕾，花綻皃」，《集韻》「蓓蕾，始華也」——花蕾，就是含苞未放的花。字根「畾」在原稿里是「圆形物的堆积、排列」之义（畾部字族衍义①「指磊，表示圓形物的堆積、排列」），花苞正是一颗颗圆鼓鼓地堆在枝上，所以「蕾」从畾得声、同时把这个「圆堆」的意象带进来。</p>
