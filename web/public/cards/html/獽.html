<h2>獽 <small>ráng</small></h2>
<h3>释义</h3>
<p>【第535部「襄部」】襄＝甲骨文象人头顶器皿之形（双手上举扶物），《說文》「解衣耕」析形不确；轉義上舉昂起→扶助成就→駕車→除去→捲袖肥大。音源借音（相助之義音同「相」，「襄羊」＝「相羊」）。</p>
<h3>声母拟态</h3>
<p>r取柔锐：獸銳而逐。</p>
