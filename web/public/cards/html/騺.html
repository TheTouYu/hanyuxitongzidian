<h2>騺 <small>zhì</small></h2>
<h3>释义</h3>
<p>㚔部部头甲骨文象古代桎梏（捕鸟兽之夹），两竹板捆紧、中撑开，兽足踏中即夹住；后用于拷人手腕；《說文》「从大从<img class="cim" src="/glyphs/chars/22189.png">」析形不确，战国古文与「<img class="cim" src="/glyphs/chars/21d18.png">」形近而同讹作「幸」，今楷「幸」实为五字之混。</p>
<h3>声母拟态</h3>
<p>马足被絆，取「夹住」一面。</p>
