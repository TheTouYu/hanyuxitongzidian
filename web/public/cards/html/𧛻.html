<h2><img class="cim" src="/glyphs/chars/276fb.png"> <small>suǒ</small></h2>
<h3>释义</h3>
<p>部頭索：甲骨文象繩索形，字有多體——或作「屮串」「木串」「竹串」，指用草莖、麻皮、竹篾、藤條、樹皮搓成的繩索；加「又、<img class="cim" src="/glyphs/chars/20b1e.png">」表用手搓，或加「幺、糸」表用絲線搓。轉義：單調單獨（索然、離群索居，《廣雅》「獨也」）；搜求討取（探索、索取）、法度；散（《玉篇》「散也」）、盡空（《廣韻》「盡也」）。辯證《說文》「从<img class="cim" src="/glyphs/chars/233b5.png">糸」據小篆不確；一〇是束、兩〇是串，捆束與成串義別。音源：音源字，源自搓繩聲。字族①索狀長條②索用搜索③索聲連續。</p>
<h3>声母拟态</h3>
<p>心母s，「失收」取「收」。</p>
