<h2>誡 <small>jiè</small></h2>
<h3>字根本义</h3>
<p>【420 戒部】戒＝甲骨文双手持戈（或大持戈形），象意武装防范（《说文》「警也，从廾持戈，以戒不虞」）。转义：警戒→谨慎、准备；警告→告诉、命令；又引申指界限。音源：借音字，义音同「亥」，古戒、亥可通（《周礼》「鼓皆駴」《释文》「駴本亦作骇」）。字族衍义：①戒备→束缚、约止 ②警告→警示、凶暴 ③形近「夭」之讹。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「敕也」——告诫、规劝；警也、命也、告也。</p>
<h3>横向对照</h3>
<p>同取戒部「持戈戒备——束止／警示」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>j「聚决」取「决」：言决而诫。</p>
