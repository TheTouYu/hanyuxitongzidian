<h2>美 <small>měi</small></h2>
<h3>字根本义</h3>
<p>【第486部部首字·一級字根】象人頭上用羽毛或羊角等裝飾之形。象意儀容裝扮好看。méi，《廣韻》：“好色。”</p>
<h3>字形</h3>
<p>字形：字形库存 12 形（見字根字形圖）。</p>
<h3>形旁声旁</h3>
<p>形旁聲旁：本字為部內字根（象形／象意），形義合一；其字族在本部下。 轉義：由儀容的好看，引申指凡令人舒服、愉快的事物。《玉篇》：“甘也、善美。或作媺。”</p>
<h3>横向对照</h3>
<p>同部字族見本部各條：嵄měi《玉篇》：“眉否切，音美。山。”；渼měi《集韻》：“水名，在京兆。一曰水波。”</p>
<h3>声母义</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
