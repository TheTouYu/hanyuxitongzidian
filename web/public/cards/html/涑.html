<h2>涑 <small>sōu/sù</small></h2>
<h3>释义</h3>
<p>束部（372）部头：从木从〇，〇象捆纏形，象意将散亂木柴捆在一起，《說文》「縛也，从囗木，書玉切」。轉義：捆束、聚集、控制，又指事情的結束。辯證：娕、餗所从實為「索」（艸束），敕所从為「柬」，皆形近而訛；朿亦與束訛混。音源：音源字，源自束縛聲；束縛必用繩索，故義音同「索」，或同「聿」。字族三路：①捆縛收縮 ②聚集 ③結束。</p>
<h3>声母拟态</h3>
<p>束為書母（山母一系）sh／s，「失收」取「收」一面：繩收則物束、物束則形縮——本部諸字皆此一面。</p>
