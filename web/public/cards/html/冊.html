<h2>冊 <small>cè</small></h2>
<h3>释义</h3>
<p>【第188部部首字·一級字根】象用竹木編紮成排形。指竹簡或柵欄。cè，《廣韻》：“簡冊。”zhà，《集韻》：“編竹木補籬謂之冊。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 c（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
