<h2>恊 <small>xié</small></h2>
<h3>释义</h3>
<p>劦部部头甲骨文从力之三叠，「力」为耕田之耒，三叠象三人并耕：并排插耒、同时翻土，借土壤板结性省力，故须喊号子（下或从口），引申同心协力；音源即插土之声。</p>
<h3>声母拟态</h3>
<p>心同力合，取「同」一面。</p>
