<h2>米 <small>mǐ</small></h2>
<h3>释义</h3>
<p>【第290部部首字·一級字根】从一上下有小形。“一”跟“上”“下”所从類似，表示界限，指代磨、壟、篩子、簸箕之類器具；“小”指破碎的穀粒，象意穀的加工成米。粟、稷、黍、稻等有著硬殼的穀粒，需要通過杵舂、磨碾等工具弄破碎；然後再用篩子篩，簸箕揚，使糠秕與米粒分離開來，才能食用。mǐ，《正字通》：“凡外脫膚殼者，如菰、菱、蓮、芡之類皆曰米。”《玉篇》：“粟實也。”《廣韻》：“穀實。”今一般專指稻米。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
