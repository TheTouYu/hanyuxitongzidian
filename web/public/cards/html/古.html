<h2>古 <small>gǔ</small></h2>
<h3>释义</h3>
<p>【第74部部首字·一級字根】从口从（丁）从丨（十）。“丁”象木楔，即釘子形，一般用于使物體穩固；“十”，表示十倍；从“口”，本指嘴，則象意嘴比釘上還要嚴實十倍，表示過去、久遠。gǔ，《玉篇》：“古久之言也。伏羲爲上古，文王爲中古，孔子爲後古。”《字彙》：“遠代也。”</p>
<h3>声母拟态</h3>
<p>聲母義（古部）：声母义（g·强） 辨證：由于“丁”或簡寫作“一”，與“丨”結合後，遂失去了“丁”，故《說文》：“故也。从十口，識前言者也。凡古之屬皆从古。，古文古。公戶切。（注）臣鉉等曰：十口所傳是前言也。”析形不確。</p>
