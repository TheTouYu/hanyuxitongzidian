<h2>呂 <small>lǚ</small></h2>
<h3>释义</h3>
<p>【第62部部首字·一級字根】从丁的二疊。“丁”，指木楔，表示小塊，即釘；二疊，象意許多小塊相連。</p>
<h3>声母拟态</h3>
<p>聲母義（呂部）：声母义（l·强） 辨證：由于“丁、口、囗”古字形相近，或以其為“囗”的二疊。如《釋義》：“由兩個表示區域、範圍或圈圍之義的‘囗’一上一下形組成。會意兩個相鄰相近的居住區域。”</p>
