<h2>北 <small></small></h2>
<h3>释义</h3>
<p>【第149部部首字·一級字根】从二匕相背形，象張開的翅膀。與“非”同源。《說文》：“非，違也。从飛下翄，取其相背。凡非之屬皆从非。甫微切。”《正字通》：“正訛：象鳥翼奮起形。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 無；未列 02z，按緒論取一面未判（02z 未收）。</p>
