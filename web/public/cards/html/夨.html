<h2>夨 <small>zè</small></h2>
<h3>字根本义</h3>
<p>【第402部部首字·一級字根】象人側著頭的樣子。zè，《說文》：“傾頭也。从大，象形。凡夨之屬皆从夨。阻力切。”</p>
<h3>字形</h3>
<p>字形：字形库存 8 形（見字根字形圖）。</p>
<h3>形旁声旁</h3>
<p>形旁聲旁：本字為部內字根（象形／象意），形義合一；其字族在本部下。</p>
<h3>横向对照</h3>
<p>同部字族見本部各條：捑zè《集韻》：“攴也。”小擊。；<img class="cim" src="/glyphs/chars/27369.png">jié《集韻》：“蟲名，蠸也；一曰蝗屬。”</p>
<h3>声母义</h3>
<p>聲母義：聲母 z（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
