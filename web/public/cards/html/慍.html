<h2>慍 <small>yùn</small></h2>
<h3>释义</h3>
<p>【第282部「囗部」之<img class="cim" src="/glyphs/chars/25055.png">（昷）支·二級字根】<img class="cim" src="/glyphs/chars/25055.png">（昷）與「囚」同源：从人在囗中，象人在封閉之處（避寒保暖）；小篆疊加「皿」為聲，取與器皿一樣密不透風，故有溫熱之意（《玉篇》「和也。或作溫」）。慍从心<img class="cim" src="/glyphs/chars/25055.png">聲：怒含於心而不發（《說文》「怒也」）。</p>
<h3>声母拟态</h3>
<p>y「柔锐」取「柔」：怒柔於內。</p>
