<h2>癍 <small>bān</small></h2>
<h3>字根本义</h3>
<p>【440 玨部】玨（jué）＝从玉二叠，象意玉串（二叠表多，可合可分），本义「二玉相合为一玨」。轉義：分瑞玉为信→班（分列、班次、分给）；玉色驳杂→斑（驳文、色杂、白发）。音源：借音，义音同「分」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收（原稿引玉虎符图）。</p>
<h3>形旁声旁</h3>
<p>《汉典》「皮膚上生的斑點」——皮肤斑点。</p>
<h3>横向对照</h3>
<p>同取玨部「玉之分合／色驳」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b取剥：点散而分。</p>
