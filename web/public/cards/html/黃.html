<h2>黃 <small>huáng</small></h2>
<h3>释义</h3>
<p>【第515部部首字·一級字根】甲骨文从（矢）从或。“矢”指箭；或在箭杆位置，當為一種矯正箭杆裝置。據考古發現，古代矯正箭杆的一般為刻槽的石頭，就是中間刻有箭槽的矯正器。箭杆一般是用細的竹木做成，去皮後，要通過矯直、磨光才行，其中要用到的工具就是刻槽石器，而且必須要用火烤軟（煣），才能實現。“橫（hèng）”的初文，《正字通》：“木衡也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 h（擬態「豁活」），取「豁」一面；本部未列 02z 表，按緒論推。</p>
