<h2><img class="cim" src="/glyphs/chars/20336.png"> <small>huā</small></h2>
<h3>释义</h3>
<p>【第70部部首字·一級字根】商代甲骨文象樹木開花形；或从“曰、口”，亦表聲，象意花開如張開的口。“華（华）”的初文，今簡化為“花”。huā，《玉篇》：“草木華也。”《正字通》：“華本字。隸作華，俗作花。”《說文》：“<img class="cim" src="/glyphs/chars/26f93.png">，榮也。从艸从<img class="cim" src="/glyphs/chars/20336.png">。凡華之屬皆从華。戶瓜切。”《揚子·方言》：“齊楚之間或謂之華，或謂之荂。”</p>
<h3>声母拟态</h3>
<p>聲母義（<img class="cim" src="/glyphs/chars/20336.png">部）：声母义（h·强） 辨證：西周金文訛樹木開花形為“<img class="cim" src="/glyphs/chars/200b9.png">（垂）”，小篆沿襲；並借“亏”為聲。故《說文》：“艸木華也。从<img class="cim" src="/glyphs/chars/200b9.png">亏聲。凡<img class="cim" src="/glyphs/chars/20336.png">之屬皆从<img class="cim" src="/glyphs/chars/20336.png">。，<img class="cim" src="/glyphs/chars/20336.png">或从艸从夸。況於切。”析形不確。</p>
