<h2>黲 <small>cǎn</small></h2>
<h3>释义</h3>
<p>【第594部「彡部」】彡＝三丿，象細長而多之物；參（三）＝三根算籌並列，引申相參、眾多、細密，為本部二級字根。</p>
<h3>声母拟态</h3>
<p>c「刺持」取「持」：色暗而持。</p>
