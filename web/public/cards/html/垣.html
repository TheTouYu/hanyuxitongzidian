<h2>垣 <small>yuán</small></h2>
<h3>字根本义</h3>
<p>【504 亙部】亙＝从二从月（一說回旋之形），本義迴環、終竟（《說文》「竟也」）；轉義延續、普遍。部內从亙諸字取「迴環、延續」一面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从土亙聲：牆也（《說文》「牆也」），取亙之環繞。</p>
<h3>横向对照</h3>
<p>曾部取「重疊增加」，亙部取「迴環延續」，从部取「相隨而聚」；形符各定落點。</p>
<h3>声母义</h3>
<p>y「柔锐」取「柔」：土柔而成垣。</p>
