<h2>榰 <small>zhī</small></h2>
<h3>释义</h3>
<p>榰zhī《說文》：“柱砥。古用木，今以石。从木耆聲。《易》：‘榰恒凶’。章移切。”柱腳石。《玉篇》：“柱也。”支撐。</p>
<h3>声母拟态</h3>
<p>声母义：今读 zhī，按声母取绪论拟态义一面（02z 未列本部）。</p>
