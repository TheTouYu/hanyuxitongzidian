<h2>㡭 <small>jué</small></h2>
<h3>释义</h3>
<p>【第386部部首字·一級字根】甲骨文从系从三橫，甲骨文的正反每無別，“<img class="cim" src="/glyphs/chars/221cd.png">、㡭”義應相同。三橫跟“畺”所从同，表示界線。因此，既可象意絲的斷為幾截。jué，《說文》：“<img class="cim" src="/glyphs/chars/221cd.png">，古文絕。象不連體絕二絲。”也可象意絲的聯結。jì，《正字通》：“繼本字 。”《說文》：“繼，續也。从糸、㡭。一曰反<img class="cim" src="/glyphs/chars/221cd.png">為繼。古詣切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
