<h3>释义</h3>
<p>【第592部「冬部」·啚族】啚＝甲骨文从㐭从丁（丁即釘），象意釘物挂於牆壁（農村風乾玉米辣椒之法）；轉義 牆上所挂物→圖畫（圖）；挂於壁上→偏遠、狹小、鄙吝（鄙、痞）；辯證《說文》「从囗从㐭」析形不確（口、囗與丁形近）；音源因懸挂之義，義音同「不」（否、鄙通）。</p>
<h3>声母拟态</h3>
<p>b取闭剥：垂後而闭。</p>
