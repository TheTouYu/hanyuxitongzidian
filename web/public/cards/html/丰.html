<h2>丰 <small></small></h2>
<h3>释义</h3>
<p>【第125部部首字·一級字根】商周字形本像植物根莖粗大、莖葉繁盛的樣子。fēng，《集韵》：“丰茸，艸盛皃。”《字彙》：“草生盛者，其根必深。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 無；未列 02z，按緒論取一面未判（02z 未收）。</p>
