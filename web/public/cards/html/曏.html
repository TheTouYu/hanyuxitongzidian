<h2>曏 <small>xiàng</small></h2>
<h3>释义</h3>
<p>【第532部「<img class="cim" src="/glyphs/chars/286dc.png">部」】<img class="cim" src="/glyphs/chars/286dc.png">（<img class="cim" src="/glyphs/chars/20a0d.png">）＝甲骨文从兩個相對的跪跽之人，象意相向，為「嚮」的初文（《集韻》「面也」）；轉義兩人相對歇息→親密、侍奉（卿），同一地域之人（鄉）。辯證：戰國古文將跪人形訛作「邑」，小篆承之，《說文》分釋<img class="cim" src="/glyphs/chars/20a0d.png">、<img class="cim" src="/glyphs/chars/286dc.png">、鄉、卿皆不確；卿、鄉同源，象兩人對食。音源借音：因相對義音同「向」。字族：①相對對食、面對親密 ②對食美味、回聲。</p>
