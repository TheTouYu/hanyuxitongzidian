<h2>枳 <small>zhǐ</small></h2>
<h3>释义</h3>
<p>从木只聲：枸橘，似橘有粗刺，果小味酸不可食（《說文》）；取只之尖硬义，故从木。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「凿」：枳枝有刺，扎刺人。</p>
