<h2><img class="cim" src="/glyphs/chars/2187a.png"> <small>miǎo</small></h2>
<h3>释义</h3>
<p>【第590部「淼部」】淼＝从三水疊加：象水面浩瀚無際、看不到邊（《說文》「大水也，从三水，或作渺」）；音源借音，義音同「眇」（《字彙》「俗作渺，非」）；未形成字族。</p>
<h3>声母拟态</h3>
<p>m取蒙末：女小而末。</p>
