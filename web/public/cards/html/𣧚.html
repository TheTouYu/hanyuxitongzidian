<h3>释义</h3>
<p>【第572部「歺部」】歺（歹）＝象中空而破裂的骨形（从半冎），殘骨；引申垂死、不好、死亡；音源為刮骨聲。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：餘骨而收。</p>
