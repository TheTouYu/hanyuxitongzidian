<h2>乏 <small>fá</small></h2>
<h3>释义</h3>
<p>【第193部部首字·一級字根】从丿从止。“丿”指拖曳，跟“乙、<img class="cim" src="/glyphs/chars/20086.png">”實為一字；“止”指腳，象意因疲勞、蹩腳而拖著腳行走的意思，表示疲勞、少力之意。農民犁田時，招呼牛停下來，就稱“乏”。如“疲乏”“困乏”。可謂“䟪（fǎn）”的初文，《集韻》：“候也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
