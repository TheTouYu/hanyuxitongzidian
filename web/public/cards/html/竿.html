<h2>竿 <small>gān</small></h2>
<h3>字根本义</h3>
<p>【491 干部】干＝象樹杈形，樹杈是原始先民最簡單有效的狩獵工具：攻可叉住獵物頭部使其不能動，守可叉擋猛獸；為增牢固在分叉處綁石塊（或作）。本義為干犯、求取、扞衛。音源字，取敲擊樹杈之聲。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从竹干聲：竹之直而長者，取干之主干義。</p>
<h3>横向对照</h3>
<p>同取干部「樹杈可叉、可擲」兩面：日取其燥，竹取其直，單取其重石。</p>
<h3>声母义</h3>
<p>g取隔：竹節相隔。</p>
