<h2><img class="cim" src="/glyphs/chars/21580.png"> <small>wěn</small></h2>
<h3>释义</h3>
<p>【第273部部首字·一級字根】甲骨文象人以手附耳仔細聆聽的樣子，表示聆聽之意。後演變為从耳門聲。wén，《說文》：“知聞也。从耳門聲。䎽，古文从昏。無分切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wěn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
