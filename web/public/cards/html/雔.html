<h2>雔 <small>chóu</small></h2>
<h3>释义</h3>
<p>【第608部部首字·一級字根】从隹相對形。“隹”，指鳥；兩鳥相對，要麼是相鬥；要麼是相和鳴。chóu，《說文》：“雙鳥也。从二隹。凡雔之屬皆从雔。讀若酬。市流切。”沒有指出其具體含義。實即“讎（chóu）”的初文，《集韻》：“《說文》：‘猶譍也。’一曰仇也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 ch（擬態「刺持」），取「刺」一面；本部未列 02z 表，按緒論推。</p>
