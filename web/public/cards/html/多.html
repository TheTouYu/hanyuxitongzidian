<h2>多 <small>duō</small></h2>
<h3>释义</h3>
<p>【第370部部首字·一級字根】从夕的二疊。“夕”，象殘月之形；二疊，表示極致。月亮除了月中那兩三天外，其它時候都是不圓的，故《釋名》：“月，缺也。”因此，“多”象意缺口極大，表示張開、廣大。可謂“哆”的初文，duō《說文》：“張口也。”zhà，《集韻》：“哆㕦，大口。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 d（擬態「囤动」），取「动」一面；本部未列 02z 表，按緒論推。</p>
