<h2><img class="cim" src="/glyphs/chars/28078.png"> <small>lù</small></h2>
<h3>字根本义</h3>
<p>【430 戾部】戾＝犬立而欲扑，引申乖张凶残；本部余字多取「立而不稳、曲戾不顺」之状。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《广韵》「<img class="cim" src="/glyphs/chars/28078.png">䠈，行不进也」；又跛足。</p>
<h3>横向对照</h3>
<p>同取本部「曲戾／展翅」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>l取离：行蹇而离。</p>
