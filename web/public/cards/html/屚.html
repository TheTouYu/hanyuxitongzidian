<h2>屚 <small>lòu</small></h2>
<h3>释义</h3>
<p>【第97部部首字·一級字根】本當从广从雨作“<img class="cim" src="/glyphs/chars/22240.png">”。“广”指屋子。象意屋子漏水。因“广、尸”形近，戰國古文訛“广”作“尸”。故《說文》：“屋穿水下也。从雨在尸下。尸者，屋也。盧後切。”或本指古代的計時器，即“漏”，《廣韻》：“漏刻。”</p>
<h3>声母拟态</h3>
<p>聲母義（屚部）：声母义（l·强）</p>
