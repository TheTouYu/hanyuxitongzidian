<h2>侢 <small>dài</small></h2>
<h3>字根本义</h3>
<p>【才部·再声】「再」甲骨文从丙才声：「丙」指柄，「才」指花果之梗（其实也是柄）；因丙亦可指器物上的孔，从才表明是梗一般的柄。转义：由柄之连接器物，引申两次、重复、连续（《玉篇》「两也、重也、仍也」）。辯證：小篆已看不出才声，《说文》「一举而二也，从冓省」析形不确。字族衍义：表示覆载。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收；原稿才部有「▲花的结构图」「▲桃花汛期的壶口瀑布」可参。</p>
<h3>形旁声旁</h3>
<p>《字海》「同戴」——再声之借为戴。</p>
<h3>横向对照</h3>
<p>再族之借：字形相借，义随戴。</p>
<h3>声母义</h3>
<p>d「囤动」取「囤」：顶囤于首。</p>
