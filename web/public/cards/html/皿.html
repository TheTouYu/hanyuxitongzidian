<h2>皿 <small>mǐn</small></h2>
<h3>释义</h3>
<p>【第284部部首字·一級字根】象敞口無蓋的盛器形。mǐn，《說文》：“飯食之器也。象形。與豆同意。凡皿之屬皆从皿。讀若猛。武永切。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 mǐn；未列 02z，按緒論取一面未判（02z 未收）。</p>
