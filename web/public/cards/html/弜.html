<h2>弜 <small>jiàng</small></h2>
<h3>释义</h3>
<p>【第157部部首字·一級字根】从弓的二疊。二疊表示極致。或象意弓的強有力。jiàng，《說文》：“彊也。从二弓。凡弜之屬皆从弜。其兩切。”《廣韻》：“弓有力也。”或象意弓㯳。《字彙補》：“弓偏也。”狀似弓，青銅製成，弓鬆弛不用時，將其綁在弓的裏邊，以防止弓變形；也可用于對變形的弓進行矯正。簡易的則用竹片。故《說文》：“㯳，榜也。”《段注》：“謂之㯳者，正之也。謂之㮄者，以竹木異體从旁傅合之之言。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
