<h2>㛨 <small>qiǎng</small></h2>
<h3>释义</h3>
<p>【第523部「羊部」·羌系】羌＝从人从羊，象牧羊之人或以羊為圖騰的西方部族。《說文》「西戎牧羊人也」。轉義：被拘系→強；遊牧褐膚→紅。字族分三面：羊狀（叫、咪眼、癢）／直接相關之物／形近「失」之訛。</p>
<h3>声母拟态</h3>
<p>q取亲缺：女聚而乱。</p>
