<h2>史 <small>shǐ</small></h2>
<h3>释义</h3>
<p>【第403部部首字·一級字根】甲骨文从又持中。“中”，指中心、中正；从“又”，指握持，也可以指司事。象意調解矛盾糾紛、物資交易時的中間人。這類人一般是有文化、有威望的，需要執筆書寫類似今天的調解書和契約之類。民間村社稱公證人；朝廷則稱史官。shǐ，《說文》：“史，記事者也。从又持中；中，正也。凡史之屬皆从史。疏士切。”《玉篇》：“掌書之官也、周宣王太史籀作大篆。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 sh（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
