<h2><img class="cim" src="/glyphs/chars/29605.png"> <small>jiē</small></h2>
<h3>字根本义</h3>
<p>【426 皆部】皆＝二虎直立相抗而齐；威猛一支取「虎威→强壮、硬实」，器物各随其质：铁、石、鞋、车皆须坚牢。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「疾风也」——急风。</p>
<h3>横向对照</h3>
<p>同取皆部「相抗而齐、相聚而坚」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>j取聚：风聚而疾。</p>
