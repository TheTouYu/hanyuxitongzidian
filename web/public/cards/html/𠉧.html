<h3>释义</h3>
<p>取部部头从耳从又，象手取耳而获；「<img class="cim" src="/glyphs/chars/20267.png">」即由「取」义之近取一面分张。</p>
<h3>声母拟态</h3>
<p>局促者空间既近，取「迫近」一面。</p>
