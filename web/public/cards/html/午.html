<h2>午 <small>wǔ</small></h2>
<h3>释义</h3>
<p>【第224部部首字·一級字根】象杵形。兩頭粗，中間為方便握持而細的樣子。加工工具，主要用于去掉穀物的外殼、粉碎以便食用，或者練布、築土、搗藥等。“杵（chǔ）”的初文，《玉篇》：“舂杵也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wǔ）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
