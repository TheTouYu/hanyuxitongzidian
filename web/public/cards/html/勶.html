<h2>勶 <small>chè</small></h2>
<h3>释义</h3>
<p>部頭徹（彻）：甲骨文从又从鬲，象意搬動食器鬲——吃完後收拾空的鬲（《六書故》「屏去釜鬲徹饌之義」）。轉義：撤走鬲→拆除、毀壞、陳設；由鬲之空盡→通達、透明（《廣韻》「通也、明也、道也、達也」）。辯證：戰國古文「鬲」演作「育」、「又」演作「攴」，另加「彳」表行走；《說文》「从彳从攴从育」所錄古文才是本體。音源：借音，因拖開之意義音同「也」。字族衍義：①撤除→發射抽走 ②空盡→通達透明。</p>
<h3>声母拟态</h3>
<p>穿母ch，「刺持」取「刺」。</p>
