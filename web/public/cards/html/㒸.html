<h2>㒸 <small>suì</small></h2>
<h3>释义</h3>
<p>【第251部部首字·一級字根】从八从豕。“八”指分開；从“豕”，象意豬的善于拱土、打洞。豬，尤其是未完全馴化前的野豬。有著尖利的獠牙和堅韌的鼻子，能作為覓食和進攻的武器。可謂“遂（suì）”的初文，《玉篇》：“㒸。今作遂也。”《說文》：“遂，亡也。”打洞逃亡之意。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 s（擬態「失收」），取「收」一面；本部未列 02z 表，按緒論推。</p>
