<h2>扄 <small>xiàng</small></h2>
<h3>释义</h3>
<p>【第527部「向部」】向＝从宀从口，宀屋、口窗，本義窗（《玉篇》「窻也」）；轉義窗所朝→方向、相向而動；音源借音（向陽有光，義音同昜）。字族三面：窗朝外（趨向相對）／窗明亮（形近冋之訛）／形近舟冏咼之訛。</p>
