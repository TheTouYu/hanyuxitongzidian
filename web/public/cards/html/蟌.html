<h2>蟌 <small>cōng</small></h2>
<h3>释义</h3>
<p>根據甲骨文來看，“囪”的構件當與“煴”相同，只是“火”在“昷”中而已。“昷”本“人”在“函”中形；从“火”，意即煙洞。煴，《說文》：“鬱煙也。”囪，《玉篇》：“灶突也。”囪本就是用來排煙的。因此，它們本是同源字。</p>
<h3>声母拟态</h3>
<p>清母c，「刺持」取「刺」：尾刺產卵。</p>
