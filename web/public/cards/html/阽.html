<h2>阽 <small>diàn</small></h2>
<h3>释义</h3>
<p>占部部头从卜从口，外加「冎」（牛肩胛骨）：口象骨卜所钻之孔，卜象灼出之裂纹，合为骨卜；引申窥察推测、据有、贴近。音源本卜声，义音同「聶」。</p>
<h3>声母拟态</h3>
<p>临壁将坠，取「贴近」一面。</p>
