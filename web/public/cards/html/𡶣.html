<h2><img class="cim" src="/glyphs/chars/21da3.png"> <small>suì</small></h2>
<h3>释义</h3>
<p>夂（夊<img class="cim" src="/glyphs/chars/21552.png">）：本義「象腳印倒過來的樣子，指往後退、往回走」；《說文》以為「夊」（行遲曳夊夊），實為「退（tuì）」之初文。辯證：夂、夊、<img class="cim" src="/glyphs/chars/21552.png">應為一字，小篆分寫成三；音源：借音字（音同妥）。字族衍義多指往後、阻行。</p>
<h3>声母拟态</h3>
<p>心母s，「失收」取「收」：歲者一歲一收，借音不系義。</p>
