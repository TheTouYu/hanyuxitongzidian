<h2>捑 <small>zè</small></h2>
<h3>字根本义</h3>
<p>【402 夨部】部首夨（zè）：象人侧着头的样子（《说文》「倾头也，从大，象形」阻力切）。音源：借音字，有偏侧之意而义音同「则」；但因其衍生字主要跟舞有关，实际上成了音源字，源自跳舞时的歌呼声。字族衍义：多指侧头，表示倾斜。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《集韵》「攴也」——小击。</p>
<h3>横向对照</h3>
<p>夨族之击：以「手」定其动，侧手而击。</p>
<h3>声母义</h3>
<p>z「凿总」取「凿」：侧击如凿。</p>
