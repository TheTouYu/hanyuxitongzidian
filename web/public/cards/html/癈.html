<h2>癈 <small>fèi</small></h2>
<h3>字根本义</h3>
<p>【424 癹部】癹＝从癶从攴，象拄杖而立、双脚轮换踩踏，指中耕除草（《说文》「以足蹋夷艸」）；也指用棍挑拨或掷棒，此义分化作「發」——發初文不从癹，甲骨文以一点表箭出弦颤。转义：发射→离去、派遣、生发、启动、发布。音源：借音字，义音同「犮」。字族：①除草割草 ②划动分拨 ③发射张起。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「固病也」——顽固不治之病、残疾；又废弃。</p>
<h3>横向对照</h3>
<p>同取癹部「以足拨草——分拨／发射」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>f「附分」取「分」：病分而废。</p>
