<h2>陀 <small>tuó</small></h2>
<h3>释义</h3>
<p>象蛇形，指蛇。shé，《集韻》：“虺屬。或作蛇、虵。”《說文》將其釋為“它”和“虫”：“它（tā），虫也。从虫而長，象冤曲垂尾形。上古艸居患它，故相問無它乎。凡它之屬皆从它。，它或从虫。托何切。（注）臣鉉等曰：今俗作食遮切。”“虫（huǐ），一名蝮，博三寸，首大如擘指。象其臥形。物之微細，或行，或毛，或蠃，或介，或鱗，以虫為象。凡虫之屬皆从虫。許偉切。”</p>
<h3>声母拟态</h3>
<p>透母t，「涂突」取「突」：地突出不平。</p>
