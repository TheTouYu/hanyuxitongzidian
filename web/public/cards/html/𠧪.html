<h2><img class="cim" src="/glyphs/chars/209ea.png"> <small>tiáo</small></h2>
<h3>释义</h3>
<p>【第575部部首字·一級字根】“<img class="cim" src="/glyphs/chars/209ea.png">”象栗、粟之類艸木的子實形。或加子房作“<img class="cim" src="/glyphs/chars/209f4.png">”。意思相同。tiáo，《說文》：“艸木實垂<img class="cim" src="/glyphs/chars/209ea.png"><img class="cim" src="/glyphs/chars/209ea.png">然。象形。凡<img class="cim" src="/glyphs/chars/209ea.png">之屬皆从<img class="cim" src="/glyphs/chars/209ea.png">。讀若調。，籀文三<img class="cim" src="/glyphs/chars/209ea.png">為<img class="cim" src="/glyphs/chars/209ea.png">。徒遼切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 t（擬態「涂突」），取「突」一面；本部未列 02z 表，按緒論推。</p>
