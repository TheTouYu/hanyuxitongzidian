<h2>我 <small>wǒ</small></h2>
<h3>释义</h3>
<p>【第36部部首字·一級字根】象戈類兵器形。這種兵器與一般的戈不同，有突出的三角刺，一般為三個，呈鋸齒狀排列，大約是砍斫類武器；或者是作為儀仗用的。wǒ，《說文》：“古殺字。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第36部），無擬態聲母義可系，義靠義類與字形。</p>
