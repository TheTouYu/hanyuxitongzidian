<h2>氱 <small>yǎng</small></h2>
<h3>释义</h3>
<p>【第525部「昜部」】古「氧」字，从气昜聲，化學元素之舊譯。</p>
<h3>声母拟态</h3>
<p>y「圆容」取「圆」：氣周而充。</p>
