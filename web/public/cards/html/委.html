<h2>委 <small>wěi</small></h2>
<h3>释义</h3>
<p>【第352部部首字·一級字根】“委”有兩個字源：一从匚从禾作“”。“匚”即“曲”，指直角尺，表示彎曲；从“禾”，指禾穗。象意禾穗成熟時，彎垂的樣子。此字後世已淘汰不用。《漢典》以其“同匋”，應不確。一从女从禾作“委”。“女”，指女子；从“禾”，指禾穗。象意女子髮辮如成熟的禾穗，表示女子的美。wēi，《廣韻》：“委委、佗佗，美也。”實即“䰀（wǒ）”的初文，《類篇》：“䰀鬌，髮皃。”《集韻》：“ 䰀鬌，髮美。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wěi）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
