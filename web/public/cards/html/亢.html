<h2>亢 <small>kàng</small></h2>
<h3>释义</h3>
<p>【第598部部首字·一級字根】象人分開雙腿半蹲之狀，故襠部下移，在“大”下部用一斜筆作指示符號。即紮馬步或站樁的樣子。這種架勢使重心往下，一般是為了讓自己站穩當，準備迎戰或扛舉重物。實即“抗（kàng）”的初文，《玉篇》：“擧也。扞也。”《廣雅》：“當也。”《字彙》：“敵也。抵也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 k（擬態「口控」），取「控」一面；本部未列 02z 表，按緒論推。</p>
