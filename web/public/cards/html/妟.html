<h2>妟 <small>yàn</small></h2>
<h3>释义</h3>
<p>【第320部部首字·一級字根】从日从女，象意太陽之母。“天命玄鳥，降而生商。”商人以“玄鳥”，即燕子為始祖神，故實際上指的就是燕子。</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yàn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
