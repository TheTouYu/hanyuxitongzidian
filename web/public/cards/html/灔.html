<h2>灔（灩滟<img class="cim" src="/glyphs/chars/2417f.png">淡淊） <small>yàn</small></h2>
<h3>本义</h3>
<p>《集韻》：「瀲灩，水滿皃。或从臽。亦作淡。」「瀲灩，水動皃。」《正字通》：「舊註灎本字，不知六書本作<img class="cim" src="/glyphs/chars/2417f.png">，灩與灧皆俗增。」水閃閃發光。</p>
<h3>声母拟态</h3>
<p>y 零声母，不系（推）。</p>
