<h2>隸 <small>lì</small></h2>
<h3>字根本义</h3>
<p>【432 隶部】隶（dài）＝从又抓动物尾巴，象抓住尾巴从后追及，为「逮」之初文；转义附属、剩余（意为割剩的尾巴）、勉强追及、抓不牢而逃脱（放纵安逸）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「附箸也，从隶柰声」——附着、奴仆（后世隶仆义）。</p>
<h3>横向对照</h3>
<p>同取隶部「追及／附著」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>l「拢离」取「拢」：附而不离。</p>
