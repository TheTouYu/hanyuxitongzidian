<h2>爵 <small>jué</small></h2>
<h3>释义</h3>
<p>【第585部部首字·一級字根】象酒器爵形，三足，側有鋬，上有兩柱（因側視，或只顯一柱），侈口有嘴。jué，《說文》：“禮器也。象爵（《段注》作‘雀’）之形，中有鬯酒，又持之也。所以飲器象爵（《段注》作‘雀’）者，取其鳴節節足足也。，古文爵，象形。即畧切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
