<h2>頪 <small>lèi</small></h2>
<h3>释义</h3>
<p>【第243部部首字·一級字根】从頁从米。象意分辨米粒狀。米粒小、數量多，而形狀相似，所以難以分清；或指色白。lèi，《說文》：“難曉也。从頁，从米。一曰鮮白皃。从粉省。盧對切。（注）臣鉉等曰：難曉，亦不聰之義。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
