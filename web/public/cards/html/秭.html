<h2><img class="cim" src="/glyphs/chars/25791.png">（秭） <small>zǐ</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/25791.png">（秭）zǐ《龍龕》：“將幾反。千億也。又<img class="cim" src="/glyphs/chars/25791.png">㷌（歸），縣名。”《漢典》：“同秭。”
秭（正體字），从禾市聲。</p>
<h3>声母拟态</h3>
<p>z「凿总」取「总」：秭為數名（千億），總聚之數（推）。</p>
