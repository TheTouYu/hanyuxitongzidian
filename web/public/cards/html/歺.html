<h2>歺 <small>è</small></h2>
<h3>释义</h3>
<p>【第572部部首字·一級字根】象中空而破裂的骨頭形。或周有小點，表示骨頭上還帶有一點肉。è，《說文》：“<img class="cim" src="/glyphs/chars/206f1.png">骨之殘也。从半冎。凡歺之屬皆从歺。讀若櫱岸之櫱。， 古文歺。五割切。（注）徐鍇曰：冎，剔肉置骨也。歺，殘骨也。故从半冎。”《集韻》：“骨朽之餘。或作<img class="cim" src="/glyphs/chars/20505.png">，亦書作<img class="cim" src="/glyphs/chars/239b5.png">。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 è；未列 02z，按緒論取一面未判（02z 未收）。</p>
