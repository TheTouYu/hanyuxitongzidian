<h2>壺 <small>hú</small></h2>
<h3>释义</h3>
<p>【第71部部首字·一級字根】象有蓋的壺形。hú，《說文》：“昆吾圜器也。象形。从大，象其蓋也。凡壷之屬皆从壷。戶吳切。”《集韻》：“洪孤切，音胡。夏商曰尊彝，周制用壷，有方圜之異。”《玉篇》：“盛飲器也。”</p>
<h3>声母拟态</h3>
<p>聲母義（壺部）：声母义（h·强）</p>
