<h2>祥 <small>xiáng</small></h2>
<h3>释义</h3>
<p>【第523部「羊部」】羊＝象有角的羊頭形，取其角為標誌符號；音源為羊叫聲。字族分取「羊毛厚多」「羊群處溫順」「羊眼小而假寐」「羊行山崖」諸面。</p>
<h3>声母拟态</h3>
<p>x取续消：兆續而祥。</p>
