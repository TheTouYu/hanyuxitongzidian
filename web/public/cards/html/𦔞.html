<h3>释义</h3>
<p>部頭徹（彻）：甲骨文从又从鬲，象意搬動食器鬲——吃完後收拾空的鬲（《六書故》「屏去釜鬲徹饌之義」）。轉義：撤走→拆除、毀壞、陳設；由空盡→通達、透明（《廣韻》「通也、明也」）。辯證戰國古文鬲演作育、又演作攴，另加彳表行走。音源借音，義音同也。字族①撤除②空盡。</p>
<h3>声母拟态</h3>
<p>照母zh，「鑿總」取「鑿」。</p>
