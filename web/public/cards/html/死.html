<h2>死 <small>sǐ</small></h2>
<h3>释义</h3>
<p>【第572部「歺部」】死＝从歺从人（殘骨旁之人），生命終結；屍＝从尸死聲，屍體。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：氣收而尽。</p>
