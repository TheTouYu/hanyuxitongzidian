<h2>澧 <small>lǐ</small></h2>
<h3>释义</h3>
<p>【第581部「豊部」】豊（lǐ）＝从壴从朋（玉），象禮物（朋、玉）堆疊如鼓；與「豐」同源而側重不同（豐从壴朋聲＝繁飾之鼓，豊从朋壴聲＝堆疊之禮）；轉義 眾而有序；音源本壴聲，義音同「麗」。</p>
<h3>声母拟态</h3>
<p>l取拢离：水行而离。</p>
