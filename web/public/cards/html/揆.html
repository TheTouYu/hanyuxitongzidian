<h2>揆 <small>kuí</small></h2>
<h3>字根本义</h3>
<p>【473 癸部】癸＝甲骨文象測日影以定方位时所画的线条，为「揆」之初文（揆，度也）；古人建宫先以日影正方位，圭表圭臬即其器，故古「圭」「癸」可通。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从手癸聲：《說文》「葵也」，《廣雅》「度也」，揆度、揆理。</p>
<h3>横向对照</h3>
<p>同取本部「骨相拱起／日影畫線」两面：頁取骨，手取度。</p>
<h3>声母义</h3>
<p>k取控：手度而控。</p>
