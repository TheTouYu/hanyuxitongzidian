<h2><img class="cim" src="/glyphs/chars/294b3.png"> <small>huì</small></h2>
<h3>字根本义</h3>
<p>【428 曰部】曰＝从口上有一，象张口说话；《说文》「词也」。转义：为、叫作；又作语助。音源：借音字，因有言辞义而义音同「聿」（《诗》「曰为改岁」《汉书》作「聿为」）。字族一支取「张口说话→裂开、连续」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「昧前也」——实为「湏」之讹字。</p>
<h3>横向对照</h3>
<p>同取曰部「张口出言／裂开连续」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>h取豁：借形记讹。</p>
