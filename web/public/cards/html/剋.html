<h2>剋 <small>kè</small></h2>
<h3>字根本义</h3>
<p>【422 克部】克＝从革从由（两字皆从口，故省一口）：革指剥下的生皮，由指油；生皮去毛之外还须脱脂，鞣染后又须加油以复柔软防裂，故本义是给干皮脱脂或加油使之柔软，引申制服、获胜（《玉篇》「能也、获也、胜也」）。音源：本「革」声，今字形已看不出革，故单立部；义音同「亥」。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《广韵》「剋己，又必也、杀也、急也」；剋期＝约定期日；与克同。</p>
<h3>横向对照</h3>
<p>同取克部「脱脂加油——由刚柔、由柔胜」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>k「口控」取「控」：控而必取。</p>
