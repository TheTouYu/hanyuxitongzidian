<h2>襼 <small>yì</small></h2>
<h3>释义</h3>
<p>丮部（第375部）部头象两手拾掇、作复杂劳作。本部孰支多指烂熟，埶支多指竖起、举起；字族中凡从「埶」者，除植立之外，又分出持、抵、烧、私近诸面，形符各定其落点。</p>
<h3>声母拟态</h3>
<p>袖举手而动，取「举而垂」一面。</p>
