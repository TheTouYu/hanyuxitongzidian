<h2>相 <small>xiāng</small></h2>
<h3>释义</h3>
<p>【第529部部首字·一級字根】从目从木，指觀木，察看木的材質。xiāng，戴侗《六書故》：“相，度才也。工師用木，必相視其長短、曲直、陰陽、剛柔之所宜也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
