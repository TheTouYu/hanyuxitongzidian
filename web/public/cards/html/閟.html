<h2>閟 <small>bì</small></h2>
<h3>字根本义</h3>
<p>【440 必部】必＝丝浸墨取直之器；诸字取「取直、专一、封闭、隐密」诸面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「闭门也」——闭门深藏；幽闭、谨慎。</p>
<h3>横向对照</h3>
<p>同取必部「取直／隐密」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>b取剥：门闭而分。</p>
