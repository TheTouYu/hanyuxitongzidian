<h2>慕 <small>mù</small></h2>
<h3>字根本义</h3>
<p>【511 心部】心＝象心臟形，本義心臟；轉義心思、感情。部內从心諸字以心為義符，聲符各給一情：慕思、憲法、愆過、懲止，皆由心發。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从心莫聲：習也、思慕（《說文》「習也」），莫有日暮不見之義。</p>
<h3>横向对照</h3>
<p>同以心為義符：莫取日暮、衍取漫過、徵取驗止、滿取氣盈。</p>
<h3>声母义</h3>
<p>m「蒙末」取「蒙」：心蒙而慕。</p>
