<h2>鬲 <small>lì</small></h2>
<h3>释义</h3>
<p>【第424部部首字·一級字根】象古代的炊具鬲形。分陶制與金屬兩種。其形狀一般為侈口（口沿外翻），有三個中空的足，兼具灶與鍋的功能，類似于今日的火鍋。lì，《說文》：“鼎屬。實五觳，斗二升曰觳。象腹交文，三足。凡鬲之屬皆从鬲。，鬲或从瓦。，漢令鬲，从瓦，厤聲。郎激切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
