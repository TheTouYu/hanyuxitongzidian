<h2>黹 <small>zhǐ</small></h2>
<h3>释义</h3>
<p>【第106部部首字·一級字根】甲骨文象兩巾之間有線連綴之形，表示縫紉之意。zhǐ，《廣韻》：“針縷所紩。”</p>
<h3>声母拟态</h3>
<p>聲母義（黹部）：声母义（zh·强） 辨證：由于上面的“巾”，小篆寫如“丵”，故《說文》：“箴縷所紩衣。从㡀，丵省。凡黹之屬皆从黹。陟幾切。（注）臣鉉等曰：丵，眾多也，言箴縷之工不一也。”析形不確。</p>
