<h2>蜗 <small>wō</small></h2>
<h3>释义</h3>
<p>咼从口从冎，口戾不正；其聲源自冎（骨），骨節外突、口形偏斜。</p>
<h3>声母拟态</h3>
<p>見母 g（古華切），「隔估」取「隔」：殼隔身、身縮殼中。</p>
