<h3>释义</h3>
<p>【第127部部首字·一級字根】甲骨文从屮从倒丰。象意草生長丰茂而致枝稍下垂成拱狀。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 h（擬態「豁活」），取「豁」一面；本部未列 02z 表，按緒論推。</p>
