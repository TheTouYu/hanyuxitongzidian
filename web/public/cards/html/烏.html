<h2>烏 <small>wū</small></h2>
<h3>释义</h3>
<p>【第324部部首字·一級字根】甲骨文从勹在鳥的喙部形。“勹”象人匍匐形，含有孵化、哺育之意。成年烏鴉有相互餵食的習性，古人誤認為烏鴉反哺，而被視為孝鳥。wū，《玉篇》：“孝烏也。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 wū）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
