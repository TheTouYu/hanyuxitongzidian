<h2><img class="cim" src="/glyphs/chars/2929d.png"> <small>zhì</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/2929d.png">（<img class="cim" src="/glyphs/chars/2929e.png">）zhì《說文》：“蓋杠絲也。从革旨聲。脂利切。（注）徐鍇曰：絲，其繋系也。”車蓋杠柄上圍束的皮繩。取其如脂膏附著于肉。《集韻》：“或从至。”</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「总」：皮繩圍束車蓋杠柄，總束而不散。</p>
