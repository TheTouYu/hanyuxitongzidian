<h2>休 <small>xiū</small></h2>
<h3>释义</h3>
<p>【第545部部首字·一級字根】从人从木。“木”，指樹木或木制的器具；从“人”，可象意多種：躺在床上、坐在凳椅上、靠著樹干、在樹蔭下等等，都是“休”，表示歇息。xiū，《說文》：“息止也。从人依木。，休或从广。許尤切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
