<h2>鳥 <small>niǎo</small></h2>
<h3>释义</h3>
<p>【第605部部首字·一級字根】象體形較大的鳥形，泛指鳥類。niǎo，《玉篇》：“飛禽緫名也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 n（擬態「纳弄」），取「弄」一面；本部未列 02z 表，按緒論推。</p>
