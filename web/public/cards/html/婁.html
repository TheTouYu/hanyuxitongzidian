<h2>婁 <small>lóu</small></h2>
<h3>释义</h3>
<p>【第96部部首字·一級字根】甲骨文从<img class="cim" src="/glyphs/chars/26951.png">从牛从角小。“角小”指角的尖部有細孔，即牛角做成的漏斗；从“<img class="cim" src="/glyphs/chars/26951.png">”，指手捧。象意手捧牛角做成的漏斗使用。</p>
<h3>声母拟态</h3>
<p>聲母義（婁部）：声母义（l·强） 辨證：戰國文字訛“<img class="cim" src="/glyphs/chars/26951.png">角”為“貴”字頭形，小篆又訛作“母、中”，故《說文》：“空也。从母、中、女，空之意也。一曰婁務（愚笨）也。，古文。洛矦切。”析形不確。</p>
