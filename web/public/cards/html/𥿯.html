<h2><img class="cim" src="/glyphs/chars/25fef.png"> <small>pài</small></h2>
<h3>释义</h3>
<p>【第524部「永部」】永、<img class="cim" src="/glyphs/chars/200a2.png">本同源：从人从彳或行，象人行於道，表道路之遠。加水為「泳」，潛行水中。轉義：道路河流多分支→支、別（隸變作<img class="cim" src="/glyphs/chars/200a2.png">）。辯證：《說文》「水巠理之長」所據小篆本从水从永，析形不確；甲骨文正反無別，永、<img class="cim" src="/glyphs/chars/200a2.png">為一字。音源：本行聲，古永、羊通用。字族分二面：長久／分支分散。</p>
<h3>声母拟态</h3>
<p>p「拼辟」取「拼」：絲散而拼。</p>
