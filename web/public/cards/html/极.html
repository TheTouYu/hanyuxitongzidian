<h2>极 <small>jí</small></h2>
<h3>释义</h3>
<p>从木及聲：《說文》「驢上負也」，《篇海》「為木版跨驢背以負物者」——驢背上架物用的木版。</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：驢上負版，木聚而載（推）。</p>
<h3>借字说明</h3>
<p>「极」本有其字（驢上負物之木版），与「極」（屋棟、至極）无关；今以「极」為「極」的簡化，屬同音借用，故二字分卡。《說文》另有「极」字，非简化所造。</p>
