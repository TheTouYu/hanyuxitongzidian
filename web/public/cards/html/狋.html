<h2>狋 <small>yí</small></h2>
<h3>释义</h3>
<p>《說文》：“犬怒皃。从犬示聲。一曰犬難得（段注作‘附’：各本訛‘得’。今依《集韻》《類篇》正。附猶近也）。代郡有狋氏縣。讀又若銀。語其切。”《玉篇》：“兩犬爭也。”chí，《集韻》：“狋觺，獸角皃。一曰不平皃。”quán，《集韻》：“狋氏，縣名，屬代郡。或从雚。”獾，huān，《集韻》：“貛，《說文》：‘野豕也。’《爾雅》：‘狼牡，貛。’亦作䝔、獾、貆、貒。通作犿。”</p>
<h3>声母拟态</h3>
