<h3>释义</h3>
<p>【第591部「殸部」】殸＝甲骨文从声从殳（声＝草繩系懸之石，殳＝持槌敲擊），象敲擊懸挂石磬，磬之初文（《說文》「樂石也」）；轉義 泛指聲響、擊打之敵、空盡（磬懸不著物故空）、彎曲（磬折）；音源＝擊磬聲（古殸、生通用）。</p>
<h3>声母拟态</h3>
<p>y「续消」取「续」：鼓續而续。</p>
