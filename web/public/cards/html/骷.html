<h2>骷 <small>kū</small></h2>
<h3>释义</h3>
<p>骨从冎有肉，肉之覈也；冎象三節相連之腿骨。</p>
<h3>声母拟态</h3>
<p>溪母k，「口控」取「空」：枯骨中空，頭骨如空洞。</p>
