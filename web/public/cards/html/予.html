<h2>予 <small>yǔ</small></h2>
<h3>释义</h3>
<p>【第60部部首字·一級字根】象帶線梭子形，交錯成連環狀，象意織布時梭子的來回推送。“杼（zhù）”的初文，《說文》：“機之持緯者。从木予聲。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母——本部屬緒論「零聲母諸部」（第60部），無擬態聲母義可系，義靠義類與字形。</p>
