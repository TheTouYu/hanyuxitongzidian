<h2>倝 <small>gàn</small></h2>
<h3>字根本义</h3>
<p>【494 旦部余支】旦部除「日出見影」一系外，尚有从倝（旗幟輝煌）一支：倝本象「中」形旗幟，西周晚期方框演作旦而得聲。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>本部内字根：依西周金文與「雗」甲骨文，本同「㫃」，象「中」形旗幟；方框演作旦，象意旗幟輝煌，或指九旗之「大常」（日月為常）。</p>
<h3>横向对照</h3>
<p>同取旦部「日出見影、旗幟輝煌」兩面：手取其荷，羽取其飛，木取其樁。</p>
<h3>声母义</h3>
<p>g「隔估」取「隔」：旗隔風而揚。</p>
