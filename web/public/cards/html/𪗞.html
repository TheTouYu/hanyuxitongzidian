<h2><img class="cim" src="/glyphs/chars/2a5de.png"> <small>qí</small></h2>
<h3>字根本義</h3>
<p>部頭丌（jī）：象低矮平整的托盤形，可獨立為器以端送小物，也可作器皿底座，故多作表示平整的音義符號；《說文》「下基也，薦物之丌」讀若箕。音源：借音字，義音同「己」（堆疊物體）。字族衍義：①薦物根基 ②同「其」指箕或箕狀物 ③同「其」指紋路交織 ④形近「斤」之訛。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該部有「▲鎏金麒麟印紐（唐）」「▲《祭神》（清 陳枚）」二圖，可參。</p>
<h3>形旁声旁</h3>
<p>从齒亓聲，即䶞：《集韻》「齧也」，古作<img class="cim" src="/glyphs/chars/2a5de.png">；《正字通》謂譌字（即齗）。</p>
<h3>横向对照</h3>
<p>④組：記咬齧一義，形近而讹，不強解取義。</p>
<h3>声母义</h3>
<p>q「親缺」取「親」：齒相親而齧。</p>
