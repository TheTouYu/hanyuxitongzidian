<h2>涡 <small>wō / guō</small></h2>
<h3>释义</h3>
<p>部头冎（叧）：象三節相連的動物腿骨形，代指動物的骨頭，本「骨」字初文，《說文》「肉之覈也。从冎有肉」。部内另一条：甲骨文象動物肩胛骨形，與「冎」所指本同。</p>
<h3>声母拟态</h3>
<p>guō（涡河）《说文》「古禾切」属见母 g，拟态义「隔估」取「隔」：水道被岸石阻隔，过不去便回旋下陷，成涡——隔而后旋。wō 今属零声母，按规矩不系拟态义。</p>
