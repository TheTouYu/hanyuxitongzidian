<h2>下 <small>xià</small></h2>
<h3>释义</h3>
<p>【第327部部首字·一級字根】早期甲骨文本从下加短橫。“”象天空的穹隆形，後演變成“一”；下加一點，象事指地面、地下。如《書·堯典》：“格于上下。”孔傳：“至于天地。”《禮記·檀弓下》:“夫子疾，莫養于下，請以殉葬。”鄭玄注：“下，地下。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
