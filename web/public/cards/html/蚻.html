<h2>蚻 <small>zhá</small></h2>
<h3>释义</h3>
<p>从口中吐出叉狀舌頭之形，或加兩點、三點、四點，指唾液。象意蛇舌。</p>
<h3>声母拟态</h3>
<p>照母zh，「鑿總」取「鑿」：鳴如鑿鑿。</p>
