<h2>胂 <small>shēn</small></h2>
<h3>释义</h3>
<p>【第114部「申部」·申字族一（伸展、延长）】申＝象閃電之形，電之初文；本部音源為雷。胂从肉申聲，取閃電光帶直長之象，指夾在脊骨兩旁的長條肉。</p>
<h3>声母拟态</h3>
<p>sh（失收）取「收而復發」一面：電光先收後張，胂為貼脊收束之肉條。</p>
