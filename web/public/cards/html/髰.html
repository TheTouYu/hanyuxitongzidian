<h2>髰 <small>tì</small></h2>
<h3>释义</h3>
<p>部頭世（丗㔺卋）：象枝葉之形，是「枼（葉）」的初文。轉義更迭、世代、年歲、時代、一生。辯證：《說文》「三十年為一世，从卅而曳長之」析形不確。音源：風吹樹葉悉索聲。字族衍義：①牽引拖拽 ②層層疊疊 ③改易逾越 ④洩漏光明。</p>
<h3>声母拟态</h3>
<p>透母t，「涂突」取「突」：剃而去之。</p>
