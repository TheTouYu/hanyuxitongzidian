<h2>瓜 <small>guā</small></h2>
<h3>释义</h3>
<p>【第69部部首字·一級字根】象蔓上結瓜形，指瓜類。guā，《說文》：“㼌也。象形。凡瓜之屬皆从瓜。古華切。”《正字通》：“ 蔓生，種類非一。”</p>
<h3>声母拟态</h3>
<p>聲母義（瓜部）：声母义（g·强） 辨證：由于西周金文“瓜、亡”相近，小篆或訛“亡”為“瓜”。如“狐”，甲骨文本从犬亡聲。之所以从“亡”，是因為狐非常機靈，善于埋伏等待或使用聲東擊西等計謀來捕食老鼠、兔子等小動物；人類鋪設的陷阱幾乎對狐不起作用，狐總能將陷阱裏充當誘餌的食物取走而自</p>
