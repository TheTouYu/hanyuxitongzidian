<h2>野 <small>yě</small></h2>
<h3>本义</h3>
<p>野：从里予聲，本義為郊外、田野。</p>
<h3>转义</h3>
<p>引申為鄙野、粗野、野生；又為「埜」之或體。</p>
<h3>辩证</h3>
<p>从里予聲（原稿列士部野支），非从林土。</p>
<h3>音源</h3>
<p>本里聲。</p>
<h3>声母拟态</h3>
<p>y 零聲母不系（照實）。</p>
<h3>字族衍义</h3>
<p><b>指郊野，表示野外的物体或状态</b></p>
