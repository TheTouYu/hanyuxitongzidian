<h2>䀠 <small>jù</small></h2>
<h3>释义</h3>
<p>【第94部部首字·一級字根】从目的二疊。“目”，指眼睛；二疊，表示極致。象意眼睛睜得很大，或深目、怒目、斜視等種種不同尋常的眼神。jù，《說文》：“左右視也。从二目。凡䀠之屬皆从䀠。讀若拘。又若良士瞿瞿。九遇切。”</p>
<h3>声母拟态</h3>
<p>聲母義（䀠部）：声母义（j·强） 辨證：由于“目”或作“臣”，故或寫作“臦”。guàng，《說文》：“乖也。从二臣相違。讀若誑。居況切。”人和動物的眼睛一般都是兩只，“臣”的二疊容易被誤認作兩眼，才故意寫成上下相迭或左右相背。因此，“臦”的表意應該也跟“䀠”相同。《說文》所釋不確</p>
