<h2>鷥 <small>sī</small></h2>
<h3>字根本義</h3>
<p>部頭糸（幺糹糸<img class="cim" src="/glyphs/chars/221af.png">）：从「幺」的一頭或兩頭出緒，象多股絲絞在一起的樣子，指拈出的紗線（《說文》「細絲也，象束絲之形」，莫狄切）。轉義：細微（《廣雅》微也）、連綿（《廣韻》連也）。音源：源自拈絲聲。字族衍義：①線繩之用→羈縻束縛 ②絲線→細微 ③形近「耒」之訛。</p>
<h3>字形</h3>
<p>字形：字形庫未收；原稿該條前後無獨立插圖。</p>
<h3>形旁声旁</h3>
<p>从鳥絲省聲，鷺鷥，白鷺；郭璞注「頭上毛似絲」。</p>
<h3>横向对照</h3>
<p>②絲線組：同取「細長如絲」，以鳥之冠羽定落點。</p>
<h3>声母义</h3>
<p>s「失收」取「收」：羽如絲束收於頂。</p>
