<h2>弥 <small>mí</small></h2>
<h3>释义</h3>
<p>彌：从弓爾聲，本义放松弓弦，引申满、益、终；尔取草裙层叠、满之象（推）。</p>
<h3>字理分析</h3>
<p>字根「尔」草裙层叠→繁茂满盈，故「彌」以弓张满、终尽为义。</p>
<h3>声母义</h3>
<p>m「蒙末」取「蒙」：弓张而蒙覆。</p>
