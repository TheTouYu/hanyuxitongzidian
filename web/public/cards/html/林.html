<h2>林 <small>lín</small></h2>
<h3>释义</h3>
<p>【第593部部首字·一級字根】从木的二疊。“木”，指樹；二疊，表示極致。可象意樹叢。lín，《說文》：“平土有叢木曰林。从二木。凡林之屬皆从林。力尋切。”或从三疊作“森”，意思相同。sēn，《說文》：“木多皃。从林从木。讀若曾參之參。所今切。”也可象意樹木的高大。此義分化作“森”。《玉篇》：“長木皃。或作槮。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
