<h2>占 <small>zhān</small></h2>
<h3>释义</h3>
<p>【第382部部首字·一級字根】从卜从口，外或加冎。“冎”指牛肩胛骨；“口”，表示骨卜時所鑽出的洞；“卜”指灼出的裂紋。象意骨卜。zhān，《說文》：“視兆問也。从卜，从口。職廉切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 zh（擬態「凿总」），取「凿」一面；本部未列 02z 表，按緒論推。</p>
