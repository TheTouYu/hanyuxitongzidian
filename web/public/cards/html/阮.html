<h2>阮 <small>ruǎn</small></h2>
<h3>字根本义</h3>
<p>【454 元部】元＝人首（《说文》「始也，从一从兀」），引申首、始、大；诸字取「首、始、圆全」诸面。</p>
<h3>字形</h3>
<p>古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「代郡五阮關也」——关名；后为姓、乐器名（阮咸）。</p>
<h3>横向对照</h3>
<p>同取元部「首、始、圆全」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>r「柔锐」取「柔」：关隘而柔。</p>
