<h2>札 <small>zhá</small></h2>
<h3>释义</h3>
<p>部頭札：从木乙聲，即象蛇一樣的長條木片。《說文》「牒也。从木乙聲，側八切」。轉義隨木片用途而分：書寫用簡牘（《釋名》「札，櫛也，編之如櫛，齒相比也」）、船槳（在旁撥水，形似札）、皮革包的邊、草草裝殮的簡易棺木→夭折瘟疫、車輪→碾壓（義音同軋）。字族衍義：①木牘形→長條狀 ②木片→夭亡 ③碾壓或擬聲。</p>
<h3>声母拟态</h3>
<p>照母zh，「鑿總」取「鑿」：削木成片。</p>
