<h2>琢 <small>zhuó</small></h2>
<h3>释义</h3>
<p>【第543部「玉部」】玉＝象玉串形（三玉相連、一貫其間），《說文》「石之美……象三玉之連」；轉義玉製品、瑞玉、佩玉、美稱、磨煉。</p>
<h3>声母拟态</h3>
<p>z「凿总」取「凿」：雕凿而总。</p>
