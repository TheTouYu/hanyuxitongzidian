<h2>弇 <small>yǎn</small></h2>
<h3>释义</h3>
<p>【第321部部首字·一級字根】从合从<img class="cim" src="/glyphs/chars/20b1e.png">。象意雙手合掌。yǎn，《說文》：“蓋也。从<img class="cim" src="/glyphs/chars/20b1e.png">，从合。，古文弇。古南切。又一儉切。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yǎn）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
