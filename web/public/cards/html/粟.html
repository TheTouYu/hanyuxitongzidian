<h2>粟 <small>sù</small></h2>
<h3>释义</h3>
<p>【第575部「<img class="cim" src="/glyphs/chars/209ea.png">部」】<img class="cim" src="/glyphs/chars/209ea.png">＝象栗、粟之類草木子實垂形（讀若調）；子實在房中如器皿盛食，故引申為酒器「卣」；因<img class="cim" src="/glyphs/chars/209ea.png">、西形近，栗、粟皆誤从西；音源為借音（可釀酒，義音同酉）。</p>
<h3>声母拟态</h3>
<p>s「失收」取「收」：穀收而聚。</p>
