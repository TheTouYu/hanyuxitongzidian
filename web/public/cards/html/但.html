<h2>但 <small>dàn</small></h2>
<h3>字根本义</h3>
<p>【494 旦部】旦＝象太陽剛从海面升起、水裏有倒影之形，象意日初出時（《玉篇》「早也、朝也、曉也」）；借音字，義音从蟬（蟬須待日出羽化，古或以為太陽神）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从人旦聲：本義脫衣露身（通「袒」），引申只、僅。</p>
<h3>横向对照</h3>
<p>善部取「有角獸頭、美善」一面，旦部取「日出見影」一面；形符各定落點。</p>
<h3>声母义</h3>
<p>d取囤：身囤而露。</p>
