<h2>囗 <small></small></h2>
<h3>释义</h3>
<p>【第282部部首字·一級字根】象四周被圍護之形，表示封閉的空間。wéi，《說文》：“回也。象回帀之形。凡囗之屬皆从囗。羽非切。”《玉篇》：“古圍字。”《正字通》：“《同文舉要》：‘囗象四方畺圍形’。”</p>
