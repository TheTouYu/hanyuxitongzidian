<h2>谷 <small>gǔ</small></h2>
<h3>释义</h3>
<p>【第67部部首字·一級字根】从<img class="cim" src="/glyphs/chars/20501.png">从口。“<img class="cim" src="/glyphs/chars/20501.png">”从八的二疊，“八”指分開，二疊指分開得很寬的意思；从“口”，象意口張開到極致。《說文》誤將其釋作“<img class="cim" src="/glyphs/chars/27bab.png">”：“口上阿也。”</p>
<h3>声母拟态</h3>
<p>聲母義（谷部）：声母义（g·中） 辨證：由于“<img class="cim" src="/glyphs/chars/27bab.png">、谷”形近，《說文》混釋為：“<img class="cim" src="/glyphs/chars/27bab.png">，口上阿也。从口，上象其理。凡<img class="cim" src="/glyphs/chars/27bab.png">之屬皆从<img class="cim" src="/glyphs/chars/27bab.png">。，<img class="cim" src="/glyphs/chars/27bab.png">或如此。，或从肉从豦。其虐切。”而另釋“谷”為“泉出通川為谷。从水半見于口。凡谷之屬皆从谷。古祿切。”所釋形義皆不確。</p>
