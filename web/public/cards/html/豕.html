<h2>豕 <small></small></h2>
<h3>释义</h3>
<p>【第281部部首字·一級字根】象豬形。shǐ，《玉篇》：“豬豨之總名。”《說文》：“彘也。竭其尾，故謂之豕。象毛足而後有尾。讀與豨同。凡豕之屬皆从豕。，古文。式視切。（按）今世字誤以豕為彘，以彘為豕。何以明之？為啄琢从豕，蟸从彘。皆取其聲，以是明之。（注）臣鉉等曰：此語未詳，或後人所加。”</p>
