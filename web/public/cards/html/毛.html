<h2>毛 <small>máo</small></h2>
<h3>释义</h3>
<p>【第297部部首字·一級字根】甲骨文象動物的尾巴或身上的體毛下垂形，指動物或植物表面的絲狀物。西周金文倒過來向上，遂演變今天的“毛”字。máo，《說文》：“眉髮之屬及獸毛也。象形。凡毛之屬皆从毛。莫袍切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
