<h2>胑 <small>zhī</small></h2>
<h3>释义</h3>
<p>从肉只聲：《說文》「體四胑也」；《釋名》「胑，枝也，似木之枝格也」；取只之枝狀橫生义。</p>
<h3>声母拟态</h3>
<p>zh「凿总」取「总」：四胑總聚於身（推）。</p>
