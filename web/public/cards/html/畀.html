<h2>畀 <small>bì</small></h2>
<h3>释义</h3>
<p>【第395部部首字·一級字根】甲骨文本象矢有鏃形，指箭鏃。因箭鏃也是扁平的，與“甶”字形近，遂演變成“甶”。“錍（pī）”的初文，《揚子·方言》：“凡箭簇胡合嬴者，廣長而薄鐮，謂之錍。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
