<h2>徐 <small>xú</small></h2>
<h3>释义</h3>
<p>【第54部「余部」·余字族①（劃槳，表示舒緩、次第）】余＝划槳之象，轉義為首領自稱（我）、浸泡水中的葉子、舒徐、剩餘。徐从彳余聲，取划槳舒緩有次第之義，本義為安適地行走（《說文》「安行也。从彳余聲。似魚切」）。</p>
<h3>声母拟态</h3>
<p>x（續消）取「續」一面：一槳接一槳，緩而不絕，正是徐行；若取「消」則成消歇，與緩行相反。</p>
