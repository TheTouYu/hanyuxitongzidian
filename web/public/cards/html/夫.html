<h2>夫 <small>fū</small></h2>
<h3>释义</h3>
<p>【第162部部首字·一級字根】从大上插一。“大”指跨騎，即成人，上插“一”表示簪髮之意。古代不同年齡的人髮式不一樣，男子二十行加冠禮，要將頭髮用頭巾包好，並插上簪子固定，表示已經成人，能勝任田間勞作，可以結婚了。故其本義指成年男子。fū，《說文》：“丈夫也。从大，一以象簪也。周制以八寸為尺，十尺為丈。人長八尺，故曰丈夫。凡夫之屬皆从夫。甫無切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
