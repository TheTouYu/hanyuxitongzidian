<h2>辡 <small>biàn</small></h2>
<h3>释义</h3>
<p>【第438部部首字·一級字根】从辛的二疊。“辛”，指小的刻刀；二疊，表示極致。象意條分縷析。“辧（bàn）”的初文，《說文》：“判也。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 b（擬態「闭剥」），取「闭」一面；本部未列 02z 表，按緒論推。</p>
