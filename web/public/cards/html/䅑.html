<h2>䅑 <small>ruí</small></h2>
<h3>释义</h3>
<p>妥部字族③「成把、成束」；《集韻》以「捰，理也，或作挼」證妥部與「果」音義相通（p300）。</p>
<h3>声母拟态</h3>
<p>日母r，「柔銳」取「柔」：禾稈柔，攏之成把。</p>
