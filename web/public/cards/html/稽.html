<h2>稽 <small>jī</small></h2>
<h3>本义</h3>
<p>稽，jī：从禾旨聲（一說从尤），《說文》「留止也」，本义为留止、稽考。 （《說文》「留止也」，古兮切）</p>
<h3>转义</h3>
<p>引申为稽首（叩头至地）、稽查、滑稽（jī）。</p>
<h3>音源</h3>
<p>旨聲：旨有旨意、審察義，故稽取「審察留止」。</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：稽留稽考，事聚於前而一一審之。</p>
<h3>字族衍义</h3>
<p><b>多指穀穗的懸垂，表示堅硬、叩首</b></p>
