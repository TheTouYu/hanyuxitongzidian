<h2>析 <small>xī</small></h2>
<h3>释义</h3>
<p>【第390部部首字·一級字根】从斤从木。可以象意砍伐樹木；也可以指砍破木頭。xī，《說文》：“破木也。一曰折也。从木从斤。先激切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
