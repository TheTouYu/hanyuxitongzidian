<h2>畕 <small>jiāng</small></h2>
<h3>释义</h3>
<p>【第538部部首字·一級字根】“畕”从田的二疊。“田”，指田地；二疊，表示田與田之間。象意田與田之間的邊界。jiāng，《說文》：“比田也。从二田。凡畕之屬皆从畕。居良切。”可能是為了區別“畾”，西周金文在之間加上表示界劃的“一”作“畺”。《說文》：“界也。从畕；三，其界畫也。，畺或从彊、土。居良切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 j（擬態「聚决」），取「决」一面；本部未列 02z 表，按緒論推。</p>
