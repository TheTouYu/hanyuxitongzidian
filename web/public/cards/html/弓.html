<h2>弓 <small>gōng</small></h2>
<h3>释义</h3>
<p>【第172部部首字·一級字根】象弓弦形。gōng，《說文》：“以近窮遠。象形。古者揮作弓。《周禮》六弓：王弓、弧弓以射甲革甚質；夾弓、庾弓以射干矦鳥獸；唐弓、大弓以授學射者。凡弓之屬皆从弓。居戎切。”</p>
<h3>声母拟态</h3>
<p>聲母義：今讀 gōng；未列 02z，按緒論取一面未判（02z 未收）。</p>
