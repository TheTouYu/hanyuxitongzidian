<h2><img class="cim" src="/glyphs/chars/27b2d.png"> <small>huà</small></h2>
<h3>释义</h3>
<p><img class="cim" src="/glyphs/chars/29c2b.png">（<img class="cim" src="/glyphs/chars/29c2c.png">）：甲骨文从鬲上有斜口形，象意側邊開口的鬲器，當是陶爐與釜的組合（p497）；轉義比喻歪嘴（wāi，《集韻》引《說文》「口戾不正也」）。辯證：所从「<img class="cim" src="/glyphs/chars/21552.png">」本為小篆訛「口」而成，跟倒止之「<img class="cim" src="/glyphs/chars/21552.png">（夊）」無關，故《說文》「从鬲<img class="cim" src="/glyphs/chars/21552.png">聲」析形不確。音源：借音字（同咼）。字族多指口不正、歪斜（p501-503）。</p>
<h3>声母拟态</h3>
<p>曉母h，「豁活」取「豁」：言不由衷，豁然脫口。</p>
