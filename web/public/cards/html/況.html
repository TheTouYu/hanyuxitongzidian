<h2>況 <small>kuàng</small></h2>
<h3>释义</h3>
<p>【第518部「兄部」·兄支】兄＝从人上有口，象口呼其名，表示成年（男子二十冠而字）；轉義年長、大；名字非其人，故有比況、恍惚義；音源借「光」。</p>
<h3>声母拟态</h3>
<p>k「口控」取「控」：比擬而控。</p>
