<h2>䨰 <small>pò</small></h2>
<h3>字根本义</h3>
<p>【421 革部·䨣声族】䨣＝从雨从革，皮革挡雨（《说文》「雨濡革也」）；皮虽挡雨而不能久，久则渗漏、濡湿处发胀凸起（《段注》「雨濡革则虚起」），故此族多取「鼓起、虚胀、覆压」义，分化出霸、坝、欛、怕、灞。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《玉篇》「雨也」；濼之或体，陂泽、古国名。</p>
<h3>横向对照</h3>
<p>同取革部「皮革绷张／雨濡虚起」一面，形符各定其落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>p「拼辟」取「辟」：雨辟而落。</p>
