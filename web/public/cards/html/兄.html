<h2>兄 <small>xiōng</small></h2>
<h3>释义</h3>
<p>【第518部部首字·一級字根】从人上有口，象意能口呼其人，表示人的成年。古代在人成年時，要舉行加冠儀式，並有了正式的名字。《禮·曲禮》：“男子二十冠而字。”《儀禮·士冠禮》：“冠而字之，敬其名也。君父之前稱名，他人則稱字也。又女子許嫁筓而字。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 x（擬態「续消」），取「消」一面；本部未列 02z 表，按緒論推。</p>
