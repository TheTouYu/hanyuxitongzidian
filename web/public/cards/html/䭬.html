<h2>䭬 <small>qǐ</small></h2>
<h3>释义</h3>
<p>䭬qǐ《說文》：“下首也。从<img class="cim" src="/glyphs/chars/29810.png">旨聲。康禮切。”叩頭至地。即恭敬之至意。</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「亲」：叩頭至地，身就下而親近於地。</p>
