<h2>脃 <small>cuì</small></h2>
<h3>本义</h3>
<p>脃，cuì：《說文》「小耎易斷也。从肉从絕省。此芮切。」《集韻》「耎易破也。或作脺。」《正字通》「輕也。」脆弱、易斷；俗作「脆」。</p>
<h3>讹字说明</h3>
<p>原稿列於「形近字『危、巵、兌、包』之訛」一組（脃條正文無訛字語）。</p>
<h3>声母拟态</h3>
<p>wei組取「聚」：脃，cuì：《說文》「小耎易斷也。从肉从絕省。此（推）。</p>
