<h2>稞 <small>kē / huà</small></h2>
<h3>释义</h3>
<p>果為第348部部頭（《卷六十  <img class="cim" src="/glyphs/chars/267c0.png">.docx》p241）：「木實也，从木，象果形在木之上」——樹上結的果實。部內諸字皆从果得聲，取果之「包於皮內、中空含實、去皮見肉」諸面。</p>
<h3>声母拟态</h3>
<p>溪母k，「口控」取「空」：殼去則空，青稞裸粒無殼。</p>
