<h2>暍 <small>yē</small></h2>
<h3>释义</h3>
<p>从日曷聲：《說文》「傷暑也」，中暑；日曝口渴。</p>
<h3>声母拟态</h3>
<p>y 零聲母不系；此條為中暑，原文只錄（照實）。</p>
