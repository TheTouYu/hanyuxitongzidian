<h2>车 <small>chē</small></h2>
<h3>释义</h3>
<p>【第87部部首字·一級字根】甲骨文象兩輪車形，或省為兩輪及軸。周代金文或省為一輪，為小篆所本。chē，《說文》：“輿輪之緫名。夏后時奚仲所造。象形。凡車之屬皆从車。，籀文車。尺遮切。”</p>
<h3>声母拟态</h3>
<p>聲母義（車部）：声母义（ch·弱）</p>
