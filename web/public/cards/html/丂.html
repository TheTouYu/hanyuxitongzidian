<h2>丂 <small></small></h2>
<h3>释义</h3>
<p>【第34部部首字·一級字根】甲骨文从丿往一（上）形。“丿”，象細長而韌挺之物；从“上”，象意細長的脖子伸而向上。在動物中，脖子又長又靈活的莫過于雁、鵝之屬。因此，可能本代指雁、鵝。即“鴚（gē）”的初文，《說文》：“鴚鵝也。从鳥可聲。古俄切。”</p>
<h3>声母拟态</h3>
<p>聲母義（丂部）：声母义（k·强） 辨證：由于西周晚期，“丿”寫得曲，形似“勹”，小篆承之。故《說文》：“丂，气欲舒出勹上礙于一也。丂，古文以為亐（yú）字，又以為巧字。凡丂之屬皆从丂。苦浩切。”析形不確。所指“亐”本即“于”，也當是因形近而誤。</p>
