<h2>脆 <small>cuì</small></h2>
<h3>字根本义</h3>
<p>【475 毳部】毳＝从毛的三叠，毛指动物毛发，三叠表示极致；象意有三：毛之极细、绒毛之密、细毛所成之毳衣。轉義由毛之极细引申脆弱、柔美。音源借「脆」（細弱義同）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从肉毳省聲：《說文》「小耎易斷也」，脆嫩、脆弱。</p>
<h3>横向对照</h3>
<p>同取毳部「毛极细、耎易破」两面：肉取其耎，木取其滑行。</p>
<h3>声母义</h3>
<p>c取持：肉嫩易断。</p>
