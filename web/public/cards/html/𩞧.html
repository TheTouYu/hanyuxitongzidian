<h2><img class="cim" src="/glyphs/chars/297a7.png"> <small>shǎng</small></h2>
<h3>释义</h3>
<p>【第533部「象部」】象＝象大象形（《說文》「南越大獸，長鼻牙，三年一乳」）；殷人曾馴象，象南遷而中原無象，故引申想象、形象、仿效（《正字通》「形象、肖似」）；音源字（源自象鳴）。字族：①象鼻 ②象身軀。</p>
<h3>声母拟态</h3>
<p>sh「失收」取「收」：食而收。</p>
