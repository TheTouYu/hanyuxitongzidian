<h2>卬 <small>yǎng</small></h2>
<h3>释义</h3>
<p>【第198部部首字·一級字根】从匕从ㄗ。“匕”，指俯伏；“ㄗ”，為人跪跽形。象意由俯伏而抬頭伸腰。yǎng，《廣雅》：“仰、卬，舉也。”《玉篇》：“俯卬，今作仰。”</p>
<h3>声母拟态</h3>
<p>聲母義：零聲母（今讀 yǎng）——古屬影／喻／疑一系，無輔音擬態可系，義靠義類與字形。</p>
