<h2>㸋 <small>fán</small></h2>
<h3>字根本义</h3>
<p>【434 釆部·番支】番（fán）＝从甶（面具，代指簸箕状器具）从釆（分辨），象意用簸箕簸扬淘洗、筛出谷米杂质——播之初文；亦解为兽类宽圆足印（《说文》「兽足谓之番」）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>《说文》「宗庙火孰肉，从炙番声」——反来覆去烤熟的祭肉。</p>
<h3>横向对照</h3>
<p>同取番部「簸扬翻动」一面，形符各定落点；故声符给义、形符定落点。</p>
<h3>声母义</h3>
<p>f取分：翻炙而分。</p>
