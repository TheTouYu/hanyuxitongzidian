<h2>救 <small>jiù</small></h2>
<h3>释义</h3>
<p>【第541部「求部」】求＝象獸皮衣之形（毛在外），「裘」之初文，《說文》「皮衣也」；引申求索、請求（借為干求之求）。</p>
<h3>声母拟态</h3>
<p>j「聚决」取「聚」：止聚而决。</p>
