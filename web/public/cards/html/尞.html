<h2>尞 <small>liáo</small></h2>
<h3>释义</h3>
<p>【第552部部首字·一級字根】甲骨文从火从木，“木”或作交織之形，指架柴焚燒；上或有許多小點，表示燃燒時騰起的煙塵。“燎（liǎo）”的初文，《集韻》：“火在地曰燎。”“縱火焚也。”《玉篇》：“火在門外曰燭，于内曰庭燎。國之大事樹以照衆也。”意思是為了某件國家大事，夜裏召集眾人，而燃起大火堆。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 l（擬態「拢离」），取「离」一面；本部未列 02z 表，按緒論推。</p>
