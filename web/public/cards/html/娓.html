<h2>娓 <small>wěi</small></h2>
<h3>字根本义</h3>
<p>【484 尾部】尾＝象人後有尾之形（古人或飾系尾，西南夷皆然），本指尾巴，引申末端、尾隨；音源借音，尾狀如穗，義音同「彗」（《書》「鳥獸孳尾」，《史記》作「微」）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从女尾聲：《說文》「順也」，娓娓而談、柔順。</p>
<h3>横向对照</h3>
<p>同取尾部「末端垂垂」與毀部「擊打破損」兩面：女取其順，火阜取其破。</p>
<h3>声母义</h3>
<p>w取末：女順而末。</p>
