<h2>冃 <small>mào</small></h2>
<h3>释义</h3>
<p>【第306部部首字·一級字根】甲骨文象帽之形；或上加兩耳形作為裝飾。西周金文加“目”作“冒”，表示頭所戴；後又加“巾”作“帽”。mào，《玉篇》：“冃，或作帽。”《正字通》：“師古曰：冒若人首之有覆冒。”《廣韻》：“帽，頭帽。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 m（擬態「蒙末」），取「末」一面；本部未列 02z 表，按緒論推。</p>
