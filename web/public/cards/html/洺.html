<h2>洺 <small>míng</small></h2>
<h3>釋義</h3>
<p>洺míng《新附》：“水名。从水名聲。武幷切。”洺河，在河北省武安市境內，分南北兩條，夏日水位較深，冬季有乾涸現象，季節性較為突出。疑指水線如銘刻。</p>
<h3>字理分析</h3>
<p>聲旁為「名」，其古文字字形、本義、轉義、辯證、音源、字族衍義見字根卡「名」（本頁會自動鏈接呈現）。</p>
<h3>聲母擬態</h3>
<p>今讀 míng：按聲母取緒論擬態義一面（細辨見字根卡「名」）。</p>
