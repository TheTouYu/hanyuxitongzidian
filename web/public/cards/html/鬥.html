<h2>鬥 <small>dòu</small></h2>
<h3>释义</h3>
<p>鬥，dòu：象两人徒手相搏之形，本义为争斗（《說文》「兩士相對，兵杖在後」象鬥之形）。</p>
<h3>声母拟态</h3>
<p>d「囤动」取「动」：相搏而动（推）。</p>
