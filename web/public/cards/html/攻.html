<h2>攻 <small>gōng</small></h2>
<h3>字根本义</h3>
<p>【500 工部】工＝象規矩之器（一說夯築之具），本義工具、工匠、工巧（《說文》「巧飾也」）；轉義工程、官吏、擅長。部內从工諸字多取「器用、工巧、中空方正」三面。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从攴工聲：擊也（《說文》「擊也」），引申攻治。</p>
<h3>横向对照</h3>
<p>同取工部「器用、工巧、中空」一面：水取其流，穴取其虛，金取其固。</p>
<h3>声母义</h3>
<p>g取隔：擊以隔物。</p>
