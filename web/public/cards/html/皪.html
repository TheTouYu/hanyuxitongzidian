<h2>皪 <small>lì</small></h2>
<h3>释义</h3>
<p>【第555部「樂部」】樂＝甲骨文从絲从木，象意有二：絲弦繃於木（琴瑟，yuè）或產絲之柞樹（櫟之初文，lì）；字族取「治病、光潔、堅硬、車碾」諸面。</p>
<h3>声母拟态</h3>
<p>l取拢离：白而離。</p>
