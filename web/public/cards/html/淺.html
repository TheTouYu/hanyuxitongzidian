<h2>淺 <small>qiǎn</small></h2>
<h3>释义</h3>
<p>【第559部「戔部」】戔＝从戈之二疊：兩戈相對象戰爭殘害（《說文》「賊也。从二戈」）；疊體亦表極致，指似戈而短小的器物（錢之初文）；引申淺少、棚構。</p>
<h3>声母拟态</h3>
<p>q「亲缺」取「缺」：水淺而缺。</p>
