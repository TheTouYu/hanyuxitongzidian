<h2><img class="cim" src="/glyphs/chars/22035.png"> <small>hàn</small></h2>
<h3>字根本義</h3>
<p>己（<img class="cim" src="/glyphs/chars/22012.png">jǐ）：象磚石等壘疊所形成的縫隙形，表示累積、堆疊（《釋名》「紀也，皆有定形，可紀識也」）。轉義：相對的個體→自己本身；累疊之狀→傾覆崩塌（分化為圮）。字族衍義：①磚縫→堆疊、編結、接續；②形近「厶、尸、弓」之訛。</p>
<h3>字形</h3>
<p>字形：古文字字形庫未收；原稿該條前後無獨立插圖。</p>
<h3>形旁声旁</h3>
<p>从二己，《海篇》「音旱」——己的二迭，裂縫多之意；疑指乾旱（旱則地裂如己）。</p>
<h3>横向对照</h3>
<p>①組之疊：己象磚縫，二己則縫多，故為旱裂。</p>
<h3>声母义</h3>
<p>h「豁活」取「豁」：地豁裂。</p>
