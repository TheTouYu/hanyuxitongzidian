<h2>㚔 <small>niè</small></h2>
<h3>释义</h3>
<p>【第379部部首字·一級字根】甲骨文象古代的桎梏之形。根據其字形來看，最初可能是一種捕捉鳥獸的裝置：其形制大抵用兩塊竹板做成，兩頭捆緊，中間用物撐開。當鳥獸踏足中間時，撐物會脫落，竹板會隨之夾住該鳥獸的腿。後來用于拷住人的手腕，其衍生字“執（zhí）”可資佐證。《說文》：“執，捕罪人也。从丮，从㚔，㚔亦聲。之入切。”</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 n（擬態「纳弄」），取「弄」一面；本部未列 02z 表，按緒論推。</p>
