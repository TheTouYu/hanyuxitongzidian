<h3>释义</h3>
<p>部頭多：从夕的二疊——「夕」象殘月，二疊表示極致；月除月中兩三天外皆不圓，故《釋名》「月，缺也」，多象缺口極大，表示張開、廣大，可謂「哆」之初文。月缺時多、月月重複，故又象意數量多（《說文》「重也，从重夕」）。另源：古「夕、肉」形近，或从「肉」二疊，象肉肥美，為「䏧」之初文。轉義：重、大、勝出、剩餘；由張大引申歪斜不正。辯證古文與「邑」相混。音源借音，義音同「也」。字族①月缺張大②肉多肥大。</p>
<h3>声母拟态</h3>
