<h2>螇 <small>xī</small></h2>
<h3>释义</h3>
<p>螇（<img class="cim" src="/glyphs/chars/27549.png"><img class="cim" src="/glyphs/chars/272c9.png">）xī《說文》：“螇鹿，蛁蟟也。从虫奚聲。胡雞切。”知了。qī，《集韻》：“與<img class="cim" src="/glyphs/chars/27549.png">、<img class="cim" src="/glyphs/chars/272c9.png">同。土蜂也。”《爾雅》：“蟿螽，螇蚸。”郭璞注：“今俗呼似蜙䗥而細長，飛翅作聲者為螇蚸。”一種蝗蟲。</p>
<h3>声母拟态</h3>
<p>x「续消」取「续」：知了鳴聲連續不斷。</p>
