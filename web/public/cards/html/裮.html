<h2>裮 <small>chāng</small></h2>
<h3>释义</h3>
<p>【第526部「昌部」】昌＝甲骨文从日从口：對日叫喚，古老拜日儀式，與「昜」同意；引申美言精當（《說文》「美言也」）、興盛（《玉篇》「盛也、明也」）。音源：叫喚聲；古昌、尚通用。字族三面：唱與娼妓／興盛／形近訛字。</p>
<h3>声母拟态</h3>
<p>ch取刺持：衣披而持。</p>
