<h2>匚 <small>fāng</small></h2>
<h3>释义</h3>
<p>【第514部部首字·一級字根】甲骨文象槽器形，指箭杆矯正器。箭杆一般是細的竹木做成，去皮後，要通過矯直、磨光才行，其中要用到的工具就是刻槽石器。可謂“匡（kuāng）”的初文，《廣韻》：“輔助也。正也。”比較接近其本義。</p>
<h3>声母拟态</h3>
<p>聲母義：聲母 f（擬態「附分」），取「分」一面；本部未列 02z 表，按緒論推。</p>
