<h2>麤 <small>cū</small></h2>
<h3>释义</h3>
<p>【第601部部首字·一級字根】甲骨文本从鹿的二疊。“鹿”，指哺乳動物鹿。鹿較之一般動物，主要有三大特點：一是雄鹿的角呈枝杈狀，常相角鬥；二是腿細長，善於奔跑；三是作為體量比較小的食草動物，為防備天敵，十分小心。二疊表示極致。因此，象意也有三：</p>
