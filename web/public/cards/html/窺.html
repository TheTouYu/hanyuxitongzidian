<h2>窺 <small>kuī</small></h2>
<h3>字根本义</h3>
<p>【468 規部】規＝商代金文象畫圓的兩腳規形，戰國古文演成「夫」而加形旁「見」（圓睜雙眼、圓形顯現）；轉為法度、規矩；音源借「圭」（規圭通用）。</p>
<h3>字形</h3>
<p>字形：古文字字形库未收。</p>
<h3>形旁声旁</h3>
<p>从穴規声——从小孔偷看，引申窥伺、窥测。</p>
<h3>横向对照</h3>
<p>同取規部「圆规画圆、圆睁惊视」两面：目取视，穴与门取孔受限。</p>
<h3>声母义</h3>
<p>k「口控」取「控」：穴孔受限。</p>
