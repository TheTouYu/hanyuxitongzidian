<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统汉语字典</title>
<style>
:root{--ink:#1f1b16;--mut:#8a7f70;--line:#e6ddd0;--bg:#fbf7f0;--card:#fffdf8;--acc:#8c2f1e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",serif}
header{padding:18px 22px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#fffdf8,#fbf7f0)}
h1{margin:0;font-size:20px;letter-spacing:.08em}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 74px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:12px}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;font-family:inherit}
.hint{color:var(--mut);font-size:12px;margin:8px 2px 0}
.list{overflow:auto;flex:1}
.item{padding:9px 14px;border-bottom:1px dashed var(--line);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.item:hover{background:#f6efe2}
.item b{font-size:20px;min-width:26px}
.item .m{color:var(--mut);font-size:12px}
.item.on{background:#efe3d2;box-shadow:inset 3px 0 0 var(--acc)}
main{overflow:auto;padding:20px 26px}
.empty{color:var(--mut);margin-top:40px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:980px;margin:0 auto}
.chead{display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.chead .ch{font-size:26px;line-height:1}.smalt{font-size:.55em;color:#7a6a55;letter-spacing:0;font-weight:400}
.chead .py{color:var(--mut);font-size:15px;letter-spacing:.06em}
.chead .bu{margin-left:auto;color:var(--mut);font-size:13px}
.sec{margin:14px 0 18px}
.sec h3{margin:0 0 6px;font-size:15px;color:var(--acc);letter-spacing:.06em;font-weight:600}
.sec p{margin:0;font-size:15.5px;line-height:1.95;white-space:pre-wrap}
.cites{margin-top:6px;font-size:11px;color:var(--mut)}
.glyphs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.glyphs figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.glyphs img{height:78px;display:block}
.gscroll{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scroll-behavior:smooth}
.gscroll img{height:96px;display:block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
.gscroll figure{margin:0;text-align:center;flex:0 0 auto}
.gscroll figcaption{font-size:11px;color:var(--mut);margin-top:2px;letter-spacing:.5px}
.tag{display:inline-block;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:6px}
.ct{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:14.5px}
.ct th,.ct td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.ct th{background:#f4ecdf;font-weight:600;color:#5c4a37;font-size:13px}
.ct td.zc{font-size:20px;width:56px;text-align:center}
.rootbox{background:#f7f1e6;border:1px dashed #d9c9b2;border-radius:10px;padding:10px 14px}
.grp{margin:8px 0 14px}
.grp h4{margin:8px 0 4px;font-size:14px;color:#5c4a37}
.grp .gnote{font-size:12.5px;color:var(--mut);margin:0 0 6px}
.vbox{margin:8px 0;padding:8px 10px;background:#f6f0e4;border:1px solid #e2d4b8;border-radius:6px;font-size:14px}
.vbtn{margin:0 4px;padding:2px 8px;border:1px solid #c9a86a;background:#fff;border-radius:4px;cursor:pointer}
.vnote{color:#8a7a5c;font-size:12px}
.ph{display:flex;gap:10px;align-items:baseline;margin:6px 0 10px}.ph .ch{font-size:40px;line-height:1}

.ct td:first-child,.ct th:first-child{white-space:nowrap;width:1%}
.ch,.card,.famln,.gscroll figcaption{font-family:"Microsoft YaHei","SimSun-ExtB","Segoe UI Symbol",sans-serif}
@font-face{font-family:'SimSunExtB';src:url('fonts/SimSunExtB.ttf') format('truetype');font-display:swap}
.card,.ch,.famln,.ct td,.ct th,.item b{font-family:'Microsoft YaHei','SimSunExtB','SimSun-ExtB','Segoe UI Symbol',sans-serif}
.gin{height:1.6em;vertical-align:-0.4em;margin:0 3px;border:1px solid #eee}.cch{height:1.05em;vertical-align:-0.12em}
.cim{height:2.1em;vertical-align:-0.45em;margin:0 2px}.chead .ch .cim{height:2.1em;vertical-align:-0.45em;margin:0 2px}
.pscroll{display:flex;flex-wrap:wrap;gap:10px}.pscroll figure{margin:0;text-align:center}.pscroll img{max-height:220px;max-width:100%;border:1px solid #e7e0d2;border-radius:6px;background:#fff}.pscroll figcaption{font-size:11px;color:#999;margin-top:2px}</style>
</head>
<body>
<script>
window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#b00020;color:#fff;padding:8px 10px;font:13px/1.5 ui-monospace,Menlo,monospace;z-index:99999';d.textContent='[页面出错] '+(e.message||'')+' @ '+(e.filename||'')+':'+(e.lineno||'');document.body.appendChild(d);});
window.addEventListener('unhandledrejection',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#8a5a00;color:#fff;padding:8px 10px;font:13px/1.5 ui-monospace,monospace;z-index:99999';d.textContent='[异步出错] '+(e.reason&&(e.reason.message||e.reason)||'');document.body.appendChild(d);});
</script>
<header>
  <h1>系统汉语字典</h1>
  <div class="sub">按字、拼音或卡片正文检索；点左侧结果看五步卡。数据来自 <code>/cards/&lt;字&gt;.json</code> 与 <code>/glyphs/</code>。</div>
</header>
<div class="wrap">
  <aside>
    <div class="search">
      <input id="q" placeholder="输入字 / 拼音 / 关键词，如 申、shēn、闪电" autocomplete="off">
      <div class="hint" id="hint">加载索引…</div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"><div class="empty">← 输入一个字开始</div></main>
</div>
<script>
const $=s=>document.querySelector(s);
let IDX=[], GLYPH={}, cur='';
const norm=s=>(s||'').toLowerCase();
fetch('cards/index.json?v='+Date.now()).then(r=>r.json()).then(d=>{IDX=d;$('#hint').textContent=`共 ${d.length} 张卡`;render('');}).catch(e=>$('#hint').textContent='索引加载失败：'+e);
fetch('glyphs/index.json').then(r=>r.json()).then(d=>{GLYPH=d.chars||d;}).catch(()=>{});
fetch('glyphs/photos/index.json?v='+Date.now()).then(r=>r.json()).then(d=>{window.PHOTO=d.photos||d;}).catch(()=>{}); fetch('glyphs/photos/captions.json?v='+Date.now()).then(r=>r.json()).then(d=>{window.CAPS=d.captions||d;}).catch(()=>{});
function match(q){
  q=norm(q.trim()); if(!q) return IDX.slice(0,200);
  const exact=IDX.filter(x=>x.c===q||((x.a||[]).includes(q))||((x.v||[]).includes(q))).sort((a,b)=>(b.c===q)-(a.c===q));
  if(exact.length) return exact.concat(IDX.filter(x=>x.c!==q&&!((x.a||[]).includes(q))&&!((x.v||[]).includes(q))&&(norm(x.p).startsWith(q))).slice(0,80));
  return IDX.filter(x=>norm(x.c).includes(q)||((x.a||[]).some(t=>norm(t).includes(q)))||((x.v||[]).some(t=>norm(t).includes(q)))||norm(x.p).includes(q)).slice(0,120);
}
window.fillFam=(ch)=>{fetch('cards/'+encodeURIComponent(ch)+'.json?v='+Date.now()).then(r=>r.json()).then(d=>{const seen=new Set(),names=[];(d.sections||[]).forEach(s=>(s.groups||[]).forEach(g=>(g.rows||[]).forEach(r=>{const raw=String(r[0]||'').trim();let c=raw.replace(/（.*?）|\(.*?\)/g,'').trim();if(c&&!seen.has(c)){seen.add(c);names.push({c:c,raw:raw});}})));const sp=document.getElementById('famspan');if(!names.length){kh=IDX.filter(x=>x.pr===ch).map(x=>x.c);kh.forEach(c=>names.push({c:c,raw:c}));}
if(sp&&names.length){sp.innerHTML='　<label>字族</label>　'+names.map(n=>famln(n.c,n.raw)).join('');bindHint();}}).catch(()=>{});};
const famln=(ch,raw)=>{const it=IDX.find(x=>x.c===ch)||IDX.find(x=>((x.a||[]).includes(ch)));const al='';const lab=ch;return `<a data-c="${esc(ch)}" style="color:#8a5a2b;text-decoration:none;border-bottom:1px dashed #d8b48a;margin:0 2px;cursor:pointer">${esc(lab)+esc(al)}</a>`;};
window.bindHint=()=>{document.querySelectorAll('#hint a[data-c]').forEach(a=>a.onclick=()=>open(a.dataset.c));};
function render(q){
  const rows=match(q);
  $('#list').innerHTML=rows.map(x=>`<div class="item${x.c===cur?' on':''}" data-c="${x.c}"><b>${x.c}</b><span class="m">${x.p||''}</span><span class="m">${x.ch?(function(){var L='第'+x.ch+'章'+(x.cn?' '+x.cn:'');return (x.cc?('<a href="javascript:void(0)" class="chp" onclick="goCard(\''+x.cc+'\')">'+L+'</a>'):L);}()):(x.b?('第'+x.b+'部'):'')} ${x.ch?'':(x.n||'')}</span></div>`).join('')||'<div class="empty">无结果</div>';
  const base=q?`命中 ${rows.length} 张`:`共 ${IDX.length} 张卡`;
  let rel='';
  if(q){
    const byChar=ch=>IDX.find(x=>x.c===ch)||IDX.filter(x=>((x.a||[]).includes(ch))).sort((p,q)=>{const s=y=>((y.a||[])[0]===ch?0:1);return ((q.b||0)-(p.b||0))||(s(p)-s(q));})[0];
    const curRow=(cur&&rows.find(r=>r.c===cur&&(!q||r.c===q||(r.a||[]).includes(q)||(r.v||[]).includes(q))))||null;
    let t=curRow||byChar(q)||rows.find(r=>r.lv>0)||rows[0];
    if(t){
      const chain=[];let p=(t.pr||'');let guard=0;
 while(p&&guard++<5){chain.push(p);const pc=byChar(p);const nx=pc?pc.pr:'';if(nx===p)break;p=nx;}
 if(t.rc&&t.rc.length){chain.length=0;(t.rc).forEach(x=>chain.push(x));}
 else if(t.lv>=2){if(t.lv>=3)chain.reverse();const isRoot=(t.lv===2)||!!t.grade||IDX.some(x=>x.pr===t.c);if(isRoot)chain.push(t.c);}
      const kids=IDX.filter(x=>x.pr===t.c).map(x=>x.c);
      const ln=(ch)=>{const it=IDX.find(x=>x.c===ch)||IDX.find(x=>((x.a||[]).includes(ch)));const as=(it&&it.a||[]).filter(x=>x!==(it?it.c:ch));const al=as.length?('（'+as.join('/')+'）'):'';const lab=(it?it.c:ch);return `<a data-c="${esc(ch)}" style="color:#8a5a2b;text-decoration:none;border-bottom:1px dashed #d8b48a;margin:0 2px;cursor:pointer">${esc(lab)}</a>`;};
      const rl=t.rlb?esc(t.rlb):((t.rc2&&t.rc2.length)?t.rc2.map(o=>'<a data-c=\"'+esc(o.ch)+'\" style=\"color:#8a5a2b;text-decoration:none;border-bottom:1px dashed #d8b48a;margin:0 2px;cursor:pointer\">'+esc(o.label)+'</a>').join(' → '):(chain.length?chain.map(ln).join(' → '):'—'));
      let fam='';
      if(t.lv===3&&t.pr&&!t.rl){const seenS=new Set([t.c]);const sibs=[];
        IDX.filter(x=>x.pr===t.pr).forEach(x=>{const it=byChar(x.c)||x;const key=it.c;if(seenS.has(key))return;seenS.add(key);sibs.push(key);});
        if(sibs.length){const show=sibs.slice(0,24);fam='　同族　'+show.map(ln).join('')+(sibs.length>show.length?'…':'');}}
      if(t.chapter||t.ch){const vols=IDX.filter(x=>x.ch&&x.ch===t.ch&&(x.c||'').indexOf('卷')===0).map(x=>x.c);rel=vols.length?('<span style="margin-left:14px">'+vols.map(ln).join('　')+'</span>'):' ';}else{rel=`<span style="margin-left:14px">字根　${rl}${fam}<span id="famspan"></span></span>`;}
      if(!(t.chapter||t.ch)) window.fillFam(t.c);
    }
  }
  $('#hint').innerHTML=base+rel;
  bindHint();
  $('#list').querySelectorAll('.item').forEach(el=>el.onclick=()=>open(el.dataset.c));
}
function PX(s){const A=(s&&s.paras)||[];if(!A.length)return '';return A.map(x=>'<p>'+esc(x)+'</p>').join('');}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const gt=(t,dir)=>esc(t).replace(/\{\{([^}]+)\}\}/g,(m,f)=>`<img class="gin" src="/glyphs/${dir}/${f}">`);
function esc2(s){return esc(String(s==null?'':s)).replace(/[\u{20000}-\u{2FFFF}]/gu,c=>'@@IMG@@'+c.codePointAt(0).toString(16)+'@@').replace(/@@IMG@@([0-9a-f]+)@@/g,(m,h)=>'<img class="cch" data-t="&#x'+h+';" src="glyphs/chars/'+h+'.png" onerror="this.replaceWith(document.createTextNode(this.dataset.t))">');}
function sm(s){return esc2(s).replace(/（[^）]{1,12}）/g,m=>'<span class="smalt">'+m+'</span>');}
const GGRP=s=>{if(!s.groups||!s.groups.length)return '';return ((s.paras&&s.paras.length)?s.paras.map(x=>'<p class="gnote">'+esc(x)+'</p>').join(''):(s.text?'<p class="gnote">'+esc(s.text)+'</p>':''))+s.groups.map(g=>`<div class="grp">${g.title?'<h4>'+esc(g.no||'')+esc(g.title)+'</h4>':''}<p class="gnote">${esc(g.note||'')}</p><table class="ct"><thead><tr>${(((g.title||'').indexOf('部目')>=0)?['部目','字根','中心义','字族']:(g.header||((g.rows&&g.rows[0]&&String(g.rows[0][0]).slice(-1)==='部')?['部目','字根','中心义','字族']:['字','读音','类属','取义落点']))).map(t=>'<th>'+esc(t)+'</th>').join('')}</tr></thead><tbody>${g.rows.map((r,i)=>`<tr><td class="${g.header?'':'zc'}">${(g.links&&g.links[i])?('<a href="javascript:void(0)" onclick="goCard(\''+g.links[i]+'\')">'+esc2(r[0])+'</a>'):esc2(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`).join('');};
const TTBL=s=>{if(!s.rows||s.rows.length<3)return '';const head='<tr><th>字</th><th>类属</th><th>取义落点</th></tr>';return `<table class="ct"><thead>${head}</thead><tbody>${s.rows.map(r=>`<tr><td class="zc">${esc2(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`;};
const secHTML=(s,ch2)=>{ const g2=(GLYPH[ch2]&&(GLYPH[ch2].files||[]))||[]; const st=g2.length?('<div class="gscroll">'+g2.map((f,i)=>'<figure><img loading="lazy" src="'+encodeURI('glyphs/'+ch2+'/'+(String(f).startsWith(ch2+'/')?String(f).slice(ch2.length+1):f))+'" alt=""><figcaption>'+String(i+1).padStart(2,'0')+'</figcaption></figure>').join('')+'</div>'):''; const zx=(s.key==='zixing'||/字形|古文字/.test(s.label||''))?st:''; let body=''; try{ body=GGRP(s)+TTBL(s); }catch(e){ body='<p class="err">表格渲染失败：'+esc(String(e))+'</p>'; } let txt=''; if(!(s.groups&&s.groups.length)){  if(s.paras&&s.paras.length){ const _gd=s.gdir||d.gdir; txt=s.paras.map(x=>'<p>'+(_gd?gt(x,_gd):esc(x))+'</p>').join(''); }  else if(s.text){ const t2=String(s.text);   if(s.gdir){ txt='<p>'+gt(t2,s.gdir)+'</p>'; }   else if(t2.indexOf('gscroll')>=0){ txt=t2; }   else { txt='<p>'+esc(t2).replace(/\{\{gin:([^}]+)\}\}/g,'<img class="gin" src="$1" alt="字形">')+'</p>'; }  } } const gimgs=(s.gimgs||[]).map(f=>'<img class="gin" src="glyphs/'+f+'">').join(''); const cimgs=(s.cimgs&&s.cimgs.length)?('<div style="display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px">'+s.cimgs.map(f=>{const o=(typeof f==='string')?{f:f}:(f||{});return '<figure style="margin:0;text-align:center"><img style="height:88px;border:1px solid #e7e0d2;border-radius:6px;background:#fff" src="glyphs/'+encodeURI(o.f||'')+'" alt="参证字形"><figcaption style="font-size:11px;color:#999">'+esc(o.cap||'')+'</figcaption></figure>';}).join('')+'</div>'):''; return '<div class="sec"><h3>'+esc(s.label||s.key)+'</h3>'+body+txt+zx+gimgs+cimgs+LKR(s)+'</div>';};
let VARIANT_MAP=null;
async function variantsFor(ch){
  if(!VARIANT_MAP){
    try{VARIANT_MAP=await (await fetch('cards/variants.json?v='+Date.now())).json();}catch(e){VARIANT_MAP={};}
  }
  const _rv=VARIANT_MAP[ch];const list=Array.isArray(_rv)?_rv:(_rv?[_rv]:[]);
  if(!list.length) return '';
  const btns=list.map(v=>`<button class="vbtn" onclick="goCard('${v}')">${v}</button>`).join(' ');
  return `<div class="vbox"><span>对应繁体/借字：</span>${btns}<span class="vnote">（分卡各释本义，勿混）</span></div>`;
}
const SEC_ORDER=['benyi','benyi2','zhuanyi','bianzheng','cankao','canzheng','zixing_rong','zixing_jv','yinyuan','shiyi','shengmu','zizu','zigen'];
const secRank=k=>{const i=SEC_ORDER.indexOf(k);return i<0?99:i;};
async function cardBody(ch,d,opt){
  if(d&&d.sections)d.sections.forEach(s=>{if(s.paras&&s.paras.length&&!(s.groups&&s.groups.length))s.text=s.paras.join('\n');});
  const vhtml=await variantsFor(ch);
  const _zs=(d.sections||[]).find(x=>x.key==='zixing'); const _gc=(_zs&&_zs.gdir)||d.gdir||ch; const g=(GLYPH[_gc]||GLYPH[ch]||{}).files||[];
  const gsrc=f=>encodeURI('glyphs/'+_gc+'/'+(String(f).startsWith(_gc+'/')?String(f).slice(_gc.length+1):f));
const strip=g.length?`<div class="gscroll">${g.map((f,i)=>`<figure><img loading="lazy" src="${gsrc(f)}" alt="${esc(ch)}" title="${esc(f)}"><figcaption>${String(i+1).padStart(2,'0')}</figcaption></figure>`).join('')}</div>`:((d.chapter||d.level===0)?'':'<p class="m" style="color:var(--mut)">（字形库未收本字古文字形）</p>');
  const grp=s=>{ if(!s.groups||!s.groups.length) return '';
  return s.groups.map(g=>`<div class="grp">${g.title?'<h4>'+esc(g.no||'')+esc(g.title)+'</h4>':''}<p class="gnote">${esc(g.note||'')}</p>
  <table class="ct"><thead><tr>${((g.title||'').indexOf('部目')>=0?['部目','字根','中心义','字族']:(g.header||['字','读音','类属','取义落点'])).map(t=>'<th>'+esc(t)+'</th>').join('')}</tr></thead><tbody>${g.rows.map(r=>`<tr><td class="zc">${esc2(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`).join('');
};
const tbl=s=>{ if(!s.rows||s.rows.length<3) return '';
  const head='<tr><th>字</th><th>类属</th><th>取义落点</th></tr>';
  return `<table class="ct"><thead>${head}</thead><tbody>${s.rows.map(r=>`<tr><td class="zc">${esc2(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`;
};
let hasZX=false;const isZX=s=>!(s.text||'').includes('gscroll')&&(s.key==='zigen'||s.key==='zixing'||/字形/.test(s.label||''));
const LKR=(s)=>((s&&s.links&&s.links.length)?("<p class=\"lks\">"+s.links.map(l=>"<a href=\"javascript:void(0)\" onclick=\"goCard('"+l.ch+"')\">"+esc(l.label)+"</a>").join(" · ")+"</p>"):"");
const ss=(d.sections||[]).find(s=>s.label==='所属卷'); const secs=(d.sections||[]).filter(s=>!isZX(s)&&s.label!=='所属卷').sort((a,b)=>(typeof a.ord==='number'?a.ord:200+secRank(a.key))-(typeof b.ord==='number'?b.ord:200+secRank(b.key))).map(s=>{ if(isZX(s)) hasZX=true;
  const zx='';
  return `<div class="sec"><h3>${esc(s.label||s.key)}</h3>${grp(s)}${tbl(s)}${(s.groups&&s.groups.length)?'':(s.text?('<p style="text-indent:2em">'+(s.gdir?gt(s.text,s.gdir):((s.text||'').indexOf('gscroll')>=0?s.text:esc(s.text).replace(/\{\{gin:([^}]+)\}\}/g,'<img class="gin" src="$1" alt="字形">'))).replace(/\n+/g,'</p><p style="text-indent:2em">')+'</p>'):'')}${zx}${(s.gimgs||[]).map(f=>`<img class="gin" src="glyphs/${encodeURI(f)}" alt="参证字形">`).join('')}${LKR(s)}${(s.cites&&s.cites.length)?`<div class="cites">${s.cites.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>`:''}</div>`;}).join('');

  const rootLink = (d.level===2 && d.parent && !(opt&&opt.embed)) ? `<div class="sec"><h3>所属字根</h3><p class="lks"><a href="javascript:void(0)" onclick="goCard('${d.parent}')">${esc(d.parent)}</a></p></div>` : ''; const parentBlock = (d.level>2 && d.parent) ? await (async()=>{ try{
      const pr=await fetch('cards/'+encodeURIComponent(d.parent)+'.json?v='+Date.now()); if(!pr.ok) return '';
      const p=await pr.json(); if(p&&p.sections){p.sections=p.sections.filter(s=>s.label!=='所属卷');}
      const pg=((GLYPH[d.parent]&&GLYPH[d.parent].files)||[]);
      const pgsrc=f=>encodeURI('glyphs/'+d.parent+'/'+(String(f).startsWith(d.parent+'/')?String(f).slice(d.parent.length+1):f));
      const pstrip=pg.length?`<div class="gscroll">${pg.map((f,i)=>`<figure><img loading="lazy" src="${pgsrc(f)}"><figcaption>${String(i+1).padStart(2,'0')}</figcaption></figure>`).join('')}</div>`:'';
      const pb=(p.bus||[])[0]||{};
      const inner=await cardBody(d.parent,p,{noPhoto:true});
      return `<div class="sec rootbox"><h3>字根「${esc(d.parentHead||d.parent)}」</h3>${inner}</div>`;
    }catch(e){ return ''; } })() : '';
  const LVN={1:'一级字根',2:'二级字根',3:'谐声字'};const _hasFam=(d.sections||[]).some(x=>x&&x.key==='zizu'&&(x.groups||[]).length);
  const lvlTag=(()=>{const s=d.grade||(d.rootLevel?({1:'一级字根',2:'二级字根',3:'谐声字'}[d.rootLevel]||''):(d.level===3&&_hasFam?'三级字根':(LVN[d.level]||'')));return s?`<span class="tag">${s}</span>`:'';})();
  const b=(d.bus||[])[0]||{};
  const photoBlock=(()=>{let own=d.photos||(window.PHOTO&&window.PHOTO[d.char])||[];if(!own.length)return '';const cap=d.captions||(window.CAPS&&window.CAPS[d.char])||[];own=own.map((o,i)=>{const ob=(o&&typeof o==='object')?o:{file:o};let f=String(ob.file||'');if(f.startsWith(d.char+'/'))f=f.slice(d.char.length+1);const c=ob.caption||cap[i]||'';return '<figure><img src="/glyphs/photos/'+encodeURIComponent(d.char)+'/'+encodeURIComponent(f)+'?v=20261111a"><figcaption>'+esc(c||('圖'+(i+1)))+'</figcaption></figure>';});return '<div class="sec"><h3>插图</h3><div class="pscroll">'+own.join('')+'</div></div>';})();

  return `${vhtml}<div class="card"><div class="chead"><div class="ch">${d.chapterCard?('<a href="javascript:void(0)" class="chp" onclick="goCard(\''+d.chapterCard+'\')">第'+(d.chapter||'')+'章 '+esc(d.chapterName||'')+'</a>'):sm(d.head||d.cname||ch)}${(d.bus&&d.bus[0]&&(d.bus[0].name||'').indexOf('卷')===0)?(' · '+sm(d.head||d.cname||ch)):''}${(d.simp&&!d.cname&&!(d.head||'').includes('（'))?`（${esc(d.simp)}）`:''}</div><div class="py">${esc(d.pinyin||'')}</div><div class="bu">${lvlTag}${d.chapterCard?'':('第'+String(b.num||'?')+'部 '+esc(b.name||''))}</div></div>${strip}${secs}${(opt&&opt.noPhoto)?'':photoBlock}${rootLink}${d.noRoot?'':parentBlock}${ss?'<div class="sec"><h3>所属卷</h3>'+(LKR(ss)||(ss.text?'<p>'+esc(ss.text)+'</p>':''))+'</div>':''}</div>`;
}
async function open(ch){
  const _it=(Array.isArray(IDX)?(IDX.find(x=>x.c===ch)||IDX.find(x=>((x.a||[]).includes(ch)))||IDX.find(x=>((x.v||[]).includes(ch)))):null);
  const _c=_it?_it.c:ch;
  cur=_c; render($('#q').value);
  const main=$('#main'); main.innerHTML='<div class="empty">读取中…</div>';
  let d;
  try{ d=await (await fetch('cards/'+encodeURIComponent(_c)+'.json?v='+Date.now())).json(); }
  catch(e){ main.innerHTML='<div class="empty">没有这张卡：'+esc(ch)+'</div>'; return; }
main.innerHTML = await cardBody(_c,d);
}
$('#q').addEventListener('input',e=>render(e.target.value));
try{window.goCard=open;}catch(e){}
  async function tryDirect(ch){
  try{ const r=await fetch('cards/'+encodeURIComponent(ch)+'.json?v='+Date.now()); if(!r.ok) return false; const d=await r.json(); if(!d||!d.sections) return false;
    IDX.unshift({c:ch,p:d.pinyin||'',b:((d.bus||[{}])[0]||{}).num||'',n:((d.bus||[{}])[0]||{}).name||'',t:[]}); return true; }catch(e){ return false; }
}
$('#q').addEventListener('keydown',async e=>{
  if(e.key!=='Enter') return;
  const q=e.target.value.trim();
  if(q.length===1 && !IDX.some(x=>x.c===q)){ if(await tryDirect(q)) open(q); else render(q); }
});

</script>
<script>document.addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='IMG')return;var f=t.closest('figure');if(f){f.parentNode.removeChild(f);}else{t.style.display='none';}},true);</script>
